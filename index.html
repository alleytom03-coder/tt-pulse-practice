                                  </p>
                                ) : (
                                  <table className="mini">
                                    <thead>
                                      <tr>
                                        <th>Date</th>
                                        <th>Busiest slot</th>
                                        <th>On that slot</th>
                                        <th>Free that day</th>
                                        <th />
                                      </tr>
                                    </thead>
                                    <tbody>
                                      {options.map((o) => {
                                        const oPct = Math.round(
                                          (o.primaryCount / Math.max(1, g.members.length)) * 100
                                        );
                                        return (
                                          <tr key={o.date} className={o.date === p.date ? "picked" : ""}>
                                            <td>
                                              <b>{shortDate(o.date)}</b>{" "}
                                              {o.weekend ? (
                                                <span className="chip chip-quiet chip-weekend">Wknd</span>
                                              ) : null}
                                            </td>
                                            <td className="mono">{o.primarySlot || "—"}</td>
                                            <td
                                              className={
                                                "mono" + (oPct >= threshold * 100 ? " good-text" : "")
                                              }
                                            >
                                              {o.primaryCount} of {g.members.length} · {oPct}%
                                            </td>
                                            <td className="mono">{o.free.length}</td>
                                            <td className="row-actions">
                                              <button
                                                className="btn btn-tiny"
                                                onClick={() => {
                                                  setPlanField(g.key, "date", o.date);
                                                  setPlanField(g.key, "slot", o.primarySlot);
                                                }}
                                              >
                                                Use this date
                                              </button>
                                            </td>
                                          </tr>
                                        );
                                      })}
                                    </tbody>
                                  </table>
                                )}
                              </div>

                              {p.date ? (
                                <div className="overlap-who">
                                  <h3>Who sits where on {shortDate(p.date)}</h3>
                                  <div className="sittings">
                                    <div className="sitting">
                                      <span className="eyebrow">Main · {p.slot || "no slot"}</span>
                                      <ul>
                                        {(p.primary || []).map((id) => (
                                          <li key={id}>{playerName(id)}</li>
                                        ))}
                                        {(p.primary || []).length === 0 ? (
                                          <li className="muted">Nobody yet</li>
                                        ) : null}
                                      </ul>
                                    </div>
                                    <div className="sitting">
                                      <span className="eyebrow">
                                        Second · {p.secondSlot || "not needed"}
                                      </span>
                                      <ul>
                                        {(p.second || []).map((id) => (
                                          <li key={id}>{playerName(id)}</li>
                                        ))}
                                        {(p.second || []).length === 0 ? (
                                          <li className="muted">Nobody yet</li>
                                        ) : null}
                                      </ul>
                                    </div>
                                    <div className="sitting short">
                                      <span className="eyebrow warn-text">Still to place</span>
                                      <ul>
                                        {(p.unplaced || []).map((id) => {
                                          const pl = data.players.find((x) => x.id === id);
                                          return (
                                            <li key={id}>
                                              {playerName(id)}
                                              {pl && pl.phone ? (
                                                <span className="muted mono"> {pl.phone}</span>
                                              ) : null}
                                            </li>
                                          );
                                        })}
                                        {(p.unplaced || []).length === 0 ? (
                                          <li className="muted">Nobody — the whole tier is in</li>
                                        ) : null}
                                      </ul>
                                    </div>
                                  </div>
                                </div>
                              ) : null}
                            </div>
                          </td>
                        </tr>
                      ) : null}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </section>

      <section className="card">
        <header className="card-head">
          <h2>Draw the fixtures</h2>
          <div className="head-tools">
            <label className="toggle">
              <input type="checkbox" checked={crossTier} onChange={(e) => setCrossTier(e.target.checked)} />
              <span>Also play every other tier</span>
            </label>
            <button className="btn btn-primary" onClick={generate}>
              Draw fixtures
            </button>
          </div>
        </header>
        <p className="muted plan-note">
          Every player meets their own tier on each of the other teams. With the box ticked they also
          meet every other tier on those teams — thorough, but the fixture count climbs fast. A
          cross-tier meeting is placed on the later of the two tiers' days.
        </p>
      </section>

      {fixtures.length === 0 ? (
        <Empty
          title="No fixtures drawn"
          body="Place the tiers on dates, then draw the fixtures. You can move any date or time afterwards."
        />
      ) : (
        <section className="card">
          <header className="card-head">
            <h2>Order of play</h2>
            <div className="head-tools">
              <select value={dayFilter} onChange={(e) => setDayFilter(e.target.value)}>
                <option value="all">Every day</option>
                {days.map((d) => (
                  <option key={d} value={d}>
                    {prettyDate(d)}
                  </option>
                ))}
              </select>
              <select value={catFilter} onChange={(e) => setCatFilter(e.target.value)}>
                <option value="all">Men and women</option>
                {TEAM_CATEGORIES.map((c) => (
                  <option key={c} value={c}>
                    {catLabel(c)}
                  </option>
                ))}
              </select>
              <select value={kindFilter} onChange={(e) => setKindFilter(e.target.value)}>
                <option value="all">All fixtures</option>
                <option value="tier">Tier on tier</option>
                <option value="cross">Cross tier</option>
                <option value="noslot">Needs a time</option>
              </select>
            </div>
          </header>

          <div className="table-scroll">
            <table className="fixtures">
              <thead>
                <tr>
                  <th>When</th>
                  <th>Tier</th>
                  <th>Home</th>
                  <th>Away</th>
                  <th>Type</th>
                  <th />
                </tr>
              </thead>
              <tbody>
                {shown.slice(0, 400).map((f) => (
                  <tr key={f.id} className={f.matchId ? "sent" : ""}>
                    <td>
                      <div className="when">
                        <b>{shortDate(f.date)}</b>
                        <span className={f.slot ? "muted" : "warn-text"}>
                          {f.slot || "needs a time"}
                        </span>
                      </div>
                    </td>
                    <td>
                      <span className={"chip tier-" + Math.min(f.hostTier, 5)}>
                        T{f.hostTier}
                        <em>{catLabel(f.category)}</em>
                      </span>
                    </td>
                    <td>
                      <div className="side-cell">
                        <b>{playerName(f.playerA)}</b>
                        <span className="muted">
                          {sideName(f, f.teamA)} · T{f.tierA}
                        </span>
                      </div>
                    </td>
                    <td>
                      <div className="side-cell">
                        <b>{playerName(f.playerB)}</b>
                        <span className="muted">
                          {sideName(f, f.teamB)} · T{f.tierB}
                        </span>
                      </div>
                    </td>
                    <td>
                      <span className={"chip " + (f.sameTier ? "chip-tier" : "chip-quiet")}>
                        {f.sameTier ? "Tier on tier" : "Cross tier"}
                      </span>
                    </td>
                    <td className="row-actions">
                      {f.matchId ? (
                        <span className="muted">On the scoreboard</span>
                      ) : (
                        <button className="btn btn-tiny" onClick={() => sendToScoreboard(f)}>
                          Send to scoreboard
                        </button>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {shown.length > 400 ? (
            <p className="muted plan-note">
              Showing the first 400 of {shown.length}. Narrow it with the filters above, or export the
              full list.
            </p>
          ) : null}
        </section>
      )}

      <section className="card">
        <header className="card-head">
          <h2>Tier day plan</h2>
          <span className="muted">Export this table on its own</span>
        </header>
        <DataBar name="tier-day-plan" columns={planColumns} rows={planRows} notify={notify} />
      </section>
    </div>
  );
}

   Tab: Dashboard — the page most people will ever open

function LiveBoard({ m, data, compact }) {
  const r = matchResult(m);
  const nameOf = (id) => {
    const p = data.players.find((x) => x.id === id);
    return p ? fullName(p) : "—";
  };
  const teamOf = (id) => (data.teams.find((t) => t.id === id) || {}).name || "";
  const sideLabel = (id) => (m.individual ? catLabel(m.category) : teamOf(id));
  const live = m.status === "live" && !r.complete;
  const i = activeSetIndex(m);
  const cur = i === -1 ? null : m.sets[i];

  return (
    <div className={"board" + (live ? " live" : "")}>
      <div className="board-top">
        <span className={"status " + (live ? "live" : "final")}>{live ? "Live" : "Final"}</span>
        <span className="muted">
          {shortDate(m.date)}
          {m.scorer ? " · scored by " + m.scorer : ""}
        </span>
      </div>
      <div className="board-body">
        <div className={"side" + (r.winner === "a" ? " won" : "")}>
          <span className="side-team">{sideLabel(m.teamA)}</span>
          <span className="side-player">{nameOf(m.playerA)}</span>
          <span className="side-sets mono">{r.aSets}</span>
        </div>
        <div className="net" />
        <div className={"side right" + (r.winner === "b" ? " won" : "")}>
          <span className="side-team">{sideLabel(m.teamB)}</span>
          <span className="side-player">{nameOf(m.playerB)}</span>
          <span className="side-sets mono">{r.bSets}</span>
        </div>
      </div>
      {cur && !compact ? (
        <div className="rally">
          <div className="rally-label">Set {i + 1} in play</div>
          <div className="rally-grid">
            <div className="rally-side">
              <span className="rally-score mono">{num(cur.a)}</span>
            </div>
            <span className="rally-dash">–</span>
            <div className="rally-side">
              <span className="rally-score mono">{num(cur.b)}</span>
            </div>
          </div>
        </div>
      ) : null}
      <div className="sets-row">
        {m.sets.map((s, idx) => (
          <div key={idx} className={"set-box" + (idx === i ? " current" : setDone(s) ? " done" : "")}>
            <div className="set-label">Set {idx + 1}</div>
            <div className="set-readout mono">
              {num(s.a)}–{num(s.b)}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function DashboardTab({ data, role, notify }) {
  const today = ymd(new Date());
  const [day, setDay] = useState(today);

  const playDays = Array.from(
    new Set([
      ...(data.fixtures || []).map((f) => f.date).filter(Boolean),
      ...data.matches.map((m) => m.date),
      today,
    ])
  ).sort();

  const nameOf = (id) => {
    const p = data.players.find((x) => x.id === id);
    return p ? fullName(p) : "—";
  };
  const teamOf = (id) => (data.teams.find((t) => t.id === id) || {}).name || "—";

  const liveNow = data.matches.filter((m) => m.status === "live" && !matchResult(m).complete);
  const finishedToday = data.matches.filter((m) => m.date === day && matchResult(m).complete);
  const upcoming = (data.fixtures || [])
    .filter((f) => f.date === day && !f.matchId)
    .sort((a, b) => SLOTS.indexOf(a.slot) - SLOTS.indexOf(b.slot) || a.hostTier - b.hostTier);
  const nextMatch = upcoming[0] || null;
  const cloudLive = !!(window.storage && window.storage.online && window.storage.online());

  const table = computeStandings(data, day).filter((t) => t.played > 0);
  const overall = computeStandings(data, "all");

  const bySlot = {};
  upcoming.forEach((f) => {
    const k = f.slot || "Time to be set";
    (bySlot[k] = bySlot[k] || []).push(f);
  });
  const slotOrder = Object.keys(bySlot).sort((a, b) => SLOTS.indexOf(a) - SLOTS.indexOf(b));

  /* Which tiers are called in on this day, drawn straight from the
     fixtures. One line per category and tier, with the slot and how much
     of it is still to play. */
  const callUps = useMemo(() => {
    const map = {};
    (data.fixtures || [])
      .filter((f) => f.date === day)
      .forEach((f) => {
        const k = f.category + "|" + f.hostTier;
        const row = (map[k] = map[k] || {
          category: f.category,
          tier: f.hostTier,
          slots: {},
          total: 0,
          left: 0,
          players: new Set(),
        });
        row.total++;
        if (!f.matchId) row.left++;
        if (f.slot) row.slots[f.slot] = true;
        row.players.add(f.playerA);
        row.players.add(f.playerB);
      });
    return Object.values(map).sort(
      (a, b) =>
        CATEGORIES.findIndex((c) => c.key === a.category) -
          CATEGORIES.findIndex((c) => c.key === b.category) || a.tier - b.tier
    );
  }, [data.fixtures, data.matches, day]);

  const onDuty = (data.refDuty || {})[day] || [];

  /* A quiet nudge on the phone when the day's call sheet changes. The
     browser only allows it once the member has tapped the bell. */
  const [alerts, setAlerts] = useState(
    typeof Notification !== "undefined" && Notification.permission === "granted"
  );
  const signature =
    day + "::" + callUps.map((c) => c.category + c.tier + Object.keys(c.slots).join("/")).join(",");

  useEffect(() => {
    if (!alerts || day !== today || !callUps.length) return;
    try {
      if (localStorage.getItem("tt_last_callup") === signature) return;
      localStorage.setItem("tt_last_callup", signature);
      new Notification("TT Pulse — playing today", {
        body: callUps
          .map((c) => catLabel(c.category) + " T" + c.tier + (Object.keys(c.slots)[0] ? " " + Object.keys(c.slots)[0] : ""))
          .join(" · "),
        tag: "tt-callup",
      });
    } catch (e) {
      /* notifications blocked — the banner below still says it all */
    }
  }, [alerts, signature, day]);

  const askAlerts = async () => {
    try {
      const p = await Notification.requestPermission();
      if (p === "granted") {
        setAlerts(true);
        notify("You will get a nudge when the day's tiers are called.");
      } else {
        notify("Your phone is blocking notifications for this app.");
      }
    } catch (e) {
      notify("This device does not support notifications.");
    }
  };

  return (
    <div className="stack dash">
      <section className="dash-hero">
        <div>
          <span className="eyebrow">{day === today ? "Today" : "Match day"}</span>
          <h2>{prettyDate(day)}</h2>
          <p className="muted">
            {liveNow.length} in play · {upcoming.length} still to come · {finishedToday.length} finished
          </p>
        </div>
        <div style={{display:"flex",gap:"10px",alignItems:"center",flexWrap:"wrap",justifyContent:"flex-end"}}>
          {role === "public" ? (
            <a className="btn btn-primary" href="tt-pulse-registration.html">Register now</a>
          ) : null}
          <select className="day-pick" value={day} onChange={(e) => setDay(e.target.value)}>
            {playDays.map((d) => (
              <option key={d} value={d}>
                {prettyDate(d)}
                {d === today ? " — today" : ""}
              </option>
            ))}
          </select>
        </div>
      </section>

      <section className="public-live-summary">
        <div className={"sync-pill " + (cloudLive ? "online" : "offline")}>
          <span className="sync-dot" />
          {cloudLive ? "Live sync connected" : "Demo/local mode — connect cloud for society-wide live updates"}
        </div>

        {liveNow.length > 0 ? (
          <div className="public-live-card">
            <div className="public-live-title"><span className="live-pulse" /> LIVE NOW</div>
            <LiveBoard m={liveNow[0]} data={data} />
            {liveNow.length > 1 ? <div className="muted small">+ {liveNow.length - 1} more match{liveNow.length > 2 ? "es" : ""} live</div> : null}
          </div>
        ) : (
          <div className="public-live-card waiting">
            <div className="public-live-title">LIVE NOW</div>
            <strong>No match currently in play</strong>
            <span className="muted">The scoreboard appears here as soon as the referee/admin starts scoring.</span>
          </div>
        )}

        <div className="next-match-card">
          <div>
            <span className="eyebrow">Up next</span>
            {nextMatch ? (
              <>
                <h3>{nameOf(nextMatch.playerA)} <span className="vs">vs</span> {nameOf(nextMatch.playerB)}</h3>
                <p>{teamOf(nextMatch.teamA)} · {teamOf(nextMatch.teamB)}</p>
              </>
            ) : (
              <>
                <h3>No upcoming fixture</h3>
                <p>The next scheduled match will appear here.</p>
              </>
            )}
          </div>
          {nextMatch ? (
            <div className="next-time">
              <strong>{nextMatch.slot || "Time TBC"}</strong>
              <span>{catLabel(nextMatch.category)} · Tier {nextMatch.hostTier || "—"}</span>
            </div>
          ) : null}
        </div>
      </section>

      <section className="card callup">
        <header className="card-head">
          <h2>Players scheduled for this day</h2>
          {typeof Notification !== "undefined" && !alerts ? (
            <button className="btn btn-tiny" onClick={askAlerts}>
              Notify me
            </button>
          ) : (
            <span className="muted">{callUps.length} tiers called</span>
          )}
        </header>
        {callUps.length === 0 ? (
          <Empty
            title="No tier is called in yet"
            body="Once the draw is made, the tiers playing that day are announced here."
          />
        ) : (
          <>
            <div className="callup-row">
              {callUps.map((c) => (
                <div className="callup-chip" key={c.category + c.tier}>
                  <span className={"chip tier-" + Math.min(c.tier, 5)}>
                    T{c.tier}
                    <em>{catLabel(c.category)}</em>
                  </span>
                  <span className="callup-meta">
                    <b>{Object.keys(c.slots).join(" · ") || "time to be set"}</b>
                    <i>
                      {c.players.size} players · {c.left} of {c.total} still to play
                    </i>
                  </span>
                </div>
              ))}
            </div>
            <p className="muted">
              {onDuty.length
                ? "Keeping score today: " + onDuty.map((x) => x.name).join(", ") + "."
                : "No referee named for this day yet."}
            </p>
          </>
        )}
      </section>

      {role !== "public" ? (
        <section className="card">
          <header className="card-head">
            <h2>In play now</h2>
            <span className="muted">Refreshes as the referee scores</span>
          </header>
          {liveNow.length === 0 ? (
            <Empty title="Nothing on the tables" body="Live scores appear here the moment a referee starts a match." />
          ) : (
            <div className="board-stack">
              {liveNow.map((m) => (
                <LiveBoard key={m.id} m={m} data={data} />
              ))}
            </div>
          )}
        </section>
      ) : null}

      <section className="card">
        <header className="card-head">
          <h2>Still to play</h2>
          <span className="muted">{upcoming.length} fixtures</span>
        </header>
        {upcoming.length === 0 ? (
          <Empty title="Nothing left on this day" body="Draw fixtures on the Fixtures page to fill the order of play." />
        ) : (
          <div className="op">
            {slotOrder.map((slot) => (
              <div className="op-block" key={slot}>
                <div className="op-slot">
                  <span className="mono">{slot}</span>
                  <em>{bySlot[slot].length} matches</em>
                </div>
                <ul className="op-list">
                  {bySlot[slot].slice(0, 30).map((f) => (
                    <li key={f.id}>
                      <span className={"chip tier-" + Math.min(f.hostTier, 5)}>
                        T{f.hostTier}
                        <em>{catLabel(f.category)}</em>
                      </span>
                      <span className="op-names">
                        <b>{nameOf(f.playerA)}</b>
                        <i>v</i>
                        <b>{nameOf(f.playerB)}</b>
                      </span>
                      <span className="muted op-teams">
                        {teamOf(f.teamA)} · {teamOf(f.teamB)}
                      </span>
                    </li>
                  ))}
                  {bySlot[slot].length > 30 ? (
                    <li className="muted">and {bySlot[slot].length - 30} more in this slot</li>
                  ) : null}
                </ul>
              </div>
            ))}
          </div>
        )}
      </section>

      <section className="card">
        <header className="card-head">
          <h2>Standings on the day</h2>
          <span className="muted">5 a set · 25 a match</span>
        </header>
        {table.length === 0 ? (
          <Empty title="No results yet on this day" body="The day's table builds itself as matches finish." />
        ) : (
          <div className="table-scroll">
            <table className="standings">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Team</th>
                  <th>P</th>
                  <th>Sets W–L</th>
                  <th>Today</th>
                  <th>Overall</th>
                </tr>
              </thead>
              <tbody>
                {table.map((t, i) => {
                  const all = overall.find((x) => x.id === t.id) || { points: 0 };
                  return (
                    <tr key={t.id} className={i === 0 ? "first" : ""}>
                      <td className="mono rank">{i + 1}</td>
                      <td className="strong">{t.name}</td>
                      <td className="mono">{t.played}</td>
                      <td className="mono">
                        {t.setsWon}–{t.setsLost}
                      </td>
                      <td className="mono total">{t.points}</td>
                      <td className="mono">{all.points}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </section>

      {finishedToday.length ? (
        <section className="card">
          <header className="card-head">
            <h2>Finished on this day</h2>
            <span className="muted">{finishedToday.length} results</span>
          </header>
          <div className="board-stack">
            {finishedToday.slice(0, 12).map((m) => (
              <LiveBoard key={m.id} m={m} data={data} compact />
            ))}
          </div>
        </section>
      ) : null}
    </div>
  );
}

/* ============================================================
   Tab: Report — day one to the closing match
   ============================================================ */

function ReportTab({ data, tiers, notify }) {
  const days = Array.from(new Set(data.matches.map((m) => m.date))).sort();
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const [year, setYear] = useState("");
  const [h2hPlayer, setH2hPlayer] = useState("");

  /* A season is a year. The report opens on the most recent one, which is
     what the awards night wants, and the dates below still override it. */
  const years = Array.from(new Set(days.map((d) => d.slice(0, 4)))).sort();
  const season = year || years[years.length - 1] || "";
  const seasonDays = season ? days.filter((d) => d.slice(0, 4) === season) : days;

  const start = from || seasonDays[0] || "";
  const end = to || seasonDays[seasonDays.length - 1] || "";

  const inRange = (d) => (!start || d >= start) && (!end || d <= end);
  const matches = data.matches.filter((m) => inRange(m.date));
  const decided = matches.filter((m) => matchResult(m).complete);

  const rally = matches.reduce(
    (sum, m) => sum + (m.sets || []).reduce((s, x) => s + num(x.a) + num(x.b), 0),
    0
  );
  const setsPlayed = matches.reduce((sum, m) => sum + (m.sets || []).filter(setDone).length, 0);
  const straight = decided.filter((m) => {
    const r = matchResult(m);
    return r.aSets + r.bSets === 2;
  }).length;

  /* Teams over the range. */
  const teamRows = data.teams
    .map((t) => {
      let played = 0,
        wins = 0,
        setsWon = 0,
        setsLost = 0,
        points = 0,
        rallyFor = 0,
        rallyAgainst = 0;
      matches.forEach((m) => {
        const isA = m.teamA === t.id;
        const isB = m.teamB === t.id;
        if (!isA && !isB) return;
        const r = matchResult(m);
        played++;
        if ((isA && r.winner === "a") || (isB && r.winner === "b")) wins++;
        setsWon += isA ? r.aSets : r.bSets;
        setsLost += isA ? r.bSets : r.aSets;
        points += isA ? r.aPts : r.bPts;
        (m.sets || []).forEach((s) => {
          rallyFor += isA ? num(s.a) : num(s.b);
          rallyAgainst += isA ? num(s.b) : num(s.a);
        });
      });
      return {
        team: t,
        played,
        wins,
        setsWon,
        setsLost,
        points,
        rallyFor,
        rallyAgainst,
        winPct: played ? Math.round((wins / played) * 100) : 0,
      };
    })
    .filter((r) => r.played > 0)
    .sort((a, b) => b.points - a.points || b.wins - a.wins || b.setsWon - a.setsWon);

  /* Individuals over the range. */
  const playerRows = data.players
    .map((p) => {
      let played = 0,
        won = 0,
        setsWon = 0,
        setsLost = 0,
        rallyFor = 0,
        rallyAgainst = 0,
        points = 0;
      matches.forEach((m) => {
        const isA = m.playerA === p.id;
        const isB = m.playerB === p.id;
        if (!isA && !isB) return;
        const r = matchResult(m);
        played++;
        if ((isA && r.winner === "a") || (isB && r.winner === "b")) won++;
        setsWon += isA ? r.aSets : r.bSets;
        setsLost += isA ? r.bSets : r.aSets;
        points += isA ? r.aPts : r.bPts;
        (m.sets || []).forEach((s) => {
          rallyFor += isA ? num(s.a) : num(s.b);
          rallyAgainst += isA ? num(s.b) : num(s.a);
        });
      });
      const team = data.teams.find((t) => t.playerIds.includes(p.id));
      return {
        player: p,
        team,
        played,
        won,
        lost: played - won,
        setsWon,
        setsLost,
        rallyFor,
        rallyAgainst,
        points,
        winPct: played ? Math.round((won / played) * 100) : 0,
        diff: rallyFor - rallyAgainst,
      };
    })
    .filter((r) => r.played > 0)
    .sort((a, b) => b.points - a.points || b.won - a.won || b.diff - a.diff);

  /* Who met whom, and who came off better. */
  const h2h = {};
  matches.forEach((mt) => {
    if (!mt.playerA || !mt.playerB) return;
    const r = matchResult(mt);
    const add = (me, opp, won) => {
      const row = (h2h[me] = h2h[me] || {});
      const cell = (row[opp] = row[opp] || { played: 0, won: 0 });
      cell.played++;
      if (won) cell.won++;
    };
    add(mt.playerA, mt.playerB, r.winner === "a");
    add(mt.playerB, mt.playerA, r.winner === "b");
  });

  const tierOf = (pid) => (tiers[pid] ? tiers[pid].tier : null);
  const teamNameOf = (pid) => {
    const t = data.teams.find((x) => x.playerIds.includes(pid));
    return t ? t.name : "";
  };
  const playerById = (pid) => data.players.find((x) => x.id === pid);

  /* The ladder inside each tier of each category — the line the awards
     night actually reads out. */
  const tierGroups = [];
  CATEGORIES.forEach((c) => {
    const inCat = playerRows.filter((r) => r.player.gender === c.key);
    const nums = Array.from(new Set(inCat.map((r) => tierOf(r.player.id)).filter(Boolean))).sort(
      (a, b) => a - b
    );
    nums.forEach((t) => {
      const list = inCat
        .filter((r) => tierOf(r.player.id) === t)
        .sort((a, b) => b.points - a.points || b.won - a.won || b.diff - a.diff);
      if (list.length) tierGroups.push({ category: c.key, tier: t, list });
    });
  });

  const tierColumns = ["Category", "Tier", "Rank", "Player", "Team", "Played", "Won", "Lost", "Win %", "Points"];
  const tierExport = [];
  tierGroups.forEach((g) =>
    g.list.forEach((r, i) =>
      tierExport.push([
        catLabel(g.category),
        "T" + g.tier,
        i + 1,
        fullName(r.player),
        r.team ? r.team.name : "",
        r.played,
        r.won,
        r.lost,
        r.winPct + "%",
        r.points,
      ])
    )
  );

  const h2hColumns = [
    "Player",
    "Category",
    "Tier",
    "Team",
    "Opponent",
    "Opponent tier",
    "Opponent team",
    "Played",
    "Won",
    "Lost",
  ];
  const h2hExport = [];
  playerRows.forEach((r) => {
    const opps = h2h[r.player.id] || {};
    Object.keys(opps).forEach((oid) => {
      const o = playerById(oid);
      if (!o) return;
      h2hExport.push([
        fullName(r.player),
        catLabel(r.player.gender),
        tierOf(r.player.id) ? "T" + tierOf(r.player.id) : "",
        r.team ? r.team.name : "",
        fullName(o),
        tierOf(oid) ? "T" + tierOf(oid) : "",
        teamNameOf(oid),
        opps[oid].played,
        opps[oid].won,
        opps[oid].played - opps[oid].won,
      ]);
    });
  });

  const h2hSubject = h2hPlayer || (playerRows[0] ? playerRows[0].player.id : "");
  const h2hRows = Object.entries(h2h[h2hSubject] || {})
    .map(([oid, v]) => ({ opp: playerById(oid), ...v }))
    .filter((x) => x.opp)
    .sort((a, b) => b.played - a.played || b.won - a.won);

  const mostPlayed = playerRows.slice().sort((a, b) => b.played - a.played)[0];
  const bestDiff = playerRows.slice().sort((a, b) => b.diff - a.diff)[0];

  const mvp = playerRows[0];
  const bestPct = playerRows
    .filter((r) => r.played >= 3)
    .slice()
    .sort((a, b) => b.winPct - a.winPct || b.played - a.played)[0];

  const columns = [
    "Player",
    "Team",
    "Category",
    "Tier",
    "Played",
    "Won",
    "Lost",
    "Win %",
    "Sets Won",
    "Sets Lost",
    "Rally Points For",
    "Rally Points Against",
    "Point Difference",
    "Points Contributed",
  ];
  const rows = playerRows.map((r) => [
    fullName(r.player),
    r.team ? r.team.name : "",
    catLabel(r.player.gender),
    tiers[r.player.id] ? tiers[r.player.id].tier : "",
    r.played,
    r.won,
    r.lost,
    r.winPct + "%",
    r.setsWon,
    r.setsLost,
    r.rallyFor,
    r.rallyAgainst,
    r.diff,
    r.points,
  ]);

  const teamColumns = [
    "Team",
    "Played",
    "Won",
    "Win %",
    "Sets Won",
    "Sets Lost",
    "Rally Points For",
    "Rally Points Against",
    "Points",
  ];
  const teamExport = teamRows.map((r) => [
    r.team.name,
    r.played,
    r.wins,
    r.winPct + "%",
    r.setsWon,
    r.setsLost,
    r.rallyFor,
    r.rallyAgainst,
    r.points,
  ]);

  return (
    <div className="stack">
      <section className="card">
        <header className="card-head">
          <h2>Tournament report{season ? " " + season : ""}</h2>
          <div className="head-tools">
            {years.length > 1 ? (
              <label className="range">
                <span>Season</span>
                <select
                  value={season}
                  onChange={(e) => {
                    setYear(e.target.value);
                    setFrom("");
                    setTo("");
                  }}
                >
                  {years.map((y) => (
                    <option key={y} value={y}>
                      {y}
                    </option>
                  ))}
                </select>
              </label>
            ) : null}
            <label className="range">
              <span>From</span>
              <input type="date" value={start} onChange={(e) => setFrom(e.target.value)} />
            </label>
            <label className="range">
              <span>To</span>
              <input type="date" value={end} onChange={(e) => setTo(e.target.value)} />
            </label>
            <button className="btn btn-ghost" onClick={() => window.print()}>
              Print
            </button>
          </div>
        </header>

        {matches.length === 0 ? (
          <Empty title="No matches in this range" body="Play a match, or widen the dates above." />
        ) : (
          <>
            <p className="muted plan-note">
              {days.length ? `Day 1 was ${prettyDate(days[0])}. ` : ""}
              This report covers {prettyDate(start)} to {prettyDate(end)}.
            </p>
            <div className="stat-grid">
              <div className="stat accent">
                <span>{matches.length}</span>
                <em>Matches</em>
              </div>
              <div className="stat">
                <span>{setsPlayed}</span>
                <em>Sets</em>
              </div>
              <div className="stat">
                <span>{rally}</span>
                <em>Rally points</em>
              </div>
              <div className="stat">
                <span>{playerRows.length}</span>
                <em>Players out</em>
              </div>
              <div className="stat">
                <span>{straight}</span>
                <em>Straight-set wins</em>
              </div>
              <div className="stat">
                <span>{decided.length ? Math.round((straight / decided.length) * 100) : 0}%</span>
                <em>Decided in two</em>
              </div>
            </div>
          </>
        )}
      </section>

      {mvp ? (
        <section className="card">
          <header className="card-head">
            <h2>Standouts</h2>
          </header>
          <div className="standouts">
            <div className="standout">
              <span className="eyebrow">Most points contributed</span>
              <h3>{fullName(mvp.player)}</h3>
              <p className="muted">
                {mvp.points} points · {mvp.won} of {mvp.played} won ·{" "}
                {mvp.team ? mvp.team.name : "no team"}
              </p>
            </div>
            {bestPct ? (
              <div className="standout">
                <span className="eyebrow">Best win rate (3+ matches)</span>
                <h3>{fullName(bestPct.player)}</h3>
                <p className="muted">
                  {bestPct.winPct}% · {bestPct.won} of {bestPct.played} ·{" "}
                  {bestPct.team ? bestPct.team.name : "no team"}
                </p>
              </div>
            ) : null}
            {teamRows[0] ? (
              <div className="standout">
                <span className="eyebrow">Leading team</span>
                <h3>{teamRows[0].team.name}</h3>
                <p className="muted">
                  {teamRows[0].points} points · {teamRows[0].wins} of {teamRows[0].played} won
                </p>
              </div>
            ) : null}
            {mostPlayed ? (
              <div className="standout">
                <span className="eyebrow">Most matches played</span>
                <h3>{fullName(mostPlayed.player)}</h3>
                <p className="muted">
                  {mostPlayed.played} matches · {mostPlayed.won} won
                </p>
              </div>
            ) : null}
            {bestDiff ? (
              <div className="standout">
                <span className="eyebrow">Best point difference</span>
                <h3>{fullName(bestDiff.player)}</h3>
                <p className="muted">
                  {bestDiff.diff > 0 ? "+" : ""}
                  {bestDiff.diff} across {bestDiff.played} matches
                </p>
              </div>
            ) : null}
          </div>
        </section>
      ) : null}

      {tierGroups.length ? (
        <section className="card">
          <header className="card-head">
            <h2>Roll of honour {season}</h2>
            <span className="muted">one champion per tier</span>
          </header>
          <div className="honour">
            {tierGroups.map((g) => {
              const w = g.list[0];
              return (
                <div className="honour-row" key={g.category + g.tier}>
                  <span className={"chip tier-" + Math.min(g.tier, 5)}>
                    T{g.tier}
                    <em>{catLabel(g.category)}</em>
                  </span>
                  <span className="honour-name">
                    <b>{fullName(w.player)}</b>
                    <i>{w.team ? w.team.name : "no team"}</i>
                  </span>
                  <span className="mono muted">
                    {w.won}/{w.played} won · {w.points} pts
                  </span>
                </div>
              );
            })}
          </div>
        </section>
      ) : null}

      {teamRows.length ? (
        <section className="card">
          <header className="card-head">
            <h2>Team performance</h2>
          </header>
          <DataBar name="report-teams" columns={teamColumns} rows={teamExport} notify={notify} />
          <div className="table-scroll">
            <table className="standings">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Team</th>
                  <th>P</th>
                  <th>W</th>
                  <th>Win %</th>
                  <th>Sets W–L</th>
                  <th>Rally F–A</th>
                  <th>Points</th>
                </tr>
              </thead>
              <tbody>
                {teamRows.map((r, i) => (
                  <tr key={r.team.id} className={i === 0 ? "first" : ""}>
                    <td className="mono rank">{i + 1}</td>
                    <td className="strong">{r.team.name}</td>
                    <td className="mono">{r.played}</td>
                    <td className="mono">{r.wins}</td>
                    <td className="mono">{r.winPct}%</td>
                    <td className="mono">
                      {r.setsWon}–{r.setsLost}
                    </td>
                    <td className="mono">
                      {r.rallyFor}–{r.rallyAgainst}
                    </td>
                    <td className="mono total">{r.points}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </section>
      ) : null}

      {playerRows.length ? (
        <section className="card">
          <header className="card-head">
            <h2>Individual performance</h2>
            <span className="muted">{playerRows.length} players</span>
          </header>
          <DataBar name="report-players" columns={columns} rows={rows} notify={notify} />
          <div className="table-scroll">
            <table className="standings">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Player</th>
                  <th>Team</th>
                  <th>Tier</th>
                  <th>P</th>
                  <th>W–L</th>
                  <th>Win %</th>
                  <th>Sets W–L</th>
                  <th>Diff</th>
                  <th>Points</th>
                </tr>
              </thead>
              <tbody>
                {playerRows.slice(0, 200).map((r, i) => (
                  <tr key={r.player.id} className={i === 0 ? "first" : ""}>
                    <td className="mono rank">{i + 1}</td>
                    <td className="strong">{fullName(r.player)}</td>
                    <td>{r.team ? r.team.name : <span className="muted">—</span>}</td>
                    <td>
                      <TierChip tier={tiers[r.player.id] ? tiers[r.player.id].tier : null} />
                    </td>
                    <td className="mono">{r.played}</td>
                    <td className="mono">

   Sign in
   ============================================================ */

function SignIn({ data, onEnter, notify }) {
  const [choice, setChoice] = useState(null);
  const [code, setCode] = useState("");
  const codes = data.codes || {};

  const submit = () => {
    if (!choice) return;
    if (!choice.needsCode) return onEnter(choice.key);
    const given = code.trim().toUpperCase();
    if (given && given === String(codes[choice.key] || "").toUpperCase()) {
      onEnter(choice.key);
      return;
    }
    notify("That code does not match. Check with whoever runs the tournament.");
    setCode("");
  };

  return (
    <div className="gate">
      <div className="gate-inner">
        <div className="gate-brand">
          <span className="brand-ball" aria-hidden="true" />
          <h1>{data.tournamentName}</h1>
        </div>
        <p className="gate-sub">Pick how you are coming in.</p>

        <div className="gate-roles">
          {ROLES.map((r) => (
            <button
              key={r.key}
              className={"gate-role" + (choice && choice.key === r.key ? " on" : "")}
              onClick={() => {
                setChoice(r);
                setCode("");
              }}
            >
              <b>{r.label}</b>
              <span>{r.blurb}</span>
              {r.needsCode ? <i className="gate-lock">Code needed</i> : <i className="gate-open">Open</i>}
            </button>
          ))}
        </div>

        {choice ? (
          <div className="gate-enter">
            {choice.needsCode ? (
              <input
                className="gate-code mono"
                value={code}
                autoFocus
                maxLength={12}
                onChange={(e) => setCode(e.target.value.toUpperCase())}
                onKeyDown={(e) => e.key === "Enter" && submit()}
                placeholder="Access code"
                aria-label={choice.label + " access code"}
              />
            ) : null}
            <button className="btn btn-primary" onClick={submit}>
              Enter as {choice.label.toLowerCase()}
            </button>
          </div>
        ) : null}
      </div>
    </div>
  );
}

   Tab: Registrations
   ============================================================ */
function RegistrationsTab({ data, update, notify }) {
  const regs = data.registrations || [];
  const paid = regs.filter((r) => r.paymentStatus === "Paid").length;
  const pending = regs.filter((r) => r.paymentStatus !== "Paid").length;
  const imported = regs.filter((r) => r.playerId).length;

  const setPayment = (id, value) => {
    update((d) => ({ ...d, registrations: (d.registrations || []).map((r) => r.id === id ? { ...r, paymentStatus: value } : r) }));
  };

  const addPlayer = (r) => {
    if (r.playerId) return notify("This registration is already in Players.");
    const exists = (data.players || []).find((p) =>
      String(p.phone || "").replace(/\D/g, "") === String(r.phone || "").replace(/\D/g, "") && String(r.phone || "").trim()
    );
    if (exists) return notify("A player with this phone number already exists.");
    const gender = r.category === "Kid" ? (r.gender === "Female" ? "Girl" : "Boy") : r.gender;
    const player = {
      id: uid(), first: r.first || "", last: r.last || "", phone: r.phone || "",
      flat: r.flat || "", gender, calibration: blankCal(), score: 0,
      registrationDate: r.registrationDate || "", paymentStatus: r.paymentStatus || "Pending"
    };
    update((d) => {
      const nextRegs = (d.registrations || []).map((x) => x.id === r.id ? { ...x, playerId: player.id, status: "Confirmed" } : x);
      const av = { ...(d.availability || {}) };
      (r.availability || []).forEach((a) => {
        const k = player.id + "|" + a.date;
        av[k] = Array.from(new Set([...(av[k] || []), a.slot]));
      });
      return { ...d, players: [...(d.players || []), player], registrations: nextRegs, availability: av };
    });
    notify("Registration added to Players and availability copied.");
  };

  const removeReg = (id) => {
    if (!window.confirm("Delete this registration record?")) return;
    update((d) => ({ ...d, registrations: (d.registrations || []).filter((r) => r.id !== id) }));
  };

  const rows = regs.map((r) => [
    r.registrationDate || "", r.first || "", r.last || "", r.phone || "", r.gender || "", r.category || "",
    r.flat || "", (r.availability || []).map((a) => `${a.date} ${a.slot}`).join(" | "),
    r.paymentStatus || "Pending", r.paymentRef || "", r.registrationList || "Confirmed List", r.status || "New"
  ]);

  return (
    <div className="page">
      <div className="page-head">
        <div><span className="eyebrow">Admin</span><h2>Registrations</h2><p>Public registrations, payment verification and one-click transfer into Players.</p></div>
        <a className="btn btn-primary" href="tt-pulse-registration.html" target="_blank" rel="noreferrer">Open public form</a>
      </div>

      <div className="stat-grid">
        <div className="stat"><span>Total</span><strong>{regs.length}</strong></div>
        <div className="stat"><span>Paid</span><strong>{paid}</strong></div>
        <div className="stat"><span>Payment pending</span><strong>{pending}</strong></div>
        <div className="stat"><span>Added to Players</span><strong>{imported}</strong></div>
      </div>

      <DataBar name="tt-registrations" columns={["Registration Date","First Name","Last Name","Phone","Gender","Category","Flat No","Availability","Payment Status","Payment Ref","List","Status"]} rows={rows} notify={notify} />

      <section className="card">
        <div className="section-head"><div><h3>Registration queue</h3><p className="muted">Verify payment, then add the participant to Players.</p></div></div>
        {regs.length === 0 ? <Empty title="No registrations yet" body="Share the public registration page with participants. New submissions will appear here." /> : (
          <div className="table-scroll"><table><thead><tr><th>Name</th><th>Contact</th><th>Category</th><th>Flat</th><th>Availability</th><th>Payment</th><th>Action</th></tr></thead><tbody>
          {regs.slice().reverse().map((r) => <tr key={r.id}>
            <td><strong>{r.first} {r.last}</strong><div className="muted small">{r.registrationDate}</div></td>
            <td>{r.phone}<div className="muted small">{r.registrationList || "Confirmed List"}</div></td><td>{r.category === "Kid" ? `${r.gender} Kid` : r.gender}</td><td>{r.flat}</td>
            <td><div className="small">{(r.availability || []).length ? (r.availability || []).map((a) => `${a.date} · ${a.slot}`).join("; ") : "—"}</div></td>
            <td><select value={r.paymentStatus || "Pending"} onChange={(e) => setPayment(r.id, e.target.value)}><option>Pending</option><option>Paid</option><option>Failed</option><option>Refunded</option></select><div className="muted small">{r.paymentRef || "No reference"}</div></td>
            <td><div className="row-actions">{r.playerId ? <span className="chip chip-quiet">In Players</span> : <button className="btn btn-primary btn-small" disabled={r.paymentStatus !== "Paid"} onClick={() => addPlayer(r)}>Add to Players</button>}<button className="btn btn-ghost btn-small" onClick={() => removeReg(r.id)}>Delete</button></div></td>
          </tr>)}
          </tbody></table></div>
        )}
      </section>
    </div>
  );
}

const SESSION_KEY = "tt_society_role";

function App() {
  const [data, setData] = useState(EMPTY);
  const [ready, setReady] = useState(false);
  const [role, setRole] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [toast, setToast] = useState("");
  const stamp = useRef("");
  const mark = useRef("");

  const notify = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 3200);
  };

  useEffect(() => {
    (async () => {
      let saved = null;
      try {
        const res = await window.storage.get(STORE_KEY);
        if (res && res.value) {
          stamp.current = res.value;
          saved = JSON.parse(res.value);
        }
      } catch (e) {
        /* first run — no saved data */
      }
      const next = { ...EMPTY, ...(saved || {}) };
      // Merge tier counts so the two new junior categories always have one.
      next.tierCounts = { ...EMPTY.tierCounts, ...(next.tierCounts || {}) };
      delete next.tierCounts.Kid;
      // Anyone saved under the old single "Kid" category is split by first name.
      if (Array.isArray(next.players)) {
        next.players = next.players.map((p) => {
          if (p.gender !== "Kid") return p;
          const g = guessGenderFromName(p.first);
          return { ...p, gender: g === "Female" ? "Girl" : "Boy", catSource: "guess" };
        });
      }
      if (!next.tournamentName || /society table tennis/i.test(next.tournamentName)) {
        next.tournamentName = "TT Pulse";
      }
      if (!next.codes) {
        next.codes = freshCodes();
        try {
          await window.storage.set(STORE_KEY, JSON.stringify(next));
        } catch (e) {
          /* nothing to do */
        }
      }
      setData(next);
      try {
        const r = sessionStorage.getItem(SESSION_KEY);
        if (r && ROLE_RANK[r] != null) setRole(r);
      } catch (e) {
        /* sessionStorage blocked — sign in again */
      }
      setReady(true);
    })();
  }, []);

  /* Referees score on one phone, everyone else watches on theirs. Ask the
     store how fresh it is; only fetch the whole tournament when the answer
     has changed. With Supabase filled in that is a live feed across
     devices, without it this is still one device talking to itself. */
  useEffect(() => {
    if (!ready) return;
    const pull = async () => {
      if (window.storage.busy && window.storage.busy()) return;
      // A phone in a pocket should not be asking the server anything.
      if (document.visibilityState === "hidden") return;
      try {
        const tok = await window.storage.stamp(STORE_KEY);
        if (tok && tok === mark.current) return;
        const res = await window.storage.get(STORE_KEY);
        if (res && res.stamp) mark.current = res.stamp;
        if (res && res.value && res.value !== stamp.current) {
          stamp.current = res.value;
          setData({ ...EMPTY, ...JSON.parse(res.value) });
        }
      } catch (e) {
        /* nothing saved yet */
      }
    };
    const id = setInterval(pull, window.storage.online && window.storage.online() ? 3000 : 2000);
    window.addEventListener("storage", pull);
    document.addEventListener("visibilitychange", pull);
    return () => {
      clearInterval(id);
      window.removeEventListener("storage", pull);
      document.removeEventListener("visibilitychange", pull);
    };
  }, [ready]);

  const update = (fn) => {
    setData((prev) => {
      const next = fn(prev);
      const json = JSON.stringify(next);
      stamp.current = json;
      (async () => {
        try {
          await window.storage.set(STORE_KEY, json);
        } catch (e) {
          console.error("Could not save", e);
        }
      })();
      return next;
    });
  };

  const tierSize = data.tierByTeams === false ? 0 : (data.teams || []).length;
  const tiers = useMemo(
    () => computeTiers(data.players, data.tierCounts, tierSize),
    [data.players, data.tierCounts, tierSize]
  );

  const enter = (r) => {
    setRole(r);
    setTab("dashboard");
    try {
      sessionStorage.setItem(SESSION_KEY, r);
    } catch (e) {
      /* fine — they just sign in again next visit */
    }
  };

  const leave = () => {
    setRole(null);
    try {
      sessionStorage.removeItem(SESSION_KEY);
    } catch (e) {
      /* nothing to clear */
    }
  };

  if (!ready) {
    return (
      <div className="app boot">
        <Styles />
        <div className="boot-ball" />
        <p>Loading your tournament…</p>
      </div>
    );
  }

  if (!role) {
    return (
      <div className="app">
        <Styles />
        <SignIn data={data} onEnter={enter} notify={notify} />
        {toast ? <div className="toast">{toast}</div> : null}
      </div>
    );
  }

  const myTabs = tabsFor(role);
  const active = myTabs.some((t) => t.key === tab) ? tab : myTabs[0].key;
  const tabProps = { data, update, tiers, notify, role };
  const roleLabel = (ROLES.find((r) => r.key === role) || {}).label;

  return (
    <div className="app">
      <Styles />

      <header className="topbar">
        <div className="brand">
          <span className="brand-ball" aria-hidden="true" />
          <div>
            <h1>{data.tournamentName}</h1>
            <span className="brand-sub">
              {data.players.length} players · {data.teams.length} teams · {data.matches.length} matches
            </span>
          </div>
        </div>
        <div className="topbar-right">
          <span className={"role-chip role-" + role}>{roleLabel}</span>
          {can(role, "super") ? (
            <button
              className="btn btn-ghost"
              onClick={() => {
                if (window.confirm("Clear every player, team, fixture and match? This cannot be undone.")) {
                  update(() => ({ ...EMPTY, codes: data.codes }));
                  notify("All data cleared. Your access codes were kept.");
                }
              }}
            >
              Reset all data
            </button>
          ) : null}
          <button className="btn btn-ghost" onClick={leave}>
            Sign out
          </button>
        </div>
      </header>

      <div className={"shell " + (role === "public" ? "public-shell" : "")}>
        {role !== "public" ? <nav className="rail">
          {myTabs.map((t) => (
            <button
              key={t.key}
              className={"rail-item" + (active === t.key ? " on" : "")}
              onClick={() => setTab(t.key)}
            >
              <span className="rail-label">{t.label}</span>
            </button>
          ))}
        </nav> : null}

        <main className={"main " + (role === "public" ? "public-main" : "")}>
          {active === "dashboard" && <DashboardTab {...tabProps} />}
          {active === "report" && <ReportTab {...tabProps} />}
          {active === "registrations" && <RegistrationsTab {...tabProps} />}
          {active === "players" && <PlayersTab {...tabProps} />}
          {active === "availability" && <AvailabilityTab {...tabProps} />}
          {active === "calibration" && <CalibrationTab {...tabProps} />}
          {active === "tiers" && <TiersTab {...tabProps} />}
          {active === "teams" && <TeamsTab {...tabProps} />}
          {active === "fixtures" && <FixturesTab {...tabProps} />}
          {active === "scoring" && <ScoringTab {...tabProps} />}
          {active === "standings" && <StandingsTab {...tabProps} />}
          {active === "performance" && <PerformanceTab {...tabProps} />}
          {active === "access" && role === "super" && <AccessTab {...tabProps} />}
        </main>
      </div>

      {toast ? <div className="toast">{toast}</div> : null}
    </div>
  );
}

function Styles() {

@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap');
