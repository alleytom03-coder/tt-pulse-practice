  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startPad; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));

  const slotsFor = (date) => (playerId ? data.availability[playerId + "|" + date] || [] : []);

  const toggleSlot = (date, slot) => {
    if (!playerId) return;
    const key = playerId + "|" + date;
    update((d) => {
      const cur = d.availability[key] || [];
      const next = cur.includes(slot) ? cur.filter((s) => s !== slot) : [...cur, slot];
      const av = { ...d.availability };
      if (next.length) av[key] = next;
      else delete av[key];
      return { ...d, availability: av };
    });
  };

  const columns = ["First Name", "Last Name", "Phone", "Date", "Slot"];
  const rows = [];
  Object.keys(data.availability).forEach((k) => {
    const [pid, date] = k.split("|");
    const p = data.players.find((x) => x.id === pid);
    if (!p || !ageGroupMatch(p, ageFilter)) return;
    data.availability[k].forEach((slot) => rows.push([p.first, p.last, p.phone, date, slot]));
  });
  rows.sort((a, b) => (a[3] + a[4]).localeCompare(b[3] + b[4]));

  const onImport = (objs) => {
    let n = 0;
    update((d) => {
      const av = { ...d.availability };
      objs.forEach((o) => {
        const { first, last } = readName(o);
        const phone = readPhone(o);
        const date = pick(o, ["date", "day"]);
        const slot = pick(o, ["slot", "availability", "time", "time slot"]);
        if (!date || !slot) return;
        const p = d.players.find(
          (x) =>
            (x.first + x.last).toLowerCase().replace(/\s/g, "") ===
              (first + last).toLowerCase().replace(/\s/g, "") ||
            (phone && x.phone === phone)
        );
        if (!p) return;
        const key = p.id + "|" + date;
        const cur = av[key] || [];
        if (!cur.includes(slot)) {
          av[key] = [...cur, slot];
          n++;
        }
      });
      return { ...d, availability: av };
    });
    notify(`${n} availability entries imported.`);
  };

  const selected = data.players.find((p) => p.id === playerId);
  const monthName = first.toLocaleDateString(undefined, { month: "long" });

  return (
    <div className="stack">
      <DataBar
        name="availability"
        columns={columns}
        rows={rows}
        onImport={onImport}
        note="One row per slot. Dates as YYYY-MM-DD."
        notify={notify}
      />

      <section className="card">
        <header className="card-head">
          <h2>Who is marking availability?</h2>
        </header>
        <div className="grid-form">
          <Field label="Work group">
            <select value={ageFilter} onChange={(e) => { setAgeFilter(e.target.value); setPlayerId(""); }}>
              <option value="all">All participants</option>
              <option value="adult">Adults only</option>
              <option value="kids">Kids only</option>
            </select>
          </Field>
          <Field
            label="Player"
            hint={
              allPlayers.length
                ? `${workPlayers.length} player${workPlayers.length === 1 ? "" : "s"} available in this group`
                : "No players loaded yet — import/add players in the Players tab first."
            }
          >
            <select
              value={playerId}
              onChange={(e) => setPlayerId(e.target.value)}
              disabled={workPlayers.length === 0}
            >
              <option value="">
                {workPlayers.length ? `Select a player (${workPlayers.length})` : "No players available"}
              </option>
              {workPlayers.map((p) => (
                <option key={p.id} value={p.id}>
                  {fullName(p)} — {catLabel(p.gender)}
                </option>
              ))}
            </select>
          </Field>
          <Field label="Month">
            <select value={month} onChange={(e) => setMonth(Number(e.target.value))}>
              {Array.from({ length: 12 }, (_, i) => (
                <option key={i} value={i}>
                  {new Date(2000, i, 1).toLocaleDateString(undefined, { month: "long" })}
                </option>
              ))}
            </select>
          </Field>
          <Field label="Year">
            <select value={year} onChange={(e) => setYear(Number(e.target.value))}>
              {years.map((y) => (
                <option key={y} value={y}>
                  {y}
                </option>
              ))}
            </select>
          </Field>
        </div>
      </section>

      <section className="card">
        <header className="card-head">
          <h2>
            {monthName} {year}
          </h2>
          <span className="muted">
            {selected ? `Tap a date to set slots for ${fullName(selected)}` : "Select a player first"}
          </span>
        </header>

        <div className="muted small" style={{marginBottom:8}}>
          Calendar number badge = available slots. A date with no badge means no imported availability.
          The 6–8 AM slot is kept for manual use but is not auto-marked from the Google Form because that form starts at 8 AM.
        </div>

        <div className="cal-head">
          {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d) => (
            <span key={d}>{d}</span>
          ))}
        </div>
        <div className="cal-grid">
          {cells.map((d, i) => {
            if (!d) return <span key={"pad" + i} className="cal-cell cal-pad" />;
            const key = ymd(d);
            const marked = slotsFor(key).length;
            const formTotal = SLOTS.filter((sl) => sl !== "6:00 – 8:00 AM").length;
            const status = marked === 0 ? "" : (marked >= formTotal ? " full" : " partial");
            return (
              <button
                key={key}
                title={marked ? `${marked} available slot${marked === 1 ? "" : "s"}` : "No availability marked"}
                className={"cal-cell" + (marked ? " has" : "") + status + (openDay === key ? " open" : "")}
                disabled={!playerId}
                onClick={() => setOpenDay(openDay === key ? null : key)}
              >
                <span className="cal-num">{d.getDate()}</span>
                {marked ? <span className="cal-dot">{marked}</span> : null}
              </button>
            );
          })}
        </div>

        {openDay && playerId ? (
          <div className="slot-panel">
            <h3>{prettyDate(openDay)}</h3>
            <div className="slot-grid">
              {SLOTS.map((s) => {
                const on = slotsFor(openDay).includes(s);
                return (
                  <button
                    key={s}
                    className={"slot" + (on ? " on" : "")}
                    onClick={() => toggleSlot(openDay, s)}
                  >
                    {s}
                  </button>
                );
              })}
            </div>
          </div>
        ) : null}
      </section>

      {selected ? (
        <section className="card">
          <header className="card-head">
            <h2>{fullName(selected)} — marked slots</h2>
          </header>
          {rows.filter((r) => r[0] === selected.first && r[1] === selected.last).length === 0 ? (
            <Empty title="Nothing marked yet" body="Pick a date on the calendar above to add slots." />
          ) : (
            <ul className="slot-list">
              {Object.keys(data.availability)
                .filter((k) => k.startsWith(playerId + "|"))
                .sort()
                .map((k) => (
                  <li key={k}>
                    <span className="mono">{prettyDate(k.split("|")[1])}</span>
                    <span>{data.availability[k].join(" · ")}</span>
                  </li>
                ))}
            </ul>
          )}
        </section>
      ) : null}
    </div>
  );
}

/* ============================================================
   Tab: Calibration
   ============================================================ */

function CalibrationTab({ data, update, tiers, notify }) {
  const [playerId, setPlayerId] = useState("");
  const [ageFilter, setAgeFilter] = useState("all");
  const allPlayers = Array.isArray(data.players) ? data.players : [];
  const workPlayers = allPlayers
    .filter((p) => ageGroupMatch(p, ageFilter))
    .slice()
    .sort((a, b) => fullName(a).localeCompare(fullName(b)));
  const adultCount = allPlayers.filter((p) => ageGroupMatch(p, "adult")).length;
  const kidsCount = allPlayers.filter((p) => ageGroupMatch(p, "kids")).length;
  const player = allPlayers.find((p) => p.id === playerId);
  const [draft, setDraft] = useState(blankCal());

  useEffect(() => {
    if (player) setDraft({ ...blankCal(), ...(player.cal || {}) });
  }, [playerId]); // eslint-disable-line

  const total = SKILLS.reduce((s, k) => s + (Number(draft[k.key]) || 0) * k.w, 0);

  const save = () => {
    if (!player) return;
    update((d) => ({
      ...d,
      players: d.players.map((p) => (p.id === player.id ? { ...p, cal: draft } : p)),
    }));
    notify(`Calibration saved for ${fullName(player)}.`);
  };

  const columns = [
    "First Name",
    "Last Name",
    "Gender",
    "Phone",
    ...SKILLS.map((s) => s.label),
    "Total Score",
    "Tier",
  ];
  const rows = workPlayers.map((p) => [
    p.first,
    p.last,
    p.gender,
    p.phone,
    ...SKILLS.map((s) => (p.cal ? p.cal[s.key] || 0 : 0)),
    calScore(p).toFixed(2),
    tiers[p.id] && isCalibrated(p) ? tiers[p.id].tier : "",
  ]);

  const onImport = (objs) => {
    let n = 0;
    update((d) => {
      const players = d.players.map((p) => {
        const match = objs.find((o) => {
          const { first, last } = readName(o);
          const ph = readPhone(o);
          return (
            (first.toLowerCase() === p.first.toLowerCase().trim() &&
              last.toLowerCase() === p.last.toLowerCase().trim()) ||
            (ph && ph === p.phone)
          );
        });
        if (!match) return p;
        const cal = { ...blankCal(), ...(p.cal || {}) };
        let touched = false;
        SKILLS.forEach((s) => {
          const v = pick(match, [s.label]);
          if (v !== "") {
            cal[s.key] = Math.max(0, Math.min(5, Number(v) || 0));
            touched = true;
          }
        });
        if (touched) n++;
        return { ...p, cal };
      });
      return { ...d, players };
    });
    notify(`${n} player ratings updated.`);
  };

  return (
    <div className="stack">
      <DataBar
        name="calibration"
        columns={columns}
        rows={rows}
        onImport={onImport}
        note="Each skill is marked out of 5. Total score is the weighted result."
        notify={notify}
      />

      <section className="card">
        <header className="card-head">
          <h2>Rate a player</h2>
          <span className="muted">Serve 30% · Forehand 20% · Backhand 20% · Spin 10% · Footwork 10% · Smash 10%</span>
        </header>

        <div className="grid-form">
          <Field label="Calibration group">
            <select
              value={ageFilter}
              onChange={(e) => {
                setAgeFilter(e.target.value);
                setPlayerId("");
              }}
            >
              <option value="all">All participants ({allPlayers.length})</option>
              <option value="adult">Adults ({adultCount})</option>
              <option value="kids">Kids ({kidsCount})</option>
            </select>
          </Field>
          <Field
            label="Player"
            hint={
              workPlayers.length
                ? `${workPlayers.length} player${workPlayers.length === 1 ? "" : "s"} in selected group`
                : "No players in this group"
            }
          >
            <select
              value={playerId}
              onChange={(e) => setPlayerId(e.target.value)}
              disabled={workPlayers.length === 0}
            >
              <option value="">
                {workPlayers.length ? `Select a player (${workPlayers.length})` : "No players available"}
              </option>
              {workPlayers.map((p) => (
                <option key={p.id} value={p.id}>
                  {fullName(p)} — {catLabel(p.gender)}
                </option>
              ))}
            </select>
          </Field>
        </div>

        {player ? (
          <>
            <div className="cal-rows">
              {SKILLS.map((s) => (
                <div className="cal-row" key={s.key}>
                  <div className="cal-row-name">
                    <b>{s.label}</b>
                    <span className="weight">{Math.round(s.w * 100)}%</span>
                  </div>
                  <div className="marks">
                    {[0, 1, 2, 3, 4, 5].map((v) => (
                      <button
                        key={v}
                        className={"mark" + (Number(draft[s.key]) === v ? " on" : "")}
                        onClick={() => setDraft((d) => ({ ...d, [s.key]: v }))}
                      >
                        {v}
                      </button>
                    ))}
                  </div>
                  <div className="cal-row-contrib mono">
                    +{((Number(draft[s.key]) || 0) * s.w).toFixed(2)}
                  </div>
                </div>
              ))}
            </div>

            <div className="total-strip">
              <div>
                <span className="databar-tag">Total score</span>
                <div className="total-num mono">{total.toFixed(2)}<i> / 5.00</i></div>
              </div>
              <Stars value={total} size={26} />
              <button className="btn btn-primary" onClick={save}>
                Save calibration
              </button>
            </div>
          </>
        ) : (
          <Empty title="Pick a player to begin" body="Scores update the tier lists the moment you save." />
        )}
      </section>
    </div>
  );
}

/* ============================================================
   Tab: Tiers
   ============================================================ */

function TiersTab({ data, update, tiers, notify }) {
  const [ageFilter, setAgeFilter] = useState("all");
  const teamCount = (data.teams || []).length;
  const visibleCategories = CATEGORIES.filter((c) =>
    ageFilter === "all" || (ageFilter === "kids" ? isKid(c.key) : !isKid(c.key))
  );
  const columns = ["Category", "Tier", "First Name", "Last Name", "Total Score", "Rank in Category"];
  const rows = [];
  visibleCategories.forEach((c) => {
    data.players
      .filter((p) => p.gender === c.key && tiers[p.id])
      .sort((a, b) => tiers[a.id].rank - tiers[b.id].rank)
      .forEach((p) => {
        rows.push([c.label, tiers[p.id].tier, p.first, p.last, calScore(p).toFixed(2), tiers[p.id].rank]);
      });
  });

  return (
    <div className="stack">
      <DataBar
        name="tiers"
        columns={columns}
        rows={rows}
        note="Tiers are calculated from calibration scores. Change the tier count below to re-split."
        notify={notify}
      />

      <section className="card">
        <header className="card-head">
          <div>
            <h2>How many tiers per category?</h2>
            <select value={ageFilter} onChange={(e) => setAgeFilter(e.target.value)}>
              <option value="all">All participants</option>
              <option value="adult">Adults only</option>
              <option value="kids">Kids only</option>
            </select>
          </div>
          <label className="toggle">
            <input
              type="checkbox"
              checked={data.tierByTeams !== false}
              onChange={(e) => update((d) => ({ ...d, tierByTeams: e.target.checked }))}
            />
            <span>One player per team, per tier</span>
          </label>
        </header>

        {data.tierByTeams !== false ? (
          <div className="plan-note">
            {teamCount < 2 ? (
              <p className="warn-text">
                Create your teams first. Tier size follows the number of teams, and there
                {teamCount === 1 ? " is 1 team" : " are no teams"} yet.
              </p>
            ) : (
              <>
                <p className="muted">
                  Men and Women are split into tiers of {teamCount} — the strongest {teamCount} are
                  tier 1, the next {teamCount} are tier 2, and so on. Every team gets one player from
                  each tier. Boys and Girls are not drafted, so they keep the counts below.
                </p>
                <ul className="fit-list">
                  {TEAM_CATEGORIES.map((cat) => {
                    const n = data.players.filter((p) => p.gender === cat).length;
                    const full = Math.floor(n / teamCount);
                    const left = n % teamCount;
                    return (
                      <li key={cat} className={left ? "warn-text" : ""}>
                        <b>{catLabel(cat)}:</b> {n} players → {full} full{" "}
                        {full === 1 ? "tier" : "tiers"} of {teamCount}
                        {left
                          ? `, and ${left} left over in a short bottom tier. Add ${
                              teamCount - left
                            } more or move ${left} out to divide evenly.`
                          : ". Divides evenly."}
                      </li>
                    );
                  })}
                </ul>
              </>
            )}
          </div>
        ) : null}

        <div className="grid-form">
          {(data.tierByTeams !== false
            ? visibleCategories.filter((c) => isKid(c.key))
            : visibleCategories).map((c) => (
            <Field key={c.key} label={c.label}>
              <select
                value={data.tierCounts[c.key]}
                onChange={(e) =>
                  update((d) => ({
                    ...d,
                    tierCounts: { ...d.tierCounts, [c.key]: Number(e.target.value) },
                  }))
                }
              >
                {[1, 2, 3, 4, 5, 6, 7, 8].map((n) => (
                  <option key={n} value={n}>
                    {n} {n === 1 ? "tier" : "tiers"}
                  </option>
                ))}
              </select>
            </Field>
          ))}
        </div>
      </section>

      {visibleCategories.map((c) => {
        const group = data.players
          .filter((p) => p.gender === c.key && tiers[p.id])
          .sort((a, b) => tiers[a.id].rank - tiers[b.id].rank);
        const byTier = {};
        group.forEach((p) => {
          const t = tiers[p.id].tier;
          byTier[t] = byTier[t] || [];
          byTier[t].push(p);
        });
        return (
          <section className="card" key={c.key}>
            <header className="card-head">
              <h2>{c.label}</h2>
              <span className="muted">{group.length} players</span>
            </header>
            {group.length === 0 ? (
              <Empty title={`No ${c.label.toLowerCase()} yet`} body="Add players in the Players tab." />
            ) : (
              <div className="tier-cols">
                {Object.keys(byTier)
                  .map(Number)
                  .sort((a, b) => a - b)
                  .map((t) => (
                    <div className="tier-col" key={t}>
                      <div className={"tier-col-head tier-" + Math.min(t, 5)}>
                        <b>Tier {t}</b>
                        <span>{byTier[t].length}</span>
                      </div>
                      <ul>
                        {byTier[t].map((p) => (
                          <li key={p.id}>
                            <span>{fullName(p)}</span>
                            <b className="mono">{calScore(p).toFixed(2)}</b>
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
              </div>
            )}
          </section>
        );
      })}
    </div>
  );
}

/* ============================================================
   Tab: Teams
   ============================================================ */

function TeamsTab({ data, update, tiers, notify }) {
  const [teamName, setTeamName] = useState("");
  const [picks, setPicks] = useState({});
  const [ageFilter, setAgeFilter] = useState("adult");

  const groupCats = ageFilter === "kids" ? ["Boy", "Girl"] : ["Male", "Female"];
  const groupLabel = ageFilter === "kids" ? "Kids" : "Adults";
  const playerInGroup = (p) => p && groupCats.includes(p.gender);

  /* Older saved teams did not have an ageGroup property. Treat them as
     Adult unless their existing roster clearly contains only kids. */
  const teamGroup = (t) => {
    if (t.ageGroup === "kids" || t.ageGroup === "adult") return t.ageGroup;
    const members = (t.playerIds || [])
      .map((id) => data.players.find((p) => p.id === id))
      .filter(Boolean);
    return members.length && members.every((p) => isKid(p.gender)) ? "kids" : "adult";
  };

  const groupTeams = data.teams.filter((t) => teamGroup(t) === ageFilter);
  const groupPlayers = data.players.filter(playerInGroup);

  // Auto Balance is only safe after every player in the selected group
  // has completed calibration and therefore has a generated tier.
  const untieredPlayers = groupPlayers.filter(
    (p) => !isCalibrated(p) || !tiers[p.id] || !tiers[p.id].tier
  );
  const tiersReady = groupPlayers.length > 0 && untieredPlayers.length === 0;

  const assignedAll = new Set();
  data.teams.forEach((t) => (t.playerIds || []).forEach((id) => assignedAll.add(id)));
  const available = groupPlayers.filter((p) => !assignedAll.has(p.id));

  const teamPlayers = (t) =>
    (t.playerIds || []).map((id) => data.players.find((p) => p.id === id)).filter(Boolean);

  const countCat = (t, cat) => teamPlayers(t).filter((p) => p.gender === cat).length;
  const avgCal = (t) => {
    const ps = teamPlayers(t).filter(isCalibrated);
    return ps.length ? ps.reduce((sum, p) => sum + calScore(p), 0) / ps.length : 0;
  };

  const tierCount = (t, cat, tier) =>
    teamPlayers(t).filter((p) => p.gender === cat && tiers[p.id] && tiers[p.id].tier === tier).length;

  const distributionChecks = [];
  if (groupTeams.length > 0) {
    const sizes = groupTeams.map((t) => teamPlayers(t).length);
    distributionChecks.push(Math.max(...sizes) - Math.min(...sizes) <= 1);
    groupCats.forEach((cat) => {
      const counts = groupTeams.map((t) => countCat(t, cat));
      distributionChecks.push(Math.max(...counts) - Math.min(...counts) <= 1);

      const maxTier = Math.max(1, Number(data.tierCounts[cat]) || 1);
      for (let tier = 1; tier <= maxTier; tier++) {
        const tc = groupTeams.map((t) => tierCount(t, cat, tier));
        distributionChecks.push(Math.max(...tc) - Math.min(...tc) <= 1);
      }
    });
  }
  const balanceOk = groupTeams.length >= 2 && distributionChecks.every(Boolean);

  const createTeam = () => {
    const name = teamName.trim();
    if (!name) {
      notify("Give the team a name first.");
      return;
    }
    if (data.teams.some((t) => t.name.toLowerCase() === name.toLowerCase())) {
      notify("A team with that name already exists.");
      return;
    }
    update((d) => ({
      ...d,
      teams: [...d.teams, { id: uid(), name, ageGroup: ageFilter, playerIds: [] }],
    }));
    setTeamName("");
    notify(`${groupLabel} team "${name}" created.`);
  };

  const addPlayer = (teamId) => {
    const pid = picks[teamId];
    if (!pid) return;
    const p = data.players.find((x) => x.id === pid);
    if (!playerInGroup(p)) {
      notify(`Only ${groupLabel.toLowerCase()} can be added to this team.`);
      return;
    }
    update((d) => ({
      ...d,
      teams: d.teams.map((t) =>
        t.id === teamId ? { ...t, ageGroup: ageFilter, playerIds: [...(t.playerIds || []), pid] } : t
      ),
    }));
    setPicks((x) => ({ ...x, [teamId]: "" }));
  };

  const removePlayer = (teamId, pid) => {
    update((d) => ({
      ...d,
      teams: d.teams.map((t) =>
        t.id === teamId ? { ...t, playerIds: (t.playerIds || []).filter((x) => x !== pid) } : t
      ),
      matches: d.matches.filter((m) => m.playerA !== pid && m.playerB !== pid),
    }));
  };

  const movePlayer = (pid, fromId, toId) => {
    if (!toId || fromId === toId) return;
    const moved = data.players.find((p) => p.id === pid);
    const movedTier = moved && tiers[moved.id] ? tiers[moved.id].tier : null;
    const target = groupTeams.find((t) => t.id === toId);
    const sameTierOnTarget =
      moved && movedTier && target
        ? teamPlayers(target).filter(
            (p) => p.gender === moved.gender && tiers[p.id] && tiers[p.id].tier === movedTier
          ).length
        : 0;

    update((d) => ({
      ...d,
      teams: d.teams.map((t) => {
        if (t.id === fromId) return { ...t, playerIds: (t.playerIds || []).filter((x) => x !== pid) };
        if (t.id === toId) return { ...t, ageGroup: ageFilter, playerIds: [...(t.playerIds || []), pid] };
        return t;
      }),
    }));

    if (sameTierOnTarget > 0) {
      notify(
        `Player moved, but check balance: ${target.name} now has multiple ` +
        `${catLabel(moved.gender)} Tier ${movedTier} players.`
      );
    } else {
      notify("Player moved. Team balance recalculated.");
    }
  };

  const deleteTeam = (teamId) => {
    update((d) => ({
      ...d,
      teams: d.teams.filter((t) => t.id !== teamId),
      matches: d.matches.filter((m) => m.teamA !== teamId && m.teamB !== teamId),
    }));
  };

  /* Balanced draft: category by category, tier by tier. The strongest
     player in each pool goes to the team that is currently shortest in
     that category, with total team size as the tie breaker. */
  const autoBalance = () => {
    if (groupTeams.length < 2) {
      notify(`Create at least two ${groupLabel.toLowerCase()} teams first.`);
      return;
    }
    if (!tiersReady) {
      notify(
        `Auto Balance is locked: ${untieredPlayers.length} ${groupLabel.toLowerCase()} player` +
        `${untieredPlayers.length === 1 ? "" : "s"} still need calibration/tier creation.`
      );
      return;
    }

    const ids = new Set(groupTeams.map((t) => t.id));
    const buckets = {};
    groupTeams.forEach((t) => (buckets[t.id] = []));

    const bucketPlayers = (id) =>
      buckets[id].map((pid) => data.players.find((p) => p.id === pid)).filter(Boolean);
    const catCountBucket = (id, cat) => bucketPlayers(id).filter((p) => p.gender === cat).length;

    const chooseTeam = (cat) => {
      return groupTeams
        .slice()
        .sort((a, b) =>
          catCountBucket(a.id, cat) - catCountBucket(b.id, cat) ||
          buckets[a.id].length - buckets[b.id].length ||
          avgBucketScore(a.id) - avgBucketScore(b.id)
        )[0];
    };
    const avgBucketScore = (id) => {
      const ps = bucketPlayers(id).filter(isCalibrated);
      return ps.length ? ps.reduce((z, p) => z + calScore(p), 0) / ps.length : 0;
    };

    groupCats.forEach((cat) => {
      const maxTier = Math.max(1, Number(data.tierCounts[cat]) || 1);
      const used = new Set();

      for (let tier = 1; tier <= maxTier; tier++) {
        const pool = groupPlayers
          .filter((p) => p.gender === cat && tiers[p.id] && tiers[p.id].tier === tier)
          .slice()
          .sort((a, b) => calScore(b) - calScore(a) || fullName(a).localeCompare(fullName(b)));

        pool.forEach((p) => {
          const t = chooseTeam(cat);
          buckets[t.id].push(p.id);
          used.add(p.id);
        });
      }

      groupPlayers
        .filter((p) => p.gender === cat && !used.has(p.id))
        .sort((a, b) => fullName(a).localeCompare(fullName(b)))
        .forEach((p) => {
          const t = chooseTeam(cat);
          buckets[t.id].push(p.id);
        });
    });

    update((d) => ({
      ...d,
      teams: d.teams.map((t) =>
        ids.has(t.id) ? { ...t, ageGroup: ageFilter, playerIds: buckets[t.id] } : t
      ),
    }));
    notify(`${groupLabel} players auto-balanced by category, tier and team size.`);
  };

  /* Random reshuffle keeps Adults/Kids separate and maintains near-equal
     category counts, but changes which individual players land together. */
  const randomReshuffle = () => {
    if (groupTeams.length < 2) {
      notify(`Create at least two ${groupLabel.toLowerCase()} teams first.`);
      return;
    }
    const ids = new Set(groupTeams.map((t) => t.id));
    const buckets = {};
    groupTeams.forEach((t) => (buckets[t.id] = []));

    groupCats.forEach((cat) => {
      const pool = groupPlayers.filter((p) => p.gender === cat).slice();
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      pool.forEach((p, i) => {
        buckets[groupTeams[i % groupTeams.length].id].push(p.id);
      });
    });

    update((d) => ({
      ...d,
      teams: d.teams.map((t) =>
        ids.has(t.id) ? { ...t, ageGroup: ageFilter, playerIds: buckets[t.id] } : t
      ),
    }));
    notify(`${groupLabel} teams reshuffled. You can still move players manually.`);
  };

  const columns = ["Group", "Team", "First Name", "Last Name", "Category", "Tier"];
  const rows = [];
  data.teams.forEach((t) =>
    (t.playerIds || []).forEach((pid) => {
      const p = data.players.find((x) => x.id === pid);
      if (p) rows.push([
        teamGroup(t) === "kids" ? "Kids" : "Adults",
        t.name, p.first, p.last, catLabel(p.gender),
        tiers[p.id] ? tiers[p.id].tier : ""
      ]);
    })
  );

  const onImport = (objs) => {
    update((d) => {
      const teams = d.teams.slice();
      const taken = new Set();
      teams.forEach((t) => (t.playerIds || []).forEach((id) => taken.add(id)));

      objs.forEach((o) => {
        const tname = pick(o, ["team", "team name", "side", "squad"]);
        const nm = readName(o);
        if (!tname || !nm.first) return;
        const p = d.players.find(
          (x) =>
            x.first.toLowerCase().trim() === nm.first.toLowerCase().trim() &&
            x.last.toLowerCase().trim() === nm.last.toLowerCase().trim()
        );
        if (!p || taken.has(p.id)) return;

        const ag = isKid(p.gender) ? "kids" : "adult";
        let team = teams.find((t) => t.name.toLowerCase() === String(tname).toLowerCase());
        if (!team) {
          team = { id: uid(), name: String(tname), ageGroup: ag, playerIds: [] };
          teams.push(team);
        }
        if ((team.ageGroup || ag) !== ag) return; // never mix Adults and Kids
        team.ageGroup = ag;
        team.playerIds = [...(team.playerIds || []), p.id];
        taken.add(p.id);
      });
      return { ...d, teams };
    });
    notify("Teams imported. Adult and Kids rosters were kept separate.");
  };

  return (
    <div className="stack">
      <section className="card">
        <header className="card-head">
          <div>
            <span className="eyebrow">Separate team pools</span>
            <h2>{groupLabel} teams</h2>
          </div>
          <select value={ageFilter} onChange={(e) => { setAgeFilter(e.target.value); setPicks({}); }}>
            <option value="adult">Adult teams</option>
            <option value="kids">Kids teams</option>
          </select>
        </header>
        <p className="muted">
          Adults and Kids are never mixed. Each group has its own teams, balance check,
          auto-balance, random reshuffle and manual player moves.
        </p>
      </section>

      <section className="card">
        <header className="card-head">
          <div>
            <span className="eyebrow">Distribution checker</span>
            <h2>{groupLabel} team balance</h2>
          </div>
          <span className={"chip " + (balanceOk ? "chip-tier" : "chip-quiet")}>
            {groupTeams.length < 2 ? "Need 2+ teams" : balanceOk ? "✓ Balanced" : "⚠ Review balance"}
          </span>
        </header>

        <div className="stats-grid">
          <div className="stat"><span>Total {groupLabel}</span><strong>{groupPlayers.length}</strong></div>
          <div className="stat"><span>Teams</span><strong>{groupTeams.length}</strong></div>
          <div className="stat">
            <span>Ideal per team</span>
            <strong>{groupTeams.length ? `${Math.floor(groupPlayers.length / groupTeams.length)}–${Math.ceil(groupPlayers.length / groupTeams.length)}` : "—"}</strong>
          </div>
          <div className="stat"><span>Unassigned</span><strong>{available.length}</strong></div>
          <div className="stat">
            <span>Tier status</span>
            <strong>{tiersReady ? "Ready ✓" : `${untieredPlayers.length} pending`}</strong>
          </div>
        </div>

        {!tiersReady && (
          <div className="notice" style={{marginTop: 14}}>
            <strong>Auto Balance locked.</strong>{" "}
            Complete calibration and tier creation for all {groupLabel.toLowerCase()} players first.
            {untieredPlayers.length
              ? ` ${untieredPlayers.length} player${untieredPlayers.length === 1 ? "" : "s"} still pending.`
              : ""}
          </div>
        )}

        {groupTeams.length > 0 && (
          <div className="table-scroll" style={{marginTop: 14}}>
            <table>
              <thead>
                <tr>
                  <th>Team</th><th>Total</th>
                  {groupCats.map((cat) => <th key={cat}>{catLabel(cat)}</th>)}
                  <th>Avg calibration</th><th>Tier spread</th>
                </tr>
              </thead>
              <tbody>
                {groupTeams.map((t) => {
                  const tierText = groupCats.map((cat) => {
                    const maxTier = Math.max(1, Number(data.tierCounts[cat]) || 1);
                    const parts = [];
                    for (let n = 1; n <= maxTier; n++) {
                      const c = tierCount(t, cat, n);
                      if (c) parts.push(`T${n}:${c}`);
                    }
                    return `${catLabel(cat)} ${parts.length ? parts.join(" ") : "—"}`;
                  }).join(" · ");
                  return (
                    <tr key={t.id}>
                      <td className="strong">{t.name}</td>
                      <td>{teamPlayers(t).length}</td>
                      {groupCats.map((cat) => <td key={cat}>{countCat(t, cat)}</td>)}
                      <td className="mono">{avgCal(t) ? avgCal(t).toFixed(2) : "—"}</td>
                      <td>{tierText}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}

        <div className="inline-add" style={{marginTop: 14}}>
          <button
            className="btn btn-primary"
            onClick={autoBalance}
            disabled={groupTeams.length < 2 || !tiersReady}
            title={!tiersReady ? "Complete calibration and tiers for every player first" : "Distribute each category and tier as evenly as possible"}
          >
            Auto balance {groupLabel}
          </button>
          <button
            className="btn"
            onClick={randomReshuffle}
            disabled={groupTeams.length < 2 || !tiersReady}
            title={!tiersReady ? "Complete calibration and tiers first" : "Create another editable team combination"}
          >
            Reshuffle {groupLabel}
          </button>
        </div>
      </section>

      <DataBar
        name="teams"
        columns={columns}
        rows={rows}
        onImport={onImport}
        note="Imports keep Adult and Kids teams separate. A player can only belong to one team."
        notify={notify}
      />

      <section className="card">
        <header className="card-head">
          <h2>Add a new {groupLabel} team</h2>
          <span className="muted">{available.length} of {groupPlayers.length} {groupLabel.toLowerCase()} currently unassigned</span>
        </header>
        <div className="inline-add">
          <input
            value={teamName}
            onChange={(e) => setTeamName(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && createTeam()}
            placeholder={ageFilter === "kids" ? "Junior Smashers" : "Tower A Smashers"}
          />
          <button className="btn btn-primary" onClick={createTeam}>Create {groupLabel} team</button>
        </div>
      </section>

      {groupTeams.length === 0 ? (
        <Empty title={`No ${groupLabel.toLowerCase()} teams yet`} body={`Create at least two ${groupLabel.toLowerCase()} teams to use balancing and reshuffling.`} />
      ) : (
        <div className="team-grid">
          {groupTeams.map((t) => (
            <section className="card team-card" key={t.id}>
              <header className="card-head">
                <div>
                  <span className="eyebrow">{groupLabel}</span>
                  <h2>{t.name}</h2>
                </div>
                <div className="head-tools">
                  <span className="chip chip-quiet">{teamPlayers(t).length} players</span>
                  {groupCats.map((cat) => (
                    <span className="chip chip-quiet" key={cat}>
                      {catLabel(cat)}: {countCat(t, cat)}
                    </span>
                  ))}
                  <button className="btn btn-tiny btn-danger" onClick={() => deleteTeam(t.id)}>Delete</button>
                </div>
              </header>

              <ul className="roster">
                {teamPlayers(t).length === 0 ? (
                  <li className="muted">Roster is empty.</li>
                ) : (
                  teamPlayers(t).map((p) => (
                    <li key={p.id}>
                      <span>
                        <span className="strong">{fullName(p)}</span>
                        <span className="muted"> · {catLabel(p.gender)}</span>
                      </span>
                      <span className="roster-meta">
                        <TierChip tier={tiers[p.id] && isCalibrated(p) ? tiers[p.id].tier : null} />
                        <select
                          defaultValue=""
                          onChange={(e) => {
                            movePlayer(p.id, t.id, e.target.value);
                            e.target.value = "";
                          }}
                          title="Move player to another team"
                        >
                          <option value="">Move to…</option>
                          {groupTeams.filter((x) => x.id !== t.id).map((x) => (
                            <option value={x.id} key={x.id}>{x.name}</option>
                          ))}
                        </select>
                        <button className="btn btn-tiny" onClick={() => removePlayer(t.id, p.id)}>Remove</button>
                      </span>
                    </li>
                  ))
                )}
              </ul>

              <div className="inline-add">
                <select
                  value={picks[t.id] || ""}
                  onChange={(e) => setPicks((x) => ({ ...x, [t.id]: e.target.value }))}
                >
                  <option value="">Add a {groupLabel.toLowerCase()} player…</option>
                  {available.map((p) => (
                    <option key={p.id} value={p.id}>
                      {fullName(p)} — {catLabel(p.gender)}
                      {tiers[p.id] && isCalibrated(p) ? ` · Tier ${tiers[p.id].tier}` : ""}
                    </option>
                  ))}
                </select>
                <button className="btn" onClick={() => addPlayer(t.id)}>Add</button>
              </div>
            </section>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   Tab: Live scoring  — the scoreboard
   ============================================================ */

function ScoringTab({ data, update, notify }) {
  const [teamA, setTeamA] = useState("");
  const [teamB, setTeamB] = useState("");
  const [playerA, setPlayerA] = useState("");
  const [playerB, setPlayerB] = useState("");
  const [dutyDate, setDutyDate] = useState(ymd(new Date()));
  const [dutyPick, setDutyPick] = useState("");
  const [dutyTyped, setDutyTyped] = useState("");
  const [scorer, setScorer] = useState("");

  const teamById = (id) => data.teams.find((t) => t.id === id);
  const roster = (id) => {
    const t = teamById(id);
    if (!t) return [];
    return t.playerIds.map((pid) => data.players.find((p) => p.id === pid)).filter(Boolean);
  };
  const nameOf = (id) => {
    const p = data.players.find((x) => x.id === id);
    return p ? fullName(p) : "—";
  };

  /* Whoever is keeping score on a given day. A name is enough — most of
     them are players anyway, so the list offers the roster first. */
  const dutyFor = (d) => ((data.refDuty || {})[d] || []);
  const duty = dutyFor(dutyDate);

  const addDuty = (entry) => {
    if (!entry || !entry.name) return;
    if (duty.some((x) => x.name.toLowerCase() === entry.name.toLowerCase())) {
      notify(`${entry.name} is already on duty that day.`);
      return;
    }
    update((d) => ({
      ...d,
      refDuty: { ...(d.refDuty || {}), [dutyDate]: [...dutyFor(dutyDate), entry] },
    }));
    notify(`${entry.name} is keeping score on ${prettyDate(dutyDate)}.`);
  };

  const dropDuty = (name) =>
    update((d) => ({
      ...d,
      refDuty: {
        ...(d.refDuty || {}),
        [dutyDate]: dutyFor(dutyDate).filter((x) => x.name !== name),
      },
    }));

  /* Anything drawn for today that nobody has called to a table yet. */
  const todayStr = ymd(new Date());
  const todaysFixtures = (data.fixtures || [])
    .filter((f) => f.date === todayStr && !f.matchId)
    .sort((a, b) => SLOTS.indexOf(a.slot) - SLOTS.indexOf(b.slot) || a.hostTier - b.hostTier);

  const startFromFixture = (f) => {
    const m = {
      id: uid(),
      date: f.date || todayStr,
      teamA: f.teamA,
      teamB: f.teamB,
      category: f.category,
      individual: !!f.individual,
      playerA: f.playerA,
      playerB: f.playerB,
      sets: [
        { a: "0", b: "0" },
        { a: "0", b: "0" },
        { a: "0", b: "0" },
      ],
      status: "live",
      fixtureId: f.id,
      scorer: scorer || (dutyFor(f.date || todayStr)[0] || {}).name || "",
    };
    update((d) => ({
      ...d,
      matches: [m, ...d.matches],
      fixtures: (d.fixtures || []).map((x) => (x.id === f.id ? { ...x, matchId: m.id } : x)),
    }));
    notify(`${nameOf(f.playerA)} v ${nameOf(f.playerB)} is on the scoreboard.`);
  };

  /* Every pairing that has already met, whether it came from a fixture or
     was started by hand. Order does not matter, so the key is sorted. */
  const pairKey = (x, y) => [x, y].sort().join("|");
  const playedPairs = useMemo(() => {
    const s = new Set();
    (data.matches || []).forEach((m) => {
      if (m.playerA && m.playerB) s.add(pairKey(m.playerA, m.playerB));
    });
    (data.fixtures || []).forEach((f) => {
      if (f.matchId && f.playerA && f.playerB) s.add(pairKey(f.playerA, f.playerB));
    });
    return s;
  }, [data.matches, data.fixtures]);

  const hasPlayed = (x, y) => !!x && !!y && playedPairs.has(pairKey(x, y));

  /* A player is exhausted once they have met everyone in the other team. */
  const allPlayedAgainst = (pid, otherTeamId) => {
    const opps = roster(otherTeamId);
    return opps.length > 0 && opps.every((o) => hasPlayed(pid, o.id));
  };

  const remainingCount = () => {
    if (!teamA || !teamB) return null;
    let n = 0;
    roster(teamA).forEach((a) =>
      roster(teamB).forEach((b) => {
        if (!hasPlayed(a.id, b.id)) n++;
      })
    );
    return n;
  };

  const startMatch = () => {
    if (!teamA || !teamB || teamA === teamB) {
      notify("Choose two different teams.");
      return;
    }
    if (!playerA || !playerB) {
      notify("Choose a player from each team.");
      return;
    }
    if (hasPlayed(playerA, playerB)) {
      notify(`${nameOf(playerA)} and ${nameOf(playerB)} have already met. Pick another pairing.`);
      return;
    }
    const m = {
      id: uid(),
      date: ymd(new Date()),
      teamA,
      teamB,
      playerA,
      playerB,
      sets: [
        { a: "0", b: "0" },
        { a: "0", b: "0" },
        { a: "0", b: "0" },
      ],
      status: "live",
      scorer: scorer || (dutyFor(ymd(new Date()))[0] || {}).name || "",
    };
    update((d) => ({ ...d, matches: [m, ...d.matches] }));
    setPlayerA("");
    setPlayerB("");
  };

  const addPoint = (mid, side, delta) => {
    update((d) => ({
      ...d,
      matches: d.matches.map((m) => {
        if (m.id !== mid) return m;
        const i = activeSetIndex(m);
        if (i === -1) return m;
        const sets = m.sets.map((s, idx) =>
          idx === i ? { ...s, [side]: String(Math.max(0, num(s[side]) + delta)) } : s
        );
        const after = { ...m, sets };
        // The match closes itself once someone has taken two sets.
        return { ...after, status: matchResult(after).complete ? "final" : after.status };
      }),
    }));
  };

  const setScore = (mid, i, side, value) => {
    const v = value === "" ? "0" : String(Math.max(0, Math.min(99, Number(value) || 0)));
    update((d) => ({
      ...d,
      matches: d.matches.map((m) =>
        m.id === mid
          ? { ...m, sets: m.sets.map((s, idx) => (idx === i ? { ...s, [side]: v } : s)) }
          : m
      ),
    }));
  };

  const setStatus = (mid, status) => {
    update((d) => ({ ...d, matches: d.matches.map((m) => (m.id === mid ? { ...m, status } : m)) }));
  };

  const removeMatch = (mid) =>
    update((d) => ({ ...d, matches: d.matches.filter((m) => m.id !== mid) }));

  const columns = [
    "Date",
    "Status",
    "Team A",
    "Player A",
    "Team B",
    "Player B",
    "Set 1",
    "Set 2",
    "Set 3",
    "Sets A",
    "Sets B",
    "Points A",
    "Points B",
  ];
  const rows = data.matches.map((m) => {
    const r = matchResult(m);
    const ta = teamById(m.teamA);
    const tb = teamById(m.teamB);
    const pa = data.players.find((p) => p.id === m.playerA);
    const pb = data.players.find((p) => p.id === m.playerB);
    const sets = m.sets.map((s) => `${s.a || "-"}-${s.b || "-"}`);
    return [
      m.date,
      m.status,
      ta ? ta.name : "",
      pa ? fullName(pa) : "",
      tb ? tb.name : "",
      pb ? fullName(pb) : "",
      sets[0],
      sets[1],
      sets[2],
      r.aSets,
      r.bSets,
      r.aPts,
      r.bPts,
    ];
  });

  const onImport = (objs) => {
    let n = 0;
    update((d) => {
      const matches = d.matches.slice();
      objs.forEach((o) => {
        const ta = d.teams.find((t) => t.name.toLowerCase() === pick(o, ["team a"]).toLowerCase());
        const tb = d.teams.find((t) => t.name.toLowerCase() === pick(o, ["team b"]).toLowerCase());
        if (!ta || !tb) return;
        const findP = (nm) =>
          d.players.find((p) => fullName(p).toLowerCase() === String(nm || "").toLowerCase().trim());
        const pa = findP(pick(o, ["player a"]));
        const pb = findP(pick(o, ["player b"]));
        if (!pa || !pb) return;
        const parseSet = (s) => {
          const parts = String(s || "").split(/[-–:]/);
          return { a: (parts[0] || "").trim().replace(/\D/g, ""), b: (parts[1] || "").trim().replace(/\D/g, "") };
        };
        matches.push({
          id: uid(),
          date: pick(o, ["date"]) || ymd(new Date()),
          teamA: ta.id,
          teamB: tb.id,
          playerA: pa.id,
          playerB: pb.id,
          sets: [parseSet(pick(o, ["set 1"])), parseSet(pick(o, ["set 2"])), parseSet(pick(o, ["set 3"]))],
          status: (pick(o, ["status"]) || "final").toLowerCase() === "live" ? "live" : "final",
        });
        n++;
      });
      return { ...d, matches };
    });
    notify(`${n} matches imported.`);
  };

  return (
    <div className="stack">
      <DataBar
        name="matches"
        columns={columns}
        rows={rows}
        onImport={onImport}
        note="Set scores import as 11-9 style text."
        notify={notify}
      />

      <section className="card">
        <header className="card-head">
          <h2>Referee on duty</h2>
          <span className="muted">
            {duty.length ? `${duty.length} keeping score` : "nobody named yet"}
          </span>
        </header>
        <div className="grid-form four">
          <Field label="Day">
            <input type="date" value={dutyDate} onChange={(e) => setDutyDate(e.target.value)} />
          </Field>
          <Field label="Pick from the roster">
            <select
              value={dutyPick}
              onChange={(e) => {
                const pid = e.target.value;
                setDutyPick("");
                const p = data.players.find((x) => x.id === pid);
                if (p) addDuty({ id: p.id, name: fullName(p) });
              }}
            >
              <option value="">Select a member</option>
              {data.players
                .slice()
                .sort((a, b) => fullName(a).localeCompare(fullName(b)))
                .map((p) => (
                  <option key={p.id} value={p.id}>
                    {fullName(p)}
                  </option>
                ))}
            </select>
          </Field>
          <Field label="Or type a name" hint="For anyone not on the player list.">
            <input
              value={dutyTyped}
              placeholder="Name"
              onChange={(e) => setDutyTyped(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter" && dutyTyped.trim()) {
                  addDuty({ id: "", name: dutyTyped.trim() });
                  setDutyTyped("");
                }
              }}
            />
          </Field>
          <Field label="Scoring as" hint="Stamped on every match you start.">
            <select value={scorer} onChange={(e) => setScorer(e.target.value)}>
              <option value="">
                {duty.length ? duty[0].name + " (first on duty)" : "Not set"}
              </option>
              {duty.map((x) => (
                <option key={x.name} value={x.name}>
                  {x.name}
                </option>
              ))}
            </select>
          </Field>
        </div>
        {dutyTyped.trim() ? (
          <button
            className="btn btn-ghost"
            onClick={() => {
              addDuty({ id: "", name: dutyTyped.trim() });
              setDutyTyped("");
            }}
          >
            Add {dutyTyped.trim()}
          </button>
        ) : null}
        {duty.length ? (
          <div className="duty-row">
            {duty.map((x) => (
              <span className="duty-chip" key={x.name}>
                {x.name}
                <button onClick={() => dropDuty(x.name)} aria-label={"Remove " + x.name}>
                  ×
                </button>
              </span>
            ))}
          </div>
        ) : (
          <p className="muted">
            Name whoever is at the table on {prettyDate(dutyDate)}. Their name rides along on every
            score they enter, and the public board shows it.
          </p>
        )}
      </section>

      {todaysFixtures.length ? (
        <section className="card">
          <header className="card-head">
            <h2>Scheduled for today</h2>
            <span className="muted">{todaysFixtures.length} waiting to be called</span>
          </header>
          <ul className="op-list">
            {todaysFixtures.slice(0, 20).map((f) => (
              <li key={f.id}>
                <span className={"chip tier-" + Math.min(f.hostTier, 5)}>
                  T{f.hostTier}
                  <em>{catLabel(f.category)}</em>
                </span>
                <span className="op-names">
                  <b>{nameOf(f.playerA)}</b>
                  <i>v</i>
                  <b>{nameOf(f.playerB)}</b>
                </span>
                <span className="muted op-teams">{f.slot || "time not set"}</span>
                <button className="btn btn-tiny" onClick={() => startFromFixture(f)}>
                  Call to the table
                </button>
              </li>
            ))}
          </ul>
        </section>
      ) : null}

      <section className="card">
        <header className="card-head">
          <h2>Set up a match</h2>
          <span className="muted">Best of 3 · 5 team points per set won · 25 bonus for the match</span>
        </header>
        <div className="grid-form four">
          <Field label="Team A">
            <select
              value={teamA}
              onChange={(e) => {
                setTeamA(e.target.value);
                setPlayerA("");
              }}
            >
              <option value="">Select team</option>
              {data.teams.map((t) => (
                <option key={t.id} value={t.id}>
                  {t.name}
                </option>
              ))}
            </select>
          </Field>
          <Field label="Player from Team A">
            <select value={playerA} onChange={(e) => setPlayerA(e.target.value)} disabled={!teamA}>
              <option value="">Select player</option>
              {roster(teamA).map((p) => {
                const done = teamB && allPlayedAgainst(p.id, teamB);
                return (
                  <option key={p.id} value={p.id} disabled={done}>
                    {fullName(p)}
                    {done ? " \u2014 played everyone" : ""}
                  </option>
                );
              })}
            </select>
          </Field>
          <Field label="Team B">
            <select
              value={teamB}
              onChange={(e) => {
                setTeamB(e.target.value);
                setPlayerB("");
              }}
            >
              <option value="">Select team</option>
              {data.teams
                .filter((t) => t.id !== teamA)
                .map((t) => (
                  <option key={t.id} value={t.id}>
                    {t.name}
                  </option>
                ))}
            </select>
          </Field>
          <Field
            label="Player from Team B"
            hint={
              remainingCount() == null
                ? undefined
                : remainingCount() === 0
                ? "Every pairing between these two teams has been played."
                : `${remainingCount()} pairing${remainingCount() === 1 ? "" : "s"} left between these teams.`
            }
          >
            <select value={playerB} onChange={(e) => setPlayerB(e.target.value)} disabled={!teamB}>
              <option value="">Select player</option>
              {roster(teamB).map((p) => {
                const done = playerA ? hasPlayed(playerA, p.id) : allPlayedAgainst(p.id, teamA);
                return (
                  <option key={p.id} value={p.id} disabled={done}>
                    {fullName(p)}
                    {done ? " \u2014 already played" : ""}
                  </option>
                );
              })}
            </select>
          </Field>
        </div>
        <button className="btn btn-primary" onClick={startMatch}>
          Start match
        </button>
      </section>

      {data.matches.length === 0 ? (
        <Empty title="No matches yet" body="Set up a match above and the scoreboard appears here." />
      ) : (
        data.matches.map((m) => {
          const r = matchResult(m);
          const active = activeSetIndex(m);
          const ta = teamById(m.teamA);
          const tb = teamById(m.teamB);
          const pa = data.players.find((p) => p.id === m.playerA);
          const pb = data.players.find((p) => p.id === m.playerB);
          return (
            <section className={"board" + (m.status === "live" ? " live" : "")} key={m.id}>
              <div className="board-top">
                <span className={"status " + m.status}>
                  {m.status === "live" ? "Live now" : "Final"}
                </span>
                <span className="mono muted">{prettyDate(m.date)}</span>
                <div className="board-top-actions">
                  <button
                    className="btn btn-tiny"
                    onClick={() => setStatus(m.id, m.status === "live" ? "final" : "live")}
                  >
                    {m.status === "live" ? "Mark final" : "Reopen"}
                  </button>
                  <button className="btn btn-tiny btn-danger" onClick={() => removeMatch(m.id)}>
                    Delete
                  </button>
                </div>
              </div>

              <div className="board-body">
                <div className={"side" + (r.winner === "a" ? " won" : "")}>
                  <span className="side-team">{ta ? ta.name : "—"}</span>
                  <span className="side-player">{pa ? fullName(pa) : "—"}</span>
                  <span className="side-sets mono">{r.aSets}</span>
                  <span className="side-pts">{r.aPts} pts</span>
                </div>

                <div className="net" aria-hidden="true" />

                <div className={"side right" + (r.winner === "b" ? " won" : "")}>
                  <span className="side-team">{tb ? tb.name : "—"}</span>
                  <span className="side-player">{pb ? fullName(pb) : "—"}</span>
                  <span className="side-sets mono">{r.bSets}</span>
                  <span className="side-pts">{r.bPts} pts</span>
                </div>
              </div>

              {active >= 0 ? (
                <div className="rally">
                  <div className="rally-label">
                    Set {active + 1} · first to {POINTS_TO_WIN_SET}
                    {r.decided ? " · match already won, but this set is still worth 5" : ""}
                  </div>
                  <div className="rally-grid">
                    <div className="rally-side">
                      <div className="rally-score mono">{num(m.sets[active].a)}</div>
                      <div className="rally-btns">
                        <button className="btn btn-point" onClick={() => addPoint(m.id, "a", 1)}>
                          + Point
                        </button>
                        <button className="btn btn-tiny" onClick={() => addPoint(m.id, "a", -1)}>
                          Undo
                        </button>
                      </div>
                    </div>
                    <div className="rally-dash" aria-hidden="true">
                      –
                    </div>
                    <div className="rally-side">
                      <div className="rally-score mono">{num(m.sets[active].b)}</div>
                      <div className="rally-btns">
                        <button className="btn btn-point" onClick={() => addPoint(m.id, "b", 1)}>
                          + Point
                        </button>
                        <button className="btn btn-tiny" onClick={() => addPoint(m.id, "b", -1)}>
                          Undo
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              ) : (
                <div className="rally done">
                  <div className="rally-label">
                    Match over — {r.winner === "a" ? (pa ? fullName(pa) : "Team A") : pb ? fullName(pb) : "Team B"} wins{" "}
                    {Math.max(r.aSets, r.bSets)}–{Math.min(r.aSets, r.bSets)} · {r.aPts}–{r.bPts} points
                  </div>
                </div>
              )}

              <div className="sets-row">
                {m.sets.map((s, i) => {
                  const done = setDone(s);
                  return (
                    <div className={"set-box" + (i === active ? " current" : "") + (done ? " done" : "")} key={i}>
                      <span className="set-label">
                        Set {i + 1}
                        {i === active ? " · playing" : done ? (num(s.a) > num(s.b) ? " · A" : " · B") : ""}
                      </span>
                      <div className="set-inputs">
                        <input
                          className="mono"
                          inputMode="numeric"
                          value={s.a}
                          onChange={(e) => setScore(m.id, i, "a", e.target.value)}
                        />
                        <span>:</span>
                        <input
                          className="mono"
                          inputMode="numeric"
                          value={s.b}
                          onChange={(e) => setScore(m.id, i, "b", e.target.value)}
                        />
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>
          );
        })
      )}
    </div>
  );
}

/* ============================================================
   Standings
   ============================================================ */

function useStandings(data) {
  return useMemo(() => computeStandings(data, "all"), [data.teams, data.matches, data.bonuses]);
}

/* Pass a date for one day's table, or "all" for the tournament so far.
   A single day's table leaves the manual bonus out — that is a
   tournament-wide adjustment, not something earned on the day. */
function computeStandings(data, day) {
  const wholeRun = !day || day === "all";
  const table = data.teams.map((t) => ({
    id: t.id,
    name: t.name,
    played: 0,
    matchWins: 0,
    matchLosses: 0,
    setsWon: 0,
    setsLost: 0,
    setsPlayed: 0,
    setPoints: 0,
    matchPoints: 0,
    manualBonus: 0,
    points: 0,
  }));
  const byId = {};
  table.forEach((r) => (byId[r.id] = r));
  data.matches.forEach((m) => {
    if (!wholeRun && m.date !== day) return;
    const r = matchResult(m);
    const A = byId[m.teamA];
    const B = byId[m.teamB];
    if (!A || !B) return;
    A.played++;
    B.played++;
    A.setsWon += r.aSets;
    B.setsWon += r.bSets;
    A.setsLost += r.bSets;
    B.setsLost += r.aSets;
    A.setsPlayed += r.setsPlayed;
    B.setsPlayed += r.setsPlayed;
    A.setPoints += r.aSets * 5;
    B.setPoints += r.bSets * 5;
    if (r.winner === "a") {
      A.matchWins++;
      A.matchPoints += 25;
      B.matchLosses++;
    }
    if (r.winner === "b") {
      B.matchWins++;
      B.matchPoints += 25;
      A.matchLosses++;
    }
  });
  table.forEach((t) => {
    t.manualBonus = wholeRun ? Number((data.bonuses || {})[t.id]) || 0 : 0;
    t.points = t.setPoints + t.matchPoints + t.manualBonus;
  });
  table.sort((a, b) => b.points - a.points || b.setsWon - a.setsWon || a.name.localeCompare(b.name));
  return table;
}

/* Junior standings are per player, not per team. Same points shape as the
   team table so the two read alike: 5 a set, 25 a match win. */
function computeJuniorStandings(data, cat, day) {
  const wholeRun = !day || day === "all";
  const rows = data.players
    .filter((p) => p.gender === cat)
    .map((p) => ({
      id: p.id,
      name: fullName(p),
      played: 0,
      matchWins: 0,
      setsWon: 0,
      setsLost: 0,
      setPoints: 0,
      matchPoints: 0,
      points: 0,
    }));
  const byId = {};
  rows.forEach((r) => (byId[r.id] = r));

  data.matches.forEach((m) => {
    if (!wholeRun && m.date !== day) return;
    const A = byId[m.playerA];
    const B = byId[m.playerB];
    if (!A || !B) return; // both sides must be in this category
    const r = matchResult(m);
    A.played++;
    B.played++;
    A.setsWon += r.aSets;
    B.setsWon += r.bSets;
    A.setsLost += r.bSets;
    B.setsLost += r.aSets;
    A.setPoints += r.aSets * 5;
    B.setPoints += r.bSets * 5;
    if (r.winner === "a") {
      A.matchWins++;
      A.matchPoints += 25;
    }
    if (r.winner === "b") {
      B.matchWins++;
      B.matchPoints += 25;
    }
  });

  rows.forEach((t) => (t.points = t.setPoints + t.matchPoints));
  return rows
    .filter((t) => t.played > 0)
    .sort((a, b) => b.points - a.points || b.setsWon - a.setsWon || a.name.localeCompare(b.name));
}

/* Pass a date to score just that day, or "all" for the whole tournament. */
function playerStats(data, pid, day) {
  let played = 0;
  let won = 0;
  let setsWon = 0;
  let setsLost = 0;
  let rallyPoints = 0;
  let pointsContributed = 0;
  data.matches.forEach((m) => {
    if (day && day !== "all" && m.date !== day) return;
    const isA = m.playerA === pid;
    const isB = m.playerB === pid;
    if (!isA && !isB) return;
    const r = matchResult(m);
    played++;
    if ((isA && r.winner === "a") || (isB && r.winner === "b")) won++;
    setsWon += isA ? r.aSets : r.bSets;
    setsLost += isA ? r.bSets : r.aSets;
    (m.sets || []).forEach((s) => (rallyPoints += isA ? num(s.a) : num(s.b)));
    pointsContributed += isA ? r.aPts : r.bPts;
  });
  return { played, won, setsWon, setsLost, rallyPoints, pointsContributed };
}

/* Everyone who played on the chosen day, strongest first. */
function dayRankings(data, day, category) {
  const rows = data.players
    .filter((p) => (category === "all" ? true : p.gender === category))
    .map((p) => ({ player: p, ...playerStats(data, p.id, day) }))
    .filter((r) => r.played > 0);

  rows.sort(
    (a, b) =>
      b.pointsContributed - a.pointsContributed ||
      b.won - a.won ||
      b.setsWon - a.setsWon ||
      a.setsLost - b.setsLost ||
      b.rallyPoints - a.rallyPoints ||
      fullName(a.player).localeCompare(fullName(b.player))
  );
  return rows.map((r, i) => ({ ...r, rank: i + 1 }));
}

function FixturesTab({ data, update, tiers, notify }) {
  const [crossTier, setCrossTier] = useState(true);
  const [dayFilter, setDayFilter] = useState("all");
  const [catFilter, setCatFilter] = useState("all");
  const [kindFilter, setKindFilter] = useState("all");
  const [threshold, setThreshold] = useState(DEFAULT_COVERAGE);
  const [openTier, setOpenTier] = useState(null);

  const groups = useMemo(() => tierGroupList(data, tiers), [data.players, data.teams, data.tierCounts, tiers]);
  const plan = data.tierPlan || {};
  const fixtures = data.fixtures || [];

  const teamName = (id) => (data.teams.find((t) => t.id === id) || {}).name || "—";
  const sideName = (f, id) => (f.individual ? catLabel(f.category) : teamName(id));
  const playerName = (id) => {
    const p = data.players.find((x) => x.id === id);
    return p ? fullName(p) : "—";
  };

  const runPlan = () => {
    if (!groups.length) {
      notify("Nobody is calibrated and on a team yet, so there are no tiers to place.");
      return;
    }
    const next = planTiers(data, tiers, { threshold });
    update((d) => ({ ...d, tierPlan: next }));
    const met = groups.filter((g) => next[g.key] && next[g.key].meetsThreshold).length;
    const left = groups.reduce((n, g) => n + ((next[g.key] || {}).unplaced || []).length, 0);
    notify(
      `${groups.length} tiers placed. ${met} cleared ${Math.round(threshold * 100)}% on one slot` +
        (left ? `, ${left} players still need a time.` : ".")
    );
  };

  const setPlanField = (key, field, value) => {
    update((d) => ({
      ...d,
      tierPlan: { ...(d.tierPlan || {}), [key]: { ...((d.tierPlan || {})[key] || {}), [field]: value } },
      fixtures: (d.fixtures || []).map((f) =>
        !f.matchId && groupKey(f.category, f.hostTier) === key ? { ...f, [field]: value } : f
      ),
    }));
  };

  const generate = () => {
    if (!groups.length) {
      notify("Calibrate players and put them on teams first.");
      return;
    }
    const built = buildFixtures(data, tiers, plan, { crossTier });
    if (!built.length) {
      notify("No fixtures — you need at least two teams with calibrated players in them.");
      return;
    }
    const played = fixtures.filter((f) => f.matchId);
    if (
      fixtures.length &&
      !window.confirm(
        `Replace ${fixtures.length} fixtures with a fresh draw of ${built.length}? ` +
          (played.length ? `${played.length} already sent to the scoreboard will be kept.` : "")
      )
    ) {
      return;
    }
    const keepKeys = new Set(played.map((f) => f.playerA + "|" + f.playerB));
    const merged = [...played, ...built.filter((f) => !keepKeys.has(f.playerA + "|" + f.playerB))];
    update((d) => ({ ...d, fixtures: merged }));
    notify(`${built.length} fixtures drawn. ${built.filter((f) => f.sameTier).length} are tier-on-tier.`);
  };

  const sendToScoreboard = (f) => {
    const m = {
      id: uid(),
      date: f.date || ymd(new Date()),
      teamA: f.teamA,
      teamB: f.teamB,
      category: f.category,
      individual: !!f.individual,
      playerA: f.playerA,
      playerB: f.playerB,
      sets: [
        { a: "0", b: "0" },
        { a: "0", b: "0" },
        { a: "0", b: "0" },
      ],
      status: "live",
      fixtureId: f.id,
      scorer: (((data.refDuty || {})[f.date || ymd(new Date())] || [])[0] || {}).name || "",
    };
    update((d) => ({
      ...d,
      matches: [m, ...d.matches],
      fixtures: (d.fixtures || []).map((x) => (x.id === f.id ? { ...x, matchId: m.id } : x)),
    }));
    notify(`${playerName(f.playerA)} v ${playerName(f.playerB)} is live on the scoreboard.`);
  };

  const days = Array.from(new Set(fixtures.map((f) => f.date).filter(Boolean))).sort();

  const shown = fixtures.filter((f) => {
    if (dayFilter !== "all" && f.date !== dayFilter) return false;
    if (catFilter !== "all" && f.category !== catFilter) return false;
    if (kindFilter === "tier" && !f.sameTier) return false;
    if (kindFilter === "cross" && f.sameTier) return false;
    if (kindFilter === "noslot" && f.slot) return false;
    return true;
  });

  /* Every field on this page, in one export. */
  const columns = [
    "Date",
    "Day",
    "Weekend",
    "Time",
    "Category",
    "Host Tier",
    "Fixture Type",
    "Team A",
    "Player A",
    "Tier A",
    "Team B",
    "Player B",
    "Tier B",
    "Needs A Time",
    "Sent To Scoreboard",
  ];
  const rows = shown.map((f) => [
    f.date,
    f.date ? new Date(f.date + "T00:00:00").toLocaleDateString(undefined, { weekday: "long" }) : "",
    f.date ? (isWeekend(f.date) ? "Yes" : "No") : "",
    f.slot,
    catLabel(f.category),
    f.hostTier,
    f.sameTier ? "Same tier" : "Cross tier",
    teamName(f.teamA),
    playerName(f.playerA),
    f.tierA,
    teamName(f.teamB),
    playerName(f.playerB),
    f.tierB,
    f.slot ? "No" : "Yes",
    f.matchId ? "Yes" : "No",
  ]);

  const nameList = (ids) => (ids || []).map(playerName).join("; ");
  const planColumns = [
    "Category",
    "Tier",
    "Players",
    "Date",
    "Weekend",
    "Main Slot",
    "In Main Sitting",
    "Second Slot",
    "In Second Sitting",
    "Overlap %",
    "Meets Threshold",
    "Still To Place",
    "Main Sitting Players",
    "Second Sitting Players",
    "Unplaced Players",
  ];
  const planRows = groups.map((g) => {
    const p = plan[g.key] || {};
    return [
      catLabel(g.category),
      g.tier,
      g.members.length,
      p.date || "",
      p.date ? (isWeekend(p.date) ? "Yes" : "No") : "",
      p.slot || "",
      (p.primary || []).length,
      p.secondSlot || "",
      (p.second || []).length,
      Math.round((p.coverage || 0) * 100) + "%",
      p.date ? (p.meetsThreshold ? "Yes" : "No") : "",
      (p.unplaced || []).length,
      nameList(p.primary),
      nameList(p.second),
      nameList(p.unplaced),
    ];
  });

  return (
    <div className="stack">
      <DataBar
        name="fixtures"
        columns={columns}
        rows={rows}
        note={`${fixtures.length} fixtures drawn · exporting the ${shown.length} shown below`}
        notify={notify}
      />

      <section className="card">
        <header className="card-head">
          <h2>Tier days</h2>
          <div className="head-tools">
            <label className="range">
              <span>Enough is</span>
              <select value={threshold} onChange={(e) => setThreshold(Number(e.target.value))}>
                {[0.5, 0.6, 0.7, 0.8, 0.9, 1].map((v) => (
                  <option key={v} value={v}>
                    {Math.round(v * 100)}% of the tier
                  </option>
                ))}
              </select>
            </label>
            <button className="btn" onClick={runPlan}>
              Find the best date for each tier
            </button>
          </div>
        </header>
        <p className="muted plan-note">
          A tier plays on one date across every team. The date picked is the one where the largest
          block of that tier is free at the same time — once that block passes your threshold the day
          is good enough to lock. Whoever the main sitting misses gets a second sitting at the other
          end of the same day, and anyone still left over is listed so you can chase them. Men's and
          women's tiers 1 and 2 get first refusal on Friday, Saturday and Sunday.
        </p>

        {groups.length === 0 ? (
          <Empty
            title="No tiers to place yet"
            body="Rate players on the Calibration page and put them on teams, then come back."
          />
        ) : (
          <div className="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Tier</th>
                  <th>Date</th>
                  <th>Main sitting</th>
                  <th>Second sitting</th>
                  <th>Still to place</th>
                  <th>Overlap</th>
                  <th />
                </tr>
              </thead>
              <tbody>
                {groups.map((g) => {
                  const p = plan[g.key] || {};
                  const pct = Math.round((p.coverage || 0) * 100);
                  const left = (p.unplaced || []).length;
                  const open = openTier === g.key;
                  const options = open ? dateOptions(data, g) : [];
                  return (
                    <React.Fragment key={g.key}>
                      <tr>
                        <td>
                          <span className={"chip tier-" + Math.min(g.tier, 5)}>

                        <td>

                        </td>
                        <td className="row-actions">
                          <button
                            className="btn btn-tiny"

                            {open ? "Hide dates" : "Compare dates"}

                        </td>
                      </tr>

                      {open ? (
                        <tr className="drawer">
                          <td colSpan={7}>
                            <div className="overlap">
                              <div className="overlap-dates">
                                <h3>
                                  Best dates for {catLabel(g.category)} tier {g.tier}
                                </h3>
                                {options.length === 0 ? (
                                  <p className="muted">
