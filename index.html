  --table: #0B1B3D;
  --panel: #142A55;
  --panel-2: #1D3A70;
  --chalk: #EEF3FB;
  --muted: #93A7CC;
  --ball: #E8272E;
  --ball-2: #FF4A50;
  --blue: #4C9BFF;
  --blue-deep: #1E5FD0;
  --line: rgba(238,243,251,0.13);
  --line-strong: rgba(238,243,251,0.26);
  --good: #3ED6A4;
  background: var(--table);
  color: var(--chalk);
  font-family: 'Inter Tight', system-ui, sans-serif;
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.5;
}
.app {
  position: relative;
  background-image: var(--wallpaper, none);
  background-size: cover;
  background-position: center top;
  background-attachment: fixed;
  background-repeat: no-repeat;
}
.app::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(6,14,31,0.72) 0%, rgba(6,14,31,0.90) 55%, rgba(6,14,31,0.97) 100%);
}
.app > * { position: relative; z-index: 1; }
.app * { box-sizing: border-box; }
.app h1, .app h2, .app h3 {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 0;
}
.app .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.app .muted { color: var(--muted); font-size: 13px; }
.app .strong { font-weight: 600; }

/* boot */
.boot { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
.boot p { color: var(--muted); }
.boot-ball { width:26px; height:26px; border-radius:50%; background: var(--ball);
  animation: bounce 0.9s cubic-bezier(.5,0,.5,1) infinite alternate; }
@keyframes bounce { from { transform: translateY(-22px); } to { transform: translateY(10px) scaleY(.9); } }

/* topbar */
.topbar {
  backdrop-filter: blur(6px);
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding: 18px 24px; border-bottom: 1px solid var(--line);
  background: rgba(6,14,31,0.88); position: sticky; top:0; z-index: 30;
}
.brand { display:flex; align-items:center; gap:14px; }
.brand h1 { font-size: 20px; }
.brand-sub { color: var(--muted); font-size: 12.5px; letter-spacing:.02em; }
.brand-ball { width:16px; height:16px; border-radius:50%; background: var(--ball);
  box-shadow: 0 0 0 5px rgba(232,39,46,0.16); flex:none; }

/* layout */
.shell { display:flex; align-items:flex-start; }
.rail {
  background: rgba(6,14,31,0.55);
  width: 216px; flex:none; position: sticky; top: 73px;
  padding: 18px 12px; border-right: 1px solid var(--line);
  height: calc(100vh - 73px); overflow:auto;
}
.rail-item {
  display:flex; align-items:baseline; gap:10px; width:100%; text-align:left;
  padding: 10px 12px; margin-bottom: 2px; border-radius: 8px;
  background: transparent; border: 0; color: var(--muted); cursor:pointer;
  font-family: 'Inter Tight'; font-size: 14.5px;
}
.rail-item:hover { background: rgba(238,243,251,0.05); color: var(--chalk); }
.rail-item.on { background: var(--panel); color: var(--chalk); font-weight:600; }
.rail-item.on .rail-num { color: var(--ball); }
.rail-num { font-size: 11px; color: rgba(238,243,251,0.32); }
.main { flex:1; padding: 24px; min-width: 0; }
.stack { display:flex; flex-direction:column; gap: 16px; max-width: 1100px; }

/* cards */
.card { background: rgba(20,42,85,0.90); backdrop-filter: blur(3px); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.card-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom: 14px; }
.card-head h2 { font-size: 16px; }
.head-tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

/* forms */
.grid-form { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin-bottom: 14px; }
.grid-form.four { grid-template-columns: repeat(4, minmax(0,1fr)); }
.field { display:flex; flex-direction:column; gap:6px; min-width:0; }
.field-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight:600; }
.field-hint { font-size: 11.5px; color: rgba(147,167,204,0.8); }
.field-action { justify-content: flex-end; }
.app input, .app select, .app textarea {
  background: var(--ink); border: 1px solid var(--line-strong); color: var(--chalk);
  border-radius: 8px; padding: 9px 11px; font-size: 14.5px; font-family: 'Inter Tight'; width: 100%;
}
.app textarea { font-family: 'JetBrains Mono'; font-size: 12.5px; }
.app input:focus, .app select:focus, .app textarea:focus, .app button:focus-visible {
  outline: 2px solid var(--ball); outline-offset: 1px;
}
.app input.readonly { color: var(--muted); }
.app input::placeholder { color: rgba(147,167,204,0.55); }
.app select option { background: #061126; color: #EEF3FB; }
.search { max-width: 220px; }
.inline-add { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.inline-add input, .inline-add select { flex:1; min-width: 160px; }

/* buttons */
.app .btn {
  background: var(--panel-2); border: 1px solid var(--line-strong); color: var(--chalk);
  border-radius: 8px; padding: 9px 14px; font-size: 14px; font-weight:500;
  cursor:pointer; font-family: 'Inter Tight'; white-space: nowrap;
}
.app .btn:hover { background: rgba(238,243,251,0.14); }
.app .btn-primary { background: var(--ball); border-color: var(--ball); color: #FFF6F6; font-weight:600; }
.app .btn-primary:hover { background: var(--ball-2); }
.app .btn-ghost { background: transparent; }
.app .btn-tiny { padding: 5px 10px; font-size: 12.5px; }
.app .btn-danger { color: #FF9FA3; border-color: rgba(255,159,163,0.35); }
.app .btn-danger:hover { background: rgba(232,39,46,0.16); }

/* data bar */
.databar {
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding: 12px 16px; border: 1px dashed var(--line-strong); border-radius: 12px;
}
.databar-left { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.databar-tag { font-size: 10.5px; text-transform:uppercase; letter-spacing:.14em; color: var(--ball); font-weight:700; }
.databar-count { font-family:'JetBrains Mono'; font-size:12.5px; }
.databar-note { font-size: 12px; color: var(--muted); }
.databar-right { display:flex; gap:8px; flex-wrap:wrap; }

/* tables */
.table-scroll { overflow-x:auto; margin: 0 -20px -18px; padding: 0 20px 4px; }
.app table { width:100%; border-collapse: collapse; font-size: 14px; }
.app th {
  text-align:left; font-size: 11px; text-transform:uppercase; letter-spacing:.09em;
  color: var(--muted); font-weight:600; padding: 8px 10px; border-bottom: 1px solid var(--line-strong);
}
.app td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.app tbody tr:hover { background: rgba(238,243,251,0.04); }
.row-actions { display:flex; gap:6px; justify-content:flex-end; }
.cat-select { padding: 5px 8px; font-size: 13px; min-width: 92px; }
.cat-select.unsure { border-color: var(--ball); color: var(--ball); }
.rating-cell { display:flex; align-items:center; gap:8px; }
.rating-cell b { font-size: 12.5px; color: var(--muted); }

/* stars */
.stars { position: relative; display:inline-block; letter-spacing: 2px; line-height:1; white-space: nowrap; }
.stars-bg { color: rgba(238,243,251,0.18); }
.stars-fg { position:absolute; left:0; top:0; overflow:hidden; color: var(--ball); }

/* chips */
.chip {
  display:inline-flex; align-items:center; gap:6px; padding: 3px 9px; border-radius: 999px;
  font-size: 12px; font-weight:600; border: 1px solid var(--line-strong); background: var(--ink);
}
.chip em { font-style:normal; font-weight:400; color: var(--muted); font-size: 11px; }
.chip-quiet { color: var(--muted); font-weight:400; }
.tier-1 { border-color: var(--ball); color: #FF7A7E; }
.tier-2 { border-color: #FF8FA0; color: #FF8FA0; }
.tier-3 { border-color: #B98CD8; color: #B98CD8; }
.tier-4 { border-color: var(--blue); color: var(--blue); }
.tier-5 { border-color: #7FD0E8; color: #7FD0E8; }
.chip-tier { border-color: var(--blue); color: var(--blue); }
.chip-weekend { border-color: var(--ball); color: #FF7A7E; }
.good-text { color: var(--good); }

/* empty */
.empty { text-align:center; padding: 34px 16px; }
.empty-mark { width:34px; height:34px; margin: 0 auto 12px; border-radius:50%;
  border: 2px dashed var(--line-strong); }
.empty h3 { font-size: 15px; margin-bottom: 4px; }
.empty p { color: var(--muted); font-size: 13.5px; margin:0; }

/* calendar */
.cal-head, .cal-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-head { margin-bottom: 6px; }
.cal-head span { font-size: 10.5px; text-transform:uppercase; letter-spacing:.09em; color: var(--muted); text-align:center; }
.cal-cell {
  position: relative; aspect-ratio: 1 / 1; border-radius: 8px; border: 1px solid var(--line);
  background: var(--ink); color: var(--chalk); cursor:pointer; font-family:'JetBrains Mono'; font-size: 13px;
  display:flex; align-items:center; justify-content:center;
}
.cal-cell:disabled { opacity: .4; cursor: not-allowed; }
.cal-cell.has { border-color: var(--ball); }
.cal-cell.open { background: var(--ball); color:#FFF6F6; border-color: var(--ball); }
.cal-pad { border: 0; background: transparent; }
.cal-dot { position:absolute; top:4px; right:5px; font-size: 9.5px; background: var(--ball); color:#FFF6F6;
  border-radius: 999px; padding: 0 4px; font-weight:700; }
.cal-cell.open .cal-dot { background: #FFF6F6; color: var(--ball); }
.slot-panel { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.slot-panel h3 { font-size: 14px; margin-bottom: 10px; }
.slot-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 8px; }
.slot { padding: 10px; border-radius: 8px; border:1px solid var(--line-strong); background: var(--ink);
  color: var(--chalk); cursor:pointer; font-size: 13.5px; font-family:'Inter Tight'; }
.slot.on { background: var(--ball); color:#FFF6F6; border-color: var(--ball); font-weight:600; }
.slot-list { list-style:none; margin:0; padding:0; }
.slot-list li { display:flex; justify-content:space-between; gap:12px; padding: 9px 0;
  border-bottom: 1px solid var(--line); font-size: 13.5px; }
.slot-list li span:last-child { color: var(--muted); text-align:right; }

/* calibration */
.cal-rows { display:flex; flex-direction:column; gap: 4px; }
.cal-row { display:grid; grid-template-columns: 1fr auto 64px; align-items:center; gap: 14px;
  padding: 10px 0; border-bottom: 1px solid var(--line); }
.cal-row-name b { font-weight:600; }
.cal-row-name .weight { color: var(--ball); font-size: 11px; margin-left: 8px;
  font-family:'JetBrains Mono'; }
.marks { display:flex; gap: 5px; }
.mark { width: 36px; height: 36px; border-radius: 8px; border:1px solid var(--line-strong);
  background: var(--ink); color: var(--muted); cursor:pointer; font-family:'JetBrains Mono'; font-size: 13px; }
.mark.on { background: var(--ball); color:#FFF6F6; border-color:var(--ball); font-weight:700; }
.cal-row-contrib { text-align:right; color: var(--muted); font-size: 12.5px; }
.total-strip { display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
  margin-top: 18px; padding: 16px 18px; border-radius: 12px; background: var(--ink); }
.total-num { font-size: 30px; font-weight:700; line-height:1.1; }
.total-num i { font-size: 14px; color: var(--muted); font-style:normal; }

/* tiers */
.tier-cols { display:grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 12px; }
.tier-col { background: var(--ink); border-radius: 10px; overflow:hidden; border:1px solid var(--line); }
.tier-col-head { display:flex; justify-content:space-between; padding: 9px 12px;
  border-bottom: 1px solid var(--line); font-size: 13px; }
.tier-col-head span { color: var(--muted); font-family:'JetBrains Mono'; font-size: 12px; }
.tier-col ul { list-style:none; margin:0; padding: 6px 0; }
.tier-col li { display:flex; justify-content:space-between; gap:8px; padding: 6px 12px; font-size: 13.5px; }
.tier-col li b { color: var(--muted); font-size: 12px; font-weight:400; }

/* teams */
.team-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(320px,1fr)); gap: 16px; }

.toggle { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); cursor:pointer; }
.toggle input { width:16px; height:16px; accent-color:var(--blue); cursor:pointer; }
.fit-list { list-style:none; margin:8px 0 0; padding:0; display:grid; gap:6px; font-size:13px; }
.fit-list li { color:var(--muted); }
.fit-list b { color:var(--chalk); }
.roster { list-style:none; margin: 0 0 14px; padding:0; }
.roster li { display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.roster-meta { display:flex; align-items:center; gap:8px; }

/* scoreboard — the signature */
.board { background: rgba(6,14,31,0.90); backdrop-filter: blur(3px); border: 1px solid var(--line); border-radius: 14px; overflow:hidden; }
.board.live { border-color: var(--ball); box-shadow: 0 0 0 1px rgba(232,39,46,0.25); }
.board-top { display:flex; align-items:center; gap:12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.board-top-actions { margin-left:auto; display:flex; gap:6px; }
.status { font-size: 10.5px; text-transform:uppercase; letter-spacing:.14em; font-weight:700; }
.status.live { color: var(--ball); }
.status.live::before { content:''; display:inline-block; width:7px; height:7px; border-radius:50%;
  background: var(--ball); margin-right:7px; animation: pulse 1.4s ease-in-out infinite; }
.status.final { color: var(--muted); }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }
.board-body { display:grid; grid-template-columns: 1fr 2px 1fr; align-items:center; padding: 20px 16px; }
.side { display:flex; flex-direction:column; gap: 2px; padding: 0 12px; min-width:0; }
.side.right { align-items:flex-end; text-align:right; }
.side-team { font-size: 11px; text-transform:uppercase; letter-spacing:.11em; color: var(--muted); }
.side-player { font-family:'Bricolage Grotesque'; font-weight:700; font-size: 19px; letter-spacing:-.02em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.side-sets { font-size: 48px; font-weight:700; line-height: 1.05; color: var(--chalk); }
.side.won .side-sets { color: var(--ball); }
.side-pts { font-size: 12px; color: var(--muted); font-family:'JetBrains Mono'; }
.net { align-self: stretch; background: repeating-linear-gradient(to bottom,
  var(--line-strong) 0 8px, transparent 8px 16px); }
.rally { padding: 4px 16px 18px; }
.rally-label { text-align:center; font-size: 11px; text-transform:uppercase; letter-spacing:.14em;
  color: var(--ball); font-weight:700; margin-bottom: 10px; }
.rally.done .rally-label { color: var(--good); padding: 6px 0 2px; }
.rally-grid { display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap: 12px; }
.rally-side { display:flex; flex-direction:column; align-items:center; gap: 10px; }
.rally-score { font-size: 62px; font-weight:700; line-height:1; }
.rally-dash { color: var(--muted); font-size: 28px; }
.rally-btns { display:flex; flex-direction:column; align-items:center; gap:6px; width:100%; }
.app .btn-point { background: var(--ball); border-color: var(--ball); color:#FFF6F6; font-weight:700;
  width:100%; max-width: 190px; padding: 14px 10px; font-size: 16px; }
.app .btn-point:hover { background: var(--ball-2); }
.app .btn-point:active { transform: scale(.98); }
.set-box.current { background: rgba(232,39,46,0.10); }
.set-box.done .set-label { color: var(--good); }
.sets-row { display:grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line);
  border-top: 1px solid var(--line); }
.set-box { background: var(--ink); padding: 12px; text-align:center; }
.set-label { font-size: 10.5px; text-transform:uppercase; letter-spacing:.11em; color: var(--muted); }
.set-inputs { display:flex; align-items:center; justify-content:center; gap:8px; margin-top: 6px; }
.set-inputs input { width: 58px; text-align:center; padding: 7px 4px; font-size: 16px; }
.set-inputs span { color: var(--muted); }

/* standings */
.leader { background: var(--ball); color:#FFF6F6; border-radius: 14px; padding: 20px 24px;
  display:flex; align-items:center; gap: 18px; flex-wrap:wrap; }
.leader .databar-tag { color: rgba(42,16,0,0.65); }
.leader h2 { font-size: 26px; flex:1; min-width: 140px; }
.leader .muted { color: rgba(42,16,0,0.7); }
.leader-num { font-size: 42px; font-weight:700; line-height:1; }
.standings .rank { color: var(--muted); }
.standings tbody tr { cursor: pointer; }
.standings tr.picked td { background: rgba(232,39,46,0.16); }
.bonus-input { width: 68px; text-align:center; padding: 6px 4px; font-size: 14px;
  border-style: dashed; border-color: var(--ball); color: var(--ball); }
.bonus-input:placeholder-shown { border-color: var(--line-strong); color: var(--chalk); }
.standings .total { font-weight:700; font-size: 15px; }
.standings tr.first td { background: rgba(232,39,46,0.09); }
.standings tr.first .rank { color: var(--ball); font-weight:700; }

/* player card */
.player-card { background: linear-gradient(140deg, rgba(29,58,112,0.92), rgba(20,42,85,0.92));
  border:1px solid var(--line-strong); border-radius: 14px; padding: 22px 24px; }
.pc-top { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.pc-top h2 { font-size: 27px; margin: 4px 0 2px; }
.pc-tier { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.pc-stars { display:flex; align-items:center; gap: 14px; margin-top: 18px;
  padding-top: 16px; border-top: 1px solid var(--line); }
.pc-score { font-size: 15px; color: var(--muted); }
.bars { display:flex; flex-direction:column; gap: 10px; }
.bar-row { display:grid; grid-template-columns: 150px 1fr 48px; align-items:center; gap: 12px; }
.bar-name { font-size: 13.5px; }
.bar-name i { color: var(--ball); font-style:normal; font-size: 11px; font-family:'JetBrains Mono'; }
.bar-track { height: 8px; border-radius: 999px; background: var(--ink); overflow:hidden; }
.bar-fill { display:block; height:100%; background: var(--ball); border-radius: 999px; }
.bar-val { font-size: 12.5px; color: var(--muted); text-align:right; }
.stat-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(110px,1fr)); gap: 10px; }
.stat { background: var(--ink); border-radius: 10px; padding: 14px; text-align:center; }
.stat span { display:block; font-size: 26px; font-weight:700; }
.stat em { font-style:normal; font-size: 11.5px; color: var(--muted); text-transform:uppercase; letter-spacing:.08em; }
.stat.accent span { color: var(--ball); }

/* sign in */
.gate { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 28px 20px; }
.gate-inner { width: 100%; max-width: 560px; }
.gate-brand { display:flex; align-items:center; gap: 14px; margin-bottom: 6px; }
.gate-brand h1 { font-size: 30px; }
.gate-sub { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
.gate-roles { display:flex; flex-direction:column; gap: 8px; }
.gate-role {
  display:grid; grid-template-columns: 1fr auto; gap: 4px 14px; text-align:left;
  padding: 14px 16px; border-radius: 12px; cursor:pointer;
  background: rgba(20,42,85,0.72); border: 1px solid var(--line-strong); color: var(--chalk);
  font-family:'Inter Tight'; font-size: 14px;
}
.gate-role:hover { border-color: var(--blue); }
.gate-role.on { border-color: var(--ball); background: rgba(232,39,46,0.12); }
.gate-role b { font-family:'Bricolage Grotesque'; font-size: 16px; }
.gate-role span { grid-column: 1; color: var(--muted); font-size: 13px; }
.gate-role i { grid-row: 1; grid-column: 2; font-style:normal; font-size: 10.5px;
  text-transform:uppercase; letter-spacing:.12em; font-weight:700; }
.gate-lock { color: var(--ball-2); }
.gate-open { color: var(--blue); }
.gate-enter { display:flex; gap: 8px; margin-top: 16px; flex-wrap:wrap; }
.gate-code { flex:1; min-width: 160px; letter-spacing: .28em; text-transform:uppercase; font-size: 17px; }

/* role chip in the bar */
.topbar-right { display:flex; align-items:center; gap: 8px; flex-wrap:wrap; }
.role-chip { font-size: 10.5px; text-transform:uppercase; letter-spacing:.13em; font-weight:700;
  padding: 5px 11px; border-radius: 999px; border:1px solid var(--line-strong); color: var(--muted); }
.role-referee { color: var(--blue); border-color: var(--blue); }
.role-admin { color: var(--ball-2); border-color: var(--ball); }
.role-super { background: var(--ball); border-color: var(--ball); color: #FFF6F6; }

/* players roll-up */
.roll { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; }
.roll-cell { text-align:left; padding: 14px 16px; border-radius: 12px; cursor:pointer;
  background: var(--ink); border: 1px solid var(--line); color: var(--chalk); font-family:'Inter Tight'; }
.roll-cell:hover { border-color: var(--blue); }
.roll-cell.on { border-color: var(--ball); background: rgba(232,39,46,0.10); }
.roll-cell.side { border-style: dashed; }
.roll-num { display:block; font-size: 32px; font-weight:700; line-height:1.05; }
.roll-cell em { display:block; font-style:normal; font-size: 13px; font-weight:600; }
.roll-cell small { display:block; color: var(--muted); font-size: 11.5px; margin-top: 3px; }
.roll-note { margin: 12px 0 0; }
.plan-note { margin: 0 0 14px; max-width: 68ch; }

/* fixtures */
.toggle { display:flex; align-items:center; gap: 7px; font-size: 13px; color: var(--muted); cursor:pointer; }
.toggle input { width: 16px; height: 16px; accent-color: var(--ball); }
.date-cell { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.date-cell input { max-width: 160px; }
.when { display:flex; flex-direction:column; }
.when b { font-size: 13.5px; }
.when .muted { font-size: 11.5px; }
.side-cell { display:flex; flex-direction:column; }
.side-cell .muted { font-size: 11.5px; }
.fixtures tr.sent td { opacity: .62; }

/* tier overlap */
.warn-text { color: var(--ball-2); }
.tier-size { font-size: 11px; margin-top: 4px; }
.cov { display:flex; align-items:center; gap: 8px; min-width: 110px; }
.cov-track { flex:1; height: 7px; border-radius: 999px; background: var(--ink); overflow:hidden; }
.cov-fill { display:block; height:100%; background: var(--ball); border-radius: 999px; }
.cov-fill.ok { background: var(--good); }
.cov b { font-size: 12.5px; }
.app tr.drawer:hover { background: transparent; }
.app tr.drawer td { background: rgba(6,14,31,0.55); padding: 16px; }
.overlap { display:grid; grid-template-columns: minmax(300px,1.1fr) minmax(280px,1fr); gap: 20px; }
.overlap h3 { font-size: 13px; margin-bottom: 10px; }
.app table.mini { font-size: 13px; }
.app table.mini th { padding: 6px 8px; }
.app table.mini td { padding: 7px 8px; }
.app table.mini tr.picked td { background: rgba(232,39,46,0.14); }
.sittings { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; }
.sitting { background: var(--ink); border-radius: 10px; padding: 12px 14px; }
.sitting ul { list-style:none; margin: 8px 0 0; padding:0; max-height: 190px; overflow:auto; }
.sitting li { font-size: 12.5px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.sitting.short { border-left: 2px solid var(--ball); }

/* dashboard */
.dash-hero { display:flex; align-items:flex-end; justify-content:space-between; gap: 16px; flex-wrap:wrap;
  padding: 22px 24px; border-radius: 16px;
  background: linear-gradient(120deg, var(--blue-deep) 0%, #12326E 55%, var(--ink) 100%);
  border: 1px solid var(--line-strong); }
.dash-hero h2 { font-size: 26px; margin: 2px 0 4px; }
.dash-hero p { margin: 0; }
.eyebrow { font-size: 10.5px; text-transform:uppercase; letter-spacing:.16em; font-weight:700; color: var(--ball-2); }
.day-pick { max-width: 230px; }
.board-stack { display:flex; flex-direction:column; gap: 12px; }
.set-readout { font-size: 17px; margin-top: 5px; }
.op { display:flex; flex-direction:column; gap: 16px; }
.op-slot { display:flex; align-items:baseline; gap: 10px; padding-bottom: 7px; margin-bottom: 6px;
  border-bottom: 1px solid var(--line-strong); }
.op-slot span { font-size: 13px; font-weight:700; color: var(--blue); }
.op-slot em { font-style:normal; font-size: 11.5px; color: var(--muted); }
.op-list { list-style:none; margin:0; padding:0; }
.op-list li { display:flex; align-items:center; gap: 10px; flex-wrap:wrap;
  padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.op-names { display:flex; align-items:center; gap: 8px; }
.op-names i { font-style:normal; color: var(--ball-2); font-size: 11.5px; font-weight:700; }
.op-teams { margin-left:auto; font-size: 11.5px; }

/* call sheet + referee on duty */
.callup { border-left: 3px solid var(--blue); }
.callup-row { display:grid; grid-template-columns: repeat(auto-fit, minmax(215px,1fr)); gap: 10px; margin-bottom: 12px; }
.callup-chip { display:flex; align-items:center; gap: 10px; background: var(--ink);
  border-radius: 12px; padding: 11px 13px; }
.callup-meta { display:flex; flex-direction:column; gap: 2px; min-width:0; }
.callup-meta b { font-size: 13px; }
.callup-meta i { font-style:normal; font-size: 11.5px; color: var(--muted); }
.duty-row { display:flex; flex-wrap:wrap; gap: 8px; margin-top: 12px; }
.duty-chip { display:inline-flex; align-items:center; gap: 8px; font-size: 12.5px;
  background: var(--ink); border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 8px 6px 13px; }
.duty-chip button { background:none; border:none; color: var(--muted); font-size: 15px;
  line-height:1; cursor:pointer; padding: 0 4px; }
.duty-chip button:hover { color: var(--ball-2); }

/* report */
.honour { display:flex; flex-direction:column; gap: 2px; }
.honour-row { display:flex; align-items:center; gap: 12px; flex-wrap:wrap;
  padding: 10px 0; border-bottom: 1px solid var(--line); }
.honour-name { display:flex; flex-direction:column; gap: 1px; }
.honour-name i { font-style:normal; font-size: 11.5px; color: var(--muted); }
.honour-row .mono { margin-left:auto; font-size: 12px; }
.tier-block { margin-top: 18px; }
.tier-block-head { display:flex; align-items:center; gap: 10px; margin-bottom: 8px; }

.range { display:flex; align-items:center; gap: 7px; font-size: 12px; color: var(--muted); }
.range input { max-width: 155px; }
.standouts { display:grid; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); gap: 12px; }
.standout { background: var(--ink); border-radius: 12px; padding: 16px 18px; border-left: 3px solid var(--ball); }
.standout h3 { font-size: 19px; margin: 6px 0 4px; }
.standout p { margin: 0; font-size: 12.5px; }

/* access codes */
.codes { display:grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr)); gap: 12px; }
.code-card { display:flex; flex-direction:column; gap: 12px; padding: 18px;
  background: var(--ink); border-radius: 12px; border: 1px solid var(--line); }
.code-card p { margin: 5px 0 0; font-size: 12.5px; }
.code-value { font-size: 28px; font-weight:700; letter-spacing: .14em; color: var(--ball-2); }
.code-value.quiet { color: var(--muted); font-size: 20px; letter-spacing: .04em; }
.code-actions { display:flex; gap: 6px; align-items:center; margin-top:auto; flex-wrap:wrap; }
.app td.yes { color: var(--good); }
.app td.no { color: rgba(147,167,204,0.45); }

@media print {
  .topbar, .rail, .databar, .toast { display: none !important; }
  .app, .app::before { background: #fff !important; color: #111 !important; }
  .app * { color: #111 !important; }
  .card { border: 1px solid #ccc !important; background: #fff !important; page-break-inside: avoid; }
  .main { padding: 0 !important; }
}

/* modal + toast */
.modal-wrap { position:fixed; inset:0; background: rgba(3,8,20,0.7); display:flex;
  align-items:center; justify-content:center; padding: 20px; z-index: 60; }
.modal { background: var(--panel); border:1px solid var(--line-strong); border-radius: 14px;
  padding: 20px; width: 100%; max-width: 520px; }
.modal h3 { font-size: 16px; margin-bottom: 6px; }
.modal p { margin: 0 0 12px; }
.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top: 12px; }
.toast { position:fixed; left:50%; transform: translateX(-50%); bottom: 24px; z-index: 80;
  background: var(--chalk); color: var(--ink); padding: 11px 18px; border-radius: 999px;
  font-size: 13.5px; font-weight:500; box-shadow: 0 8px 26px rgba(0,0,0,.35); max-width: 90vw; text-align:center; }

/* responsive */
@media (max-width: 900px) {
  .grid-form, .grid-form.four { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .bar-row { grid-template-columns: 120px 1fr 44px; }
}
@media (max-width: 720px) {
  .topbar { padding: 12px 16px; }
  .brand h1 { font-size: 17px; }
  .shell { flex-direction: column; }
  .rail {
    width: 100%; height: auto; position: sticky; top: 61px; display:flex; gap: 4px;
    overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line);
    padding: 8px 12px; background: var(--ink); z-index: 20;
  }
  .rail-item { width: auto; flex: none; padding: 8px 12px; }
  .rail-num { display:none; }
  .main { padding: 16px; }
  .grid-form, .grid-form.four { grid-template-columns: 1fr; }
  .card { padding: 16px; }
  .table-scroll { margin: 0 -16px -16px; padding: 0 16px 4px; }
  .side-sets { font-size: 36px; }
  .side-player { font-size: 16px; }
  .cal-cell { font-size: 12px; }
  .databar { flex-direction: column; align-items: flex-start; }
  .bar-row { grid-template-columns: 104px 1fr 40px; }
  .toast { bottom: 16px; }
  .topbar { flex-wrap: wrap; }
  .topbar-right { width: 100%; justify-content: flex-end; }
  .dash-hero { padding: 18px; }
  .dash-hero h2 { font-size: 21px; }
  .day-pick { max-width: none; width: 100%; }
  .roll-num { font-size: 26px; }
  .op-teams { margin-left: 0; width: 100%; }
  .code-value { font-size: 24px; }
  .gate-brand h1 { font-size: 24px; }
  .set-readout { font-size: 15px; }
  .rally-score { font-size: 46px; }
  .standout h3 { font-size: 17px; }
  .overlap { grid-template-columns: 1fr; gap: 16px; }
  .app tr.drawer td { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .app *, .app *::before { animation: none !important; transition: none !important; }
}
