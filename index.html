<script>
/* ==================================================================
   WHERE THE TOURNAMENT LIVES

   Leave url and anonKey blank and the whole thing stays on this one
   phone, exactly as before. Fill them in and every device reads and
   writes the same Supabase row, so the moment a referee taps a point
   it lands on every screen watching.

   Set it up once in Supabase (SQL editor):

     create table tt_state (
       id text primary key,
       doc jsonb not null,
       updated_at timestamptz not null default now()
     );
     alter table tt_state enable row level security;
     create policy "anyone can read" on tt_state for select using (true);

   IMPORTANT FOR PUBLIC DEPLOYMENT:
   Do not enable anonymous public write/edit policies. Public viewers should
   be read-only. Admin/referee writes should be protected with Supabase Auth
   or a secure server/edge-function policy.

   Then paste the project URL and the public anon key below.
   ================================================================== */
window.TT_CLOUD = {
  url: "",              // e.g. "https://abcdefgh.supabase.co"
  anonKey: "",          // the public anon key from Project settings > API
  table: "tt_state",
  row: "tt-pulse"       // change per season if you want last year kept apart
};

(function () {
  var C = window.TT_CLOUD;
  var online = function () { return !!(C.url && C.anonKey); };
  var base = function () { return String(C.url).replace(/\/+$/, "") + "/rest/v1/" + C.table; };
  var head = function (extra) {
    var h = { apikey: C.anonKey, Authorization: "Bearer " + C.anonKey, "Content-Type": "application/json" };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  };

  var local = {
    get: function (k) { var v = localStorage.getItem(k); return v === null ? null : v; },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* A referee tapping +1 five times a second should not be five round
     trips. Writes go to this device at once and to the cloud in one
     batched push a moment later. */
  var pending = null, timer = null, inflight = false, settled = 0;

  function push() {
    timer = null;
    if (!online() || pending == null) return;
    var body = pending; pending = null; inflight = true;
    fetch(base(), {
      method: "POST",
      headers: head({ Prefer: "resolution=merge-duplicates,return=representation" }),
      body: JSON.stringify([{ id: C.row, doc: JSON.parse(body), updated_at: new Date().toISOString() }])
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (rows) {
        if (rows && rows[0]) window.storage.mark = rows[0].updated_at;
        window.storage.lastError = "";
      })
      .catch(function (e) { window.storage.lastError = String(e && e.message || e); })
      .then(function () { inflight = false; settled = Date.now(); if (pending != null) push(); });
  }

  window.storage = {
    online: online,
    mark: "",
    lastError: "",
    /* True while our own change is still on its way up. The poller sits
       out these moments so a half-sent update never bounces back. */
    busy: function () { return !!timer || inflight || Date.now() - settled < 900; },

    get: function (k) {
      if (!online()) {
        var v = local.get(k);
        return v === null ? Promise.reject(new Error("Key not found: " + k)) : Promise.resolve({ key: k, value: v });
      }
      return fetch(base() + "?id=eq." + encodeURIComponent(C.row) + "&select=doc,updated_at", { headers: head() })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)); })
        .then(function (rows) {
          if (!rows || !rows.length) {
            var cached = local.get(k);
            if (cached === null) return Promise.reject(new Error("Key not found: " + k));
            return { key: k, value: cached };
          }
          window.storage.mark = rows[0].updated_at;
          var json = JSON.stringify(rows[0].doc);
          local.set(k, json);
          return { key: k, value: json, stamp: rows[0].updated_at };
        })
        .catch(function (e) {
          window.storage.lastError = String(e && e.message || e);
          var cached = local.get(k);
          if (cached === null) throw e;
          return { key: k, value: cached, offline: true };
        });
    },

    /* Cheap heartbeat. Asks only when the row last changed, not for the
       whole tournament, so two hundred phones polling stays light. */
    stamp: function (k) {
      if (!online()) return Promise.resolve(local.get(k));
      return fetch(base() + "?id=eq." + encodeURIComponent(C.row) + "&select=updated_at", { headers: head() })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (rows) { return rows && rows[0] ? rows[0].updated_at : null; })
        .catch(function () { return null; });
    },

    set: function (k, v) {
      local.set(k, v);
      if (online()) {
        pending = v;
        if (!timer && !inflight) timer = setTimeout(push, 450);
      }
      return Promise.resolve({ key: k, value: v });
    },

    delete: function (k) { localStorage.removeItem(k); return Promise.resolve({ key: k, deleted: true }); },
    list: function (p) {
      var pre = p || "", keys = [];
      for (var i = 0; i < localStorage.length; i++) { var kk = localStorage.key(i); if (kk.indexOf(pre) === 0) keys.push(kk); }
      return Promise.resolve({ keys: keys, prefix: pre });
    }
  };
})();
window.addEventListener("error", function (e) { var f = document.getElementById("fallback"); if (f) f.textContent = "Error: " + (e.message || e); });
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ============================================================
   TT Pulse — table tennis tournament manager
   Single-file app. Works as a website and, wrapped with
   Capacitor, as an Android / iOS app.
   ============================================================ */

const STORE_KEY = "tt_society_v1";

const SKILLS = [
  { key: "serve", label: "Serve", w: 0.25 },
  { key: "forehand", label: "Forehand", w: 0.20 },
  { key: "backhand", label: "Backhand", w: 0.20 },
  { key: "rallySmash", label: "Rally / Smash", w: 0.20 },
  { key: "temperament", label: "Temperament", w: 0.15 },
];

const CATEGORIES = [
  { key: "Male", label: "Adult Male" },
  { key: "Female", label: "Adult Female" },
  { key: "Boy", label: "Kids Male" },
  { key: "Girl", label: "Kids Female" },
];

/* The two junior categories. Kept together for the checks that used to
   ask "is this a kid?" */
const KID_CATEGORIES = ["Boy", "Girl"];
const isKid = (g) => KID_CATEGORIES.includes(g);
const ageGroupOf = (p) => (p && isKid(p.gender) ? "kids" : "adult");
const ageGroupMatch = (p, filter) => filter === "all" || ageGroupOf(p) === filter;

const SLOTS = [
  "6:00 – 8:00 AM",
  "8:00 – 10:00 AM",
  "10:00 AM – 12:00 PM",
  "4:00 – 6:00 PM",
  "6:00 – 8:00 PM",
  "8:00 – 10:00 PM",
];

const CAL_MIN_YEAR = new Date().getFullYear() - 1;
const CAL_MAX_YEAR = 2030;

/* Four ways into the app. Each one sees a different set of pages. */
const ROLES = [
  {
    key: "public",
    label: "Public",
    blurb: "Anyone in the society. Mobile live dashboard, today's matches, upcoming match and standings.",
    needsCode: false,
  },
  {
    key: "referee",
    label: "Referee",
    blurb: "Umpires at the table. Everything public, plus adding points to a live match.",
    needsCode: true,
  },
  {
    key: "admin",
    label: "Admin",
    blurb: "Runs the tournament. Players, calibration, tiers, teams, fixtures, standings.",
    needsCode: true,
  },
  {
    key: "super",
    label: "Super admin",
    blurb: "Owns the tournament. Everything, plus access codes and clearing all data.",
    needsCode: true,
  },
];

const ROLE_RANK = { public: 0, referee: 1, admin: 3, super: 4 };

const TABS = [
  { key: "dashboard", label: "Dashboard", min: "public" },
  { key: "report", label: "Report", min: "admin" },
  { key: "scoring", label: "Live scoring", min: "referee" },
  { key: "registrations", label: "Registrations", min: "admin" },
  { key: "players", label: "Players", min: "admin" },
  { key: "availability", label: "Availability", min: "admin" },
  { key: "calibration", label: "Calibration", min: "admin" },
  { key: "tiers", label: "Tiers", min: "admin" },
  { key: "teams", label: "Teams", min: "admin" },
  { key: "fixtures", label: "Fixtures", min: "admin" },
  { key: "standings", label: "Standings", min: "admin" },
  { key: "performance", label: "Performance", min: "admin" },
  { key: "access", label: "Settings & Access", min: "super" },
];

const tabsFor = (role) => TABS.filter((t) => ROLE_RANK[role] >= ROLE_RANK[t.min]);
const can = (role, min) => ROLE_RANK[role] >= ROLE_RANK[min];

/* Categories that take part in team play. Kids run as their own
   side event and are never drafted into a team. */
const TEAM_CATEGORIES = ["Male", "Female"];
const inTeamPlay = (p) => TEAM_CATEGORIES.includes(p.gender);

/* Fri / Sat / Sun — where the top tiers should land if we can help it. */
const WEEKEND_DAYS = [5, 6, 0];
const PRIORITY_TIERS = 2;

/* A tier day is good enough to lock in once this share of the tier can
   make the same slot. Whoever is left gets a second sitting or a nudge. */
const DEFAULT_COVERAGE = 0.6;

const EMPTY = {
  tournamentName: "TT Pulse",
  availabilityStart: "2026-09-19",
  availabilityEnd: "2026-09-30",
  players: [],
  registrations: [], // public registration submissions awaiting admin review
  availability: {}, // "playerId|YYYY-MM-DD" -> [slot, ...]
  teams: [],
  matches: [],
  fixtures: [], // planned matches, before anyone picks up a bat
  tierPlan: {}, // "Male|1" -> { date, slot }
  tierCounts: { Male: 4, Female: 3, Boy: 3, Girl: 3 },
  tierByTeams: true, // a tier holds one player per team
  bonuses: {}, // teamId -> manually entered points
  refDuty: {}, // "YYYY-MM-DD" -> [{ id, name }] whoever keeps score that day
  codes: null, // set on first run
};

/* ---------- small utilities ---------- */

const uid = () => Math.random().toString(36).slice(2, 10);

const blankCal = () =>
  SKILLS.reduce((acc, s) => ({ ...acc, [s.key]: 0 }), {});

function calScore(p) {
  const c = p.cal || {};
  return SKILLS.reduce((sum, s) => sum + (Number(c[s.key]) || 0) * s.w, 0);
}

function isCalibrated(p) {
  const c = p.cal || {};
  return SKILLS.some((s) => Number(c[s.key]) > 0);
}

const fullName = (p) => `${p.first} ${p.last}`.trim();

function catLabel(key) {
  const c = CATEGORIES.find((x) => x.key === key);
  return c ? c.label : key;
}

function ymd(d) {
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}

function prettyDate(s) {
  const [y, m, d] = s.split("-");
  const dt = new Date(Number(y), Number(m) - 1, Number(d));
  return dt.toLocaleDateString(undefined, {
    weekday: "short",
    day: "numeric",
    month: "short",
    year: "numeric",
  });
}

/* ---------- access codes ---------- */

/* Readable codes — no O/0 or I/1 confusion when they get read out loud. */
const CODE_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function genCode(len = 6) {
  let out = "";
  const buf = new Uint32Array(len);
  if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(buf);
  for (let i = 0; i < len; i++) {
    const n = buf[i] || Math.floor(Math.random() * 4294967296);
    out += CODE_ALPHABET[n % CODE_ALPHABET.length];
  }
  return out;
}

function freshCodes() {
  return { referee: "REF123", admin: "ADM123", super: "SUP123" };
}

/* ---------- dates ---------- */

function dowOf(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d).getDay();
}

const isWeekend = (dateStr) => WEEKEND_DAYS.includes(dowOf(dateStr));

function shortDate(s) {
  if (!s) return "—";
  const [y, m, d] = s.split("-");
  const dt = new Date(Number(y), Number(m) - 1, Number(d));
  return dt.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
}

const isMorning = (slot) => /AM/.test(slot || "");

/* ---------- tiers ---------- */
/* Players in each category are ranked by calibration score and
   split into as-equal-as-possible tiers. Tier 1 is strongest. */
function computeTiers(players, tierCounts, tierSize) {
  const map = {}; // playerId -> { tier, rank, total }
  CATEGORIES.forEach((cat) => {
    const group = players
      .filter((p) => p.gender === cat.key)
      .slice()
      .sort((a, b) => {
        const d = calScore(b) - calScore(a);
        if (d !== 0) return d;
        return fullName(a).localeCompare(fullName(b));
      });
    const n = group.length;
    if (!n) return;

    // For the team categories, a tier holds exactly one player per team, so
    // the strongest N go in tier 1, the next N in tier 2, and so on. Juniors
    // are not drafted, so they keep the tier count set on the Tiers tab.
    const byTeams = tierSize > 0 && TEAM_CATEGORIES.includes(cat.key);
    if (byTeams) {
      let idx = 0;
      let tier = 1;
      while (idx < n) {
        for (let k = 0; k < tierSize && idx < n; k++) {
          map[group[idx].id] = { tier, rank: idx + 1, total: n, category: cat.key };
          idx++;
        }
        tier++;
      }
      return;
    }

    const t = Math.max(1, Number(tierCounts[cat.key]) || 1);
    const tiers = Math.min(t, Math.max(1, n));
    const base = Math.floor(n / tiers);
    const rem = n % tiers;
    let idx = 0;
    for (let tier = 1; tier <= tiers; tier++) {
      const size = base + (tier <= rem ? 1 : 0);
      for (let k = 0; k < size; k++) {
        const p = group[idx];
        if (!p) break;
        map[p.id] = { tier, rank: idx + 1, total: n, category: cat.key };
        idx++;
      }
    }
  });
  return map;
}

const POINTS_TO_WIN_SET = 11;

const num = (v) => (v === "" || v == null ? 0 : Number(v) || 0);

/* A set is over the moment either player reaches 11. */
function setDone(s) {
  return num(s.a) >= POINTS_TO_WIN_SET || num(s.b) >= POINTS_TO_WIN_SET;
}

/* Index of the set being played, or -1 when all three are done.
   All three sets are always played, even after a 2-0, because the
   third set still carries 5 points for whoever takes it. */
function activeSetIndex(m) {
  const i = (m.sets || []).findIndex((s) => !setDone(s));
  return i;
}

/* ---------- match maths ---------- */
/* Each set won = 5 points to that player's team.
   Winning the match (2 of 3 sets) = 25 extra points.
   All three sets are played out, so a 2-1 loser still banks 5. */
function matchResult(m) {
  let aSets = 0;
  let bSets = 0;
  let played = 0;
  (m.sets || []).forEach((s) => {
    const a = s.a === "" || s.a == null ? null : Number(s.a);
    const b = s.b === "" || s.b == null ? null : Number(s.b);
    if (a == null || b == null || a === b) return;
    if (a >= POINTS_TO_WIN_SET || b >= POINTS_TO_WIN_SET) {
      played++;
      if (a > b) aSets++;
      else bSets++;
    }
  });
  // Who has taken the match, once two sets are in the bag.
  const decided = aSets >= 2 || bSets >= 2;
  // Whether there is any set left to play. Only then is the match over.
  const complete = played >= (m.sets || []).length;
  const aPts = aSets * 5 + (decided && aSets > bSets ? 25 : 0);
  const bPts = bSets * 5 + (decided && bSets > aSets ? 25 : 0);
  return {
    aSets,
    bSets,
    setsPlayed: played,
    aPts,
    bPts,
    decided,
    complete,
    winner: !decided ? null : aSets > bSets ? "a" : "b",
  };
}

/* ============================================================
   Fixture engine

   Two rules drive everything here:
     · A player meets the same tier on every other team, and then
       every other tier on every other team.
     · A tier plays on one date across all teams. Only the time of
       day moves, so a long tier can be split morning / evening.
   Men's and women's tiers 1 and 2 get first pick of the weekend.
   ============================================================ */

const groupKey = (cat, tier) => cat + "|" + tier;

/* Ordered so the tiers that matter most choose their date first:
   men T1, women T1, men T2, women T2, then everything below. */
function tierGroupList(data, tiers) {
  const onTeam = new Set();
  data.teams.forEach((t) => t.playerIds.forEach((id) => onTeam.add(id)));

  const groups = [];
  CATEGORIES.forEach((c) => {
    const cat = c.key;
    const junior = isKid(cat);
    const maxTier = Math.max(1, Number(data.tierCounts[cat]) || 1);
    for (let tier = 1; tier <= maxTier; tier++) {
      const members = data.players.filter(
        (p) =>
          p.gender === cat &&
          (junior || onTeam.has(p.id)) &&
          isCalibrated(p) &&
          tiers[p.id] &&
          tiers[p.id].tier === tier
      );
      if (!members.length) continue;
      groups.push({
        key: groupKey(cat, tier),
        category: cat,
        tier,
        members,
        junior,
        priority: !junior && tier <= PRIORITY_TIERS,
      });
    }
  });

  groups.sort((a, b) => {
    if (a.priority !== b.priority) return a.priority ? -1 : 1;
    if (a.tier !== b.tier) return a.tier - b.tier;
    return (
      CATEGORIES.findIndex((x) => x.key === a.category) -
      CATEGORIES.findIndex((x) => x.key === b.category)
    );
  });
  return groups;
}

/* Every date anyone has ticked, earliest first. Falls back to the
   coming fortnight so a plan can still be sketched before people reply. */
function candidateDates(data) {
  const seen = new Set();
  Object.keys(data.availability || {}).forEach((k) => {
    const arr = data.availability[k];
    if (arr && arr.length) seen.add(k.split("|")[1]);
  });
  if (!seen.size) {
    const start = new Date();
    for (let i = 1; i <= 14; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      seen.add(ymd(d));
    }
  }
  return Array.from(seen).sort();
}

const slotsFree = (data, pid, date) => data.availability[pid + "|" + date] || [];

/* Give every tier a date, then a time of day on that date. */
function planTiers(data, tiers, opts = {}) {
  const perDay = Math.max(1, Number(opts.groupsPerDay) || 2);
  const threshold = opts.threshold == null ? DEFAULT_COVERAGE : Number(opts.threshold);
  const groups = tierGroupList(data, tiers);
  const dates = candidateDates(data);
  const usage = {}; // date -> [group keys already placed]
  const plan = {};

  groups.forEach((g) => {
    let best = null;

    dates.forEach((date, dIdx) => {
      const already = usage[date] || [];
      if (already.length >= perDay) return;

      const look = dateFit(data, g, date);
      // The date that gets the most of the tier on one slot wins, with the
      // rest of the day's turnout as the tie-break.
      let score = look.primaryCount * 14 + look.free.length * 6;
      if (isWeekend(date)) score += g.priority ? 30 : 4;
      else if (g.priority) score -= 12;
      score -= already.length * 8;
      score -= dIdx * 0.2;

      if (!best || score > best.score) best = { date, score, look, already };
    });

    if (!best) {
      plan[g.key] = {
        date: "",
        slot: "",
        secondSlot: "",
        total: g.members.length,
        available: 0,
        primary: [],
        second: [],
        unplaced: g.members.map((p) => p.id),
        coverage: 0,
        meetsThreshold: false,
      };
      return;
    }

    const { look } = best;
    const coverage = g.members.length ? look.primaryCount / g.members.length : 0;

    usage[best.date] = [...(usage[best.date] || []), g.key];
    plan[g.key] = {
      date: best.date,
      slot: look.primarySlot,
      secondSlot: look.secondSlot,
      total: g.members.length,
      available: look.free.length,
      primary: look.primary,
      second: look.second,
      unplaced: look.unplaced,
      coverage,
      meetsThreshold: coverage >= threshold,
      weekend: isWeekend(best.date),
    };
  });

  return plan;
}

/* How well one date suits one tier: the busiest slot, the best second slot
   for whoever that slot misses, and everyone left over. */
function dateFit(data, group, date) {
  const free = group.members.filter((p) => slotsFree(data, p.id, date).length > 0);

  const tally = {};
  free.forEach((p) =>
    slotsFree(data, p.id, date).forEach((s) => {
      tally[s] = (tally[s] || 0) + 1;
    })
  );
  const ranked = SLOTS.filter((s) => tally[s]).sort(
    (a, b) => tally[b] - tally[a] || SLOTS.indexOf(a) - SLOTS.indexOf(b)
  );
  const primarySlot = ranked[0] || "";

  const primary = free.filter((p) => slotsFree(data, p.id, date).includes(primarySlot));
  const primaryIds = new Set(primary.map((p) => p.id));
  const leftover = free.filter((p) => !primaryIds.has(p.id));

  // Whichever remaining slot mops up the most of the leftover, ideally the
  // other end of the day so the two sittings do not collide.
  const second = {};
  leftover.forEach((p) =>
    slotsFree(data, p.id, date).forEach((s) => {
      second[s] = (second[s] || 0) + 1;
    })
  );
  const secondRanked = SLOTS.filter((s) => s !== primarySlot && second[s]).sort((a, b) => {
    const flip = (s) => (isMorning(s) !== isMorning(primarySlot) ? 1 : 0);
    return second[b] - second[a] || flip(b) - flip(a) || SLOTS.indexOf(a) - SLOTS.indexOf(b);
  });
  const secondSlot = secondRanked[0] || "";
  const secondPlayers = secondSlot
    ? leftover.filter((p) => slotsFree(data, p.id, date).includes(secondSlot))
    : [];
  const secondIds = new Set(secondPlayers.map((p) => p.id));

  return {
    free,
    primarySlot,
    primaryCount: primary.length,
    primary: primary.map((p) => p.id),
    secondSlot,
    second: secondPlayers.map((p) => p.id),
    unplaced: group.members
      .filter((p) => !primaryIds.has(p.id) && !secondIds.has(p.id))
      .map((p) => p.id),
  };
}

/* The three or four dates that suit a tier best, for the overlap table. */
function dateOptions(data, group, limit = 5) {
  return candidateDates(data)
    .map((date) => ({ date, ...dateFit(data, group, date), weekend: isWeekend(date) }))
    .filter((o) => o.free.length > 0)
    .sort(
      (a, b) =>
        b.primaryCount - a.primaryCount ||
        b.free.length - a.free.length ||
        Number(b.weekend) - Number(a.weekend) ||
        a.date.localeCompare(b.date)
    )
    .slice(0, limit);
}

/* Turn tiers, teams and the plan into an actual list of fixtures. */
function buildFixtures(data, tiers, plan, opts = {}) {
  const crossTier = opts.crossTier !== false;
  const teamOf = {};
  data.teams.forEach((t) => t.playerIds.forEach((id) => (teamOf[id] = t.id)));

  const out = [];
  TEAM_CATEGORIES.forEach((cat) => {
    const pool = data.players.filter(
      (p) => p.gender === cat && teamOf[p.id] && tiers[p.id] && isCalibrated(p)
    );
    for (let i = 0; i < pool.length; i++) {
      for (let j = i + 1; j < pool.length; j++) {
        const a = pool[i];
        const b = pool[j];
        if (teamOf[a.id] === teamOf[b.id]) continue;
        const tA = tiers[a.id].tier;
        const tB = tiers[b.id].tier;
        const same = tA === tB;
        if (!same && !crossTier) continue;

        // A same-tier meeting sits on that tier's day. A cross-tier
        // meeting waits for the later of the two tiers' days.
        const hostTier = same ? tA : Math.max(tA, tB);
        const day = plan[groupKey(cat, hostTier)] || {};

        // Both players need the same sitting. If they land in different
        // ones, or either could not make the day at all, the fixture goes
        // out unslotted so it shows up in the list that needs a time.
        const sitOf = (id) => {
          if ((day.primary || []).includes(id)) return day.slot || "";
          if ((day.second || []).includes(id)) return day.secondSlot || "";
          return null;
        };
        const sA = sitOf(a.id);
        const sB = sitOf(b.id);
        const shared = sA && sB && sA === sB ? sA : "";

        out.push({
          id: uid(),
          category: cat,
          tierA: tA,
          tierB: tB,
          sameTier: same,
          hostTier,
          teamA: teamOf[a.id],
          teamB: teamOf[b.id],
          playerA: a.id,
          playerB: b.id,
          date: day.date || "",
          slot: shared,
          needsSlot: !shared,
          matchId: null,
        });
      }
    }
  });

  /* Juniors run their own bracket. No teams, so every calibrated player in
     a tier meets every other one in that same tier. Results are individual
     and never touch the team table. */
  KID_CATEGORIES.forEach((cat) => {
    const pool = data.players.filter((p) => p.gender === cat && tiers[p.id] && isCalibrated(p));
    for (let i = 0; i < pool.length; i++) {
      for (let j = i + 1; j < pool.length; j++) {
        const a = pool[i];
        const b = pool[j];
        const tA = tiers[a.id].tier;
        const tB = tiers[b.id].tier;
        if (tA !== tB) continue; // juniors play inside their own tier only

        const day = plan[groupKey(cat, tA)] || {};
        const sitOf = (id) => {
          if ((day.primary || []).includes(id)) return day.slot || "";
          if ((day.second || []).includes(id)) return day.secondSlot || "";
          return null;
        };
        const sA = sitOf(a.id);
        const sB = sitOf(b.id);
        const shared = sA && sB && sA === sB ? sA : "";

        out.push({
          id: uid(),
          category: cat,
          tierA: tA,
          tierB: tB,
          sameTier: true,
          hostTier: tA,
          teamA: null,
          teamB: null,
          individual: true,
          playerA: a.id,
          playerB: b.id,
          date: day.date || "",
          slot: shared,
          needsSlot: !shared,
          matchId: null,
        });
      }
    }
  });

  const catOrder = (c) => {
    const i = CATEGORIES.findIndex((x) => x.key === c);
    return i === -1 ? 99 : i;
  };
  out.sort(
    (x, y) =>
      String(x.date).localeCompare(String(y.date)) ||
      SLOTS.indexOf(x.slot) - SLOTS.indexOf(y.slot) ||
      x.hostTier - y.hostTier ||
      catOrder(x.category) - catOrder(y.category) ||
      Number(y.sameTier) - Number(x.sameTier)
  );
  return out;
}

/* ---------- delimited text ---------- */

function toDelimited(rows, sep) {
  return rows
    .map((r) =>
      r
        .map((cell) => {
          const v = cell == null ? "" : String(cell);
          if (sep === "\t") return v.replace(/\t/g, " ").replace(/\n/g, " ");
          return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
        })
        .join(sep)
    )
    .join("\n");
}

function parseDelimited(text) {
  let clean = String(text)
    .replace(/^\uFEFF/, "") // Excel writes a byte-order mark; it corrupts the first header
    .replace(/\r\n/g, "\n")
    .replace(/\r/g, "\n")
    .trim();
  if (!clean) return [];

  // Pick the delimiter the header row actually uses.
  const firstLine = clean.split("\n").find((l) => l.trim() !== "") || "";
  const counts = [
    { sep: "\t", n: (firstLine.match(/\t/g) || []).length },
    { sep: ",", n: (firstLine.match(/,/g) || []).length },
    { sep: ";", n: (firstLine.match(/;/g) || []).length },
    { sep: "|", n: (firstLine.match(/\|/g) || []).length },
  ].sort((a, b) => b.n - a.n);
  const sep = counts[0].n > 0 ? counts[0].sep : ",";
  const rows = [];
  let row = [];
  let cell = "";
  let quoted = false;
  for (let i = 0; i < clean.length; i++) {
    const ch = clean[i];
    if (quoted) {
      if (ch === '"') {
        if (clean[i + 1] === '"') {
          cell += '"';
          i++;
        } else quoted = false;
      } else cell += ch;
    } else if (ch === '"') {
      quoted = true;
    } else if (ch === sep) {
      row.push(cell);
      cell = "";
    } else if (ch === "\n") {
      row.push(cell);
      rows.push(row);
      row = [];
      cell = "";
    } else cell += ch;
  }
  row.push(cell);
  rows.push(row);
  return rows.filter((r) => r.some((c) => String(c).trim() !== ""));
}

/* "First Name", "first_name", " FIRSTNAME " all collapse to "firstname" */
function normKey(s) {
  return String(s || "")
    .replace(/^\uFEFF/, "")
    .toLowerCase()
    .replace(/[\s_\-.()]/g, "")
    .trim();
}

const KNOWN_HEADERS = [
  "firstname", "first", "lastname", "last", "name", "fullname", "playername", "player",
  "gender", "sex", "category", "phone", "phonenumber", "mobile", "contact", "number",
  "date", "slot", "team", "teamname", "serve", "forehand", "backhand", "rallysmash", "rally/smash", "temperament", "spin", "footwork", "smash",
];

function rowsToObjects(rows) {
  if (!rows.length) return { records: [], headers: [] };

  // Sheets often carry a title or blank rows above the real header.
  let headIdx = rows.findIndex((r) => r.filter((c) => normKey(c)).some((c) => KNOWN_HEADERS.includes(normKey(c))));
  if (headIdx === -1) headIdx = 0;

  const rawHead = rows[headIdx];
  const head = rawHead.map(normKey);

  /* Some society Excel exports have a blank header above the Availability
     answers. Detect that column from its contents so it is not discarded. */
  if (!head.includes("availability")) {
    for (let i = 0; i < rawHead.length; i++) {
      if (head[i]) continue;
      const vals = rows
        .slice(headIdx + 1)
        .map((r) => String(r[i] == null ? "" : r[i]).trim())
        .filter(Boolean);
      if (!vals.length) continue;
      const hits = vals.filter((v) =>
        /available\s+(on\s+)?all\s+dates|all\s+dates\s+available|not\s+available\s+on/i.test(v)
      ).length;
      if (hits >= Math.max(2, Math.ceil(vals.length * 0.2))) {
        head[i] = "availability";
        break;
      }
    }
  }

  const records = rows.slice(headIdx + 1).map((r) => {
    const o = {};
    head.forEach((h, i) => {
      if (h) o[h] = String(r[i] == null ? "" : r[i]).trim();
    });
    return o;
  });
  return { records, headers: rawHead.map((h) => String(h).trim()).filter(Boolean) };
}

/* Read a field by any of its accepted names. */
function pick(o, names) {
  for (const n of names) {
    const k = normKey(n);
    if (o[k] !== undefined && o[k] !== "") return o[k];
  }
  return "";
}

const F_FIRST = ["first name", "firstname", "first", "given name"];
const F_LAST = ["last name", "lastname", "last", "surname", "family name"];
const F_WHOLE = ["name", "full name", "fullname", "player", "player name", "participant"];
const F_PHONE = [
  "phone", "phone number", "phoneno", "phone no", "phonenumber",
  "mobile", "mobile number", "mobileno", "mobile no", "mob", "mob no", "mobno",
  "contact", "contact number", "contactno", "contact no",
  "cell", "cell number", "cellphone", "cell phone",
  "whatsapp", "whatsapp number", "whatsappno", "wa number",
  "whatsapp mobile number", "whatsapp mobile", "whatsapp mobile no",
  "mobile whatsapp number", "whatsapp contact", "whatsapp no",
  "number", "tel", "telephone", "msisdn",
];

/* Excel likes turning a long number into 9.87654321e+9 or 9876543210.0.
   Put it back together, and keep a leading + if the sheet had one. */
function cleanPhone(v) {
  let s = String(v == null ? "" : v).trim();
  if (!s) return "";
  if (/e\+?\d+$/i.test(s)) {
    const n = Number(s);
    if (!isNaN(n)) s = n.toFixed(0);
  }
  s = s.replace(/\.0+$/, "");
  const plus = /^\s*\+/.test(s);
  const digits = s.replace(/[^0-9]/g, "");
  if (digits.length < 7 || digits.length > 15) return "";
  return (plus ? "+" : "") + digits;
}

/* Read the phone by header name; if no header matched, look for a value
   that is simply shaped like a phone number. */
function readPhone(o) {
  const byHeader = cleanPhone(pick(o, F_PHONE));
  if (byHeader) return byHeader;
  for (const k of Object.keys(o)) {
    if (/name|gender|sex|category|group|age|date|slot|email|serve|forehand|backhand|spin|footwork|smash/.test(k)) {
      continue;
    }
    const c = cleanPhone(o[k]);
    if (c) return c;
  }
  return "";
}
const F_GENDER = ["gender", "gendre", "gendr", "sex"];
const F_AGEGROUP = ["category", "group", "age group", "agegroup", "type", "division"];
const F_FLAT = [
  "flat", "flat no", "flat number", "flatno", "flatnumber",
  "apartment", "apartment no", "apartment number", "unit", "unit no", "unit number"
];
const readFlat = (o) => String(pick(o, F_FLAT) || "").trim();

function normPersonName(first, last) {
  return `${first || ""}${last || ""}`.toLowerCase().replace(/[^a-z0-9]/g, "");
}
function editDistance(a, b) {
  a = String(a || ""); b = String(b || "");
  const dp = Array.from({length:b.length+1}, (_,j)=>j);
  for (let i=1;i<=a.length;i++) {
    let prev = dp[0]; dp[0] = i;
    for (let j=1;j<=b.length;j++) {
      const cur = dp[j];
      dp[j] = Math.min(dp[j]+1, dp[j-1]+1, prev + (a[i-1] === b[j-1] ? 0 : 1));
      prev = cur;
    }
  }
  return dp[b.length];
}
function looksLikeSamePerson(a, b) {
  if (!a || !b) return false;
  const an = normPersonName(a.first, a.last);
  const bn = normPersonName(b.first, b.last);
  if (!an || !bn || an === bn) return false; // exact names are handled separately
  const samePhone = a.phone && b.phone && cleanPhone(a.phone) === cleanPhone(b.phone);
  const sameFlat = a.flat && b.flat && normKey(a.flat) === normKey(b.flat);
  const closeName = editDistance(an, bn) <= 2;
  const sameFirst = normKey(a.first) && normKey(a.first) === normKey(b.first);
  const sameLast = normKey(a.last) && normKey(a.last) === normKey(b.last);
  return (closeName && (samePhone || sameFlat)) || (samePhone && sameFirst && sameLast);
}

function inferImportYear(objs, fallbackYear) {
  const counts = {};
  (objs || []).forEach((o) => {
    Object.values(o || {}).forEach((v) => {
      const str = String(v || "");
      const hits = str.match(/\b(20\d{2})\b/g) || [];
      hits.forEach((yr) => {
        const n = Number(yr);
        if (n >= 2020 && n <= 2100) counts[n] = (counts[n] || 0) + 1;
      });
    });
  });
  const ranked = Object.entries(counts).sort((a,b) => b[1] - a[1]);
  return ranked.length ? Number(ranked[0][0]) : Number(fallbackYear || new Date().getFullYear());
}

/* Accepts either two name columns or one combined one. */
function readName(o) {
  let first = pick(o, F_FIRST);
  let last = pick(o, F_LAST);
  if (!first && !last) {
    const whole = pick(o, F_WHOLE);
    if (whole) {
      const parts = whole.replace(/\s+/g, " ").trim().split(" ");
      first = parts.shift() || "";
      last = parts.join(" ");
    }
  }
  return { first: first.trim(), last: last.trim() };
}

function download(filename, text) {
  const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (err) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }
}

/* Reads a sex from almost anything a society sheet contains.
   Order matters: "female" contains "male", so it is tested first.
   Returns "Female", "Male", or null when the cell says nothing useful. */
function normSex(v) {
  const s = String(v || "").trim().toLowerCase();
  if (!s) return null;
  if (/(female|woman|women|girl|lady|ladies|mrs|miss)/.test(s)) return "Female";
  if (/^(f|w|g|ms)$/.test(s)) return "Female";
  if (/(male|man|men|boy|gent|mr)/.test(s)) return "Male";
  if (/^(m|b)$/.test(s)) return "Male";
  return null;
}

/* True when the category cell or the age says this person is a junior.
   Returns true, false, or null when neither cell settles it. */
function normJunior(v, age) {
  const s = String(v || "").trim().toLowerCase();
  const n = Number(String(age || "").replace(/[^0-9.]/g, ""));
  if (!isNaN(n) && n > 0 && n < 16) return true;
  if (!isNaN(n) && n >= 16) return false;

  if (!s) return null;
  if (/(kid|child|children|junior|juvenile|minor|colt|sub|boy scout)/.test(s)) return true;
  if (/\b(boy|boys|girl|girls)\b/.test(s)) return true;
  if (/\bu-?\s?(1[0-5]|[0-9])\b/.test(s)) return true; // U12, U-14, U 9
  if (/^(k|j|c)$/.test(s)) return true;
  if (/(adult|senior|open|men|women|male|female|man|woman)/.test(s)) return false;
  if (/^(a|s|o)$/.test(s)) return false;
  return null;
}

/* Puts the two together into one of the four categories.
   nameGuess is used only when the sheet gives no sex at all. */
function resolveCategory(rawSex, rawCat, rawAge, nameGuess) {
  // Either column may hold the sex, and either may hold the age group.
  const sex = normSex(rawSex) || normSex(rawCat) || nameGuess || "Male";
  let junior = normJunior(rawCat, rawAge);
  if (junior === null) junior = normJunior(rawSex, rawAge);
  if (junior === null) junior = false;

  if (junior) return sex === "Female" ? "Girl" : "Boy";
  return sex;
}

const F_AGE = ["age", "years", "yrs", "age years"];

const MONTHS = {
  jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7,
  aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12,
};

/* A column header that names a date. Handles 2026-09-18 (which normKey
   flattens to 20260918) and "18 Sept 2026" / "18 Sept". Returns the date
   as YYYY-MM-DD plus anything left over, which may name a slot. */
function headerDate(key, fallbackYear) {
  const k = String(key || "").toLowerCase();
  let m = k.match(/^(\d{4})(\d{2})(\d{2})(.*)$/);
  if (m) {
    const mo = Number(m[2]);
    const dd = Number(m[3]);
    if (mo >= 1 && mo <= 12 && dd >= 1 && dd <= 31) {
      return { date: `${m[1]}-${m[2]}-${m[3]}`, rest: m[4] || "" };
    }
  }
  m = k.match(/^(\d{1,2})([a-z]{3,9})(\d{4})?(.*)$/);
  if (m) {
    const mo = MONTHS[m[2].slice(0, 4)] || MONTHS[m[2].slice(0, 3)];
    const dd = Number(m[1]);
    if (mo && dd >= 1 && dd <= 31) {
      const yr = m[3] || String(fallbackYear || new Date().getFullYear());
      return {
        date: `${yr}-${String(mo).padStart(2, "0")}-${String(dd).padStart(2, "0")}`,
        rest: m[4] || "",
      };
    }
  }
  return null;
}

const slotKey = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const SLOT_BY_KEY = {};
SLOTS.forEach((s) => (SLOT_BY_KEY[slotKey(s)] = s));

const YES = /^(y|yes|true|1|x|available|ok)$/i;

/* Pulls availability off a player row laid out one column per date.
   Two shapes work:
     "18 Sept 2026"  ->  "6:00 - 8:00 PM; 8:00 - 10:00 PM"   (ticked slots)
     "18 Sept 2026 6:00 - 8:00 PM"  ->  "Yes"                (one column per slot)
   Returns { "YYYY-MM-DD": [slot, ...] }. */
function readAvailability(o, fallbackYear, availabilityStart, availabilityEnd) {
  const out = {};
  Object.keys(o).forEach((k) => {
    const hit = headerDate(k, fallbackYear);
    if (!hit) return;
    const raw = String(o[k] == null ? "" : o[k]).trim();
    if (!raw) return;

    const push = (slot) => {
      if (!slot) return;
      if (!out[hit.date]) out[hit.date] = [];
      if (!out[hit.date].includes(slot)) out[hit.date].push(slot);
    };

    if (hit.rest) {
      if (YES.test(raw) || SLOT_BY_KEY[slotKey(raw)]) push(SLOT_BY_KEY[slotKey(hit.rest)]);
      return;
    }
    raw.split(/[;,|]/).forEach((part) => {
      const sl = SLOT_BY_KEY[slotKey(part)];
      if (sl) push(sl);
    });
  });

  /* One free-text Availability column from the society registration sheet.
     The tournament date window is controlled from Settings & Access. */
  const freeText = pick(o, [
    "availability", "availbility", "available",
    "availability between 19-30", "availability between 19 - 30",
    "availability 19-30"
  ]);

  if (freeText && availabilityStart && availabilityEnd) {
    const raw = String(freeText).trim();

    const parseYmdLocal = (x) => {
      const m = String(x || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null;
    };
    const a0 = parseYmdLocal(availabilityStart);
    const b0 = parseYmdLocal(availabilityEnd);
    const dates = [];

    if (a0 && b0 && a0 <= b0) {
      const d = new Date(a0);
      while (d <= b0) {
        dates.push(ymd(d));
        d.setDate(d.getDate() + 1);
      }
    }

    // Google Form availability windows start at 8 AM. Do not silently mark
    // the app-only 6–8 AM slot as available unless it is entered manually.
    const FORM_SLOTS = SLOTS.filter((sl) => sl !== "6:00 – 8:00 AM");

    // "Available on all dates" means every Google-Form-covered slot in the window.
    dates.forEach((date) => { out[date] = FORM_SLOTS.slice(); });

    /* The registration form records exceptions: if it says
       "Not available on ...", the player is available on the other configured
       dates/slots. Therefore keep the full date window and subtract exceptions. */

    // Apply every "Not available ..." exception to the configured dates.
    raw.split(/[;|\n]+/).forEach((part) => {
      if (!/not\s+available/i.test(part)) return;

      const dayHit = part.match(/\b([12]?\d|3[01])\b/);
      if (!dayHit) return;
      const day = Number(dayHit[1]);
      const lower = part.toLowerCase();
      const monthHit = Object.keys(MONTHS).find((m) => lower.includes(m));
      const monthNum = monthHit ? MONTHS[monthHit] : null;

      const date = dates.find((x) => {
        const [yy, mm, dd] = x.split("-").map(Number);
        return dd === day && (!monthNum || mm === monthNum);
      });
      if (!date) return;

      const timeNums = Array.from(part.matchAll(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/ig));
      if (!timeNums.length) {
        out[date] = []; // whole configured day unavailable
        return;
      }

      const to24 = (m) => {
        let h = Number(m[1]), min = Number(m[2] || 0);
        const ap = m[3].toLowerCase();
        if (ap === "pm" && h < 12) h += 12;
        if (ap === "am" && h === 12) h = 0;
        return h + min / 60;
      };

      let a = to24(timeNums[0]);
      let b = timeNums.length > 1 ? to24(timeNums[timeNums.length - 1]) : a + 2;
      if (b <= a) b += 12;

      const ranges = {
        "6:00 – 8:00 AM":[6,8],
        "8:00 – 10:00 AM":[8,10],
        "10:00 AM – 12:00 PM":[10,12],
        "4:00 – 6:00 PM":[16,18],
        "6:00 – 8:00 PM":[18,20],
        "8:00 – 10:00 PM":[20,22],
      };
      const base = out[date] || FORM_SLOTS.slice();
      out[date] = base.filter((sl) => {
        const r = ranges[sl];
        return !r || !(Math.max(a,r[0]) < Math.min(b,r[1]));
      });
    });
  }
  return out;
}

/* ---------- column detection by content ----------
   Used when headers are missing, unrecognisable, or the sheet just
   starts with data. Each column is scored on what its values look like. */

const GENDER_TOKENS = new Set(
  ("m f k b g male female kid kids kids' child children boy boys girl girls man men woman women " +
   "junior juniors lady ladies gents gent mr mrs ms miss adult").split(" ")
);

function colStats(rows, i) {
  const vals = rows.map((r) => String(r[i] == null ? "" : r[i]).trim()).filter((v) => v !== "");
  const n = vals.length || 1;
  const digits = (v) => v.replace(/[^0-9]/g, "");
  return {
    filled: vals.length / (rows.length || 1),
    phone: vals.filter((v) => digits(v).length >= 7 && digits(v).length <= 15 && !/[a-z]{3}/i.test(v)).length / n,
    gender: vals.filter((v) => GENDER_TOKENS.has(v.toLowerCase().replace(/[^a-z]/g, ""))).length / n,
    age: vals.filter((v) => /^\d{1,2}(\.0)?$/.test(v) && Number(v) >= 3 && Number(v) <= 99).length / n,
    name: vals.filter((v) => /^[a-zA-Z][a-zA-Z .'\u00C0-\u024F-]{1,40}$/.test(v)).length / n,
    spaced: vals.filter((v) => /\s/.test(v.trim())).length / n,
    distinct: new Set(vals.map((v) => v.toLowerCase())).size,
    sample: vals.slice(0, 3),
  };
}

function inferColumns(rows) {
  const width = rows.reduce((w, r) => Math.max(w, r.length), 0);
  const sample = rows.slice(0, 60);
  const stats = [];
  for (let i = 0; i < width; i++) stats.push({ i, ...colStats(sample, i) });

  const used = new Set();
  const take = (pred, score) => {
    const cands = stats
      .filter((s) => !used.has(s.i) && pred(s))
      .sort((a, b) => score(b) - score(a));
    if (!cands.length) return -1;
    used.add(cands[0].i);
    return cands[0].i;
  };

  // Gender first: its values are alphabetic and would otherwise look like names.
  const gender = take((s) => s.gender > 0.7 && s.distinct <= 8, (s) => s.gender);
  const phone = take((s) => s.phone > 0.6, (s) => s.phone);
  const age = take((s) => s.age > 0.7 && s.distinct > 3, (s) => s.age);

  const nameCols = stats
    .filter((s) => !used.has(s.i) && s.name > 0.6 && s.filled > 0.4)
    .sort((a, b) => b.name - a.name || a.i - b.i);

  let first = -1;
  let last = -1;
  let whole = -1;
  if (nameCols.length >= 2) {
    const ordered = nameCols.slice(0, 2).sort((a, b) => a.i - b.i);
    first = ordered[0].i;
    last = ordered[1].i;
  } else if (nameCols.length === 1) {
    if (nameCols[0].spaced > 0.4) whole = nameCols[0].i;
    else first = nameCols[0].i;
  }
  return { first, last, whole, phone, gender, age };
}

/* Turns raw rows into records keyed the way the importers expect. */
function inferRecords(rows) {
  // Title banners and spacer lines have almost nothing in them.
  let body = rows.filter((r) => r.filter((c) => String(c == null ? "" : c).trim() !== "").length >= 2);
  if (!body.length) return { records: [], found: [] };

  const map = inferColumns(body);

  // If the top row does not fit the columns detected below it, it is a header.
  if (body.length > 1) {
    const r0 = body[0];
    const cell = (i) => String(i >= 0 ? r0[i] || "" : "").trim();
    const phoneBad = map.phone >= 0 && cell(map.phone).replace(/[^0-9]/g, "").length < 7;
    const genderBad =
      map.gender >= 0 && !GENDER_TOKENS.has(cell(map.gender).toLowerCase().replace(/[^a-z]/g, ""));
    const ageBad = map.age >= 0 && !/^\d{1,2}$/.test(cell(map.age));
    if (phoneBad || genderBad || ageBad) body = body.slice(1);
  }

  const at = (r, i) => (i >= 0 ? String(r[i] == null ? "" : r[i]).trim() : "");
  const records = body
    .map((r) => ({
      firstname: at(r, map.first),
      lastname: at(r, map.last),
      name: at(r, map.whole),
      phone: at(r, map.phone),
      gender: at(r, map.gender),
      age: at(r, map.age),
    }))
    .filter((o) => o.firstname || o.lastname || o.name);
  const found = [];
  if (map.first >= 0 || map.whole >= 0) found.push("name");
  if (map.last >= 0) found.push("last name");
  if (map.phone >= 0) found.push("phone");
  if (map.gender >= 0) found.push("gender");
  if (map.age >= 0) found.push("age");
  return { records, found };
}

/* Header mode when the headers are usable, content mode otherwise. */
function buildRecords(rows) {
  if (!rows.length) return { records: [], headers: [], mode: "none" };

  const byHeader = rowsToObjects(rows);
  const named = byHeader.records.filter((o) => {
    const n = readName(o);
    return n.first || n.last;
  });

  if (byHeader.headers.length && named.length >= Math.max(1, byHeader.records.length * 0.5)) {
    return { ...byHeader, mode: "headers" };
  }

  // Headers were no help. Drop a header-looking first row, then read the data itself.
  const headerish = rows[0].filter((c) => normKey(c)).some((c) => KNOWN_HEADERS.includes(normKey(c)));
  const body = headerish ? rows.slice(1) : rows;
  const inferred = inferRecords(body);
  if (inferred.records.length) {
    return { records: inferred.records, headers: inferred.found, mode: "detected" };
  }
  return { ...byHeader, mode: "headers" };
}
function guessGenderFromName(first) {
  const n = String(first || "").trim().toLowerCase().replace(/[^a-z]/g, "");
  if (n.length < 3) return null;
  if (NAME_F.has(n)) return "Female";
  if (NAME_M.has(n)) return "Male";
  for (const s of SUFFIX_F) if (n.endsWith(s) && n.length > s.length) return "Female";
  for (const s of SUFFIX_M) if (n.endsWith(s) && n.length > s.length) return "Male";
  return null;
}

/* Import / export bar shown on every page */
function DataBar({ name, columns, rows, onImport, note, notify }) {
  const [pasteOpen, setPasteOpen] = useState(false);
  const [pasteText, setPasteText] = useState("");
  const fileRef = useRef(null);

  const table = [columns, ...rows];

  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const isExcel = /\.(xlsx|xlsm|xls)$/i.test(file.name);

    const finish = (rows) => {
      const { records, headers, mode } = buildRecords(rows);
      if (!records.length) {
        notify("Could not find any rows of people in that file. Try the Paste from Sheets option.");
        return;
      }
      onImport(records, headers, mode);
    };

    const reader = new FileReader();
    reader.onload = () => {
      if (isExcel) {
        if (!window.XLSX) {
          notify("Excel support did not load. Save the sheet as CSV and import that instead.");
          return;
        }
        try {
          const wb = window.XLSX.read(new Uint8Array(reader.result), { type: "array" });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = window.XLSX.utils
            .sheet_to_json(sheet, { header: 1, blankrows: false, defval: "" })
            .map((r) => r.map((c) => String(c == null ? "" : c)));
          finish(rows.filter((r) => r.some((c) => String(c).trim() !== "")));
        } catch (err) {
          notify("That Excel file could not be read. Save it as CSV and try again.");
        }
        return;
      }
      const text = String(reader.result);
      if (text.slice(0, 2) === "PK") {
        notify("That looks like an Excel file saved with the wrong extension. Rename it to .xlsx or save as CSV.");
        return;
      }
      finish(parseDelimited(text));
    };

    if (isExcel) reader.readAsArrayBuffer(file);
    else reader.readAsText(file, "utf-8");
    e.target.value = "";
  };

  return (
    <div className="databar">
      <div className="databar-left">
        <span className="databar-tag">Data</span>
        <span className="databar-count">
          {rows.length} {rows.length === 1 ? "row" : "rows"}
        </span>
        {note ? <span className="databar-note">{note}</span> : null}
      </div>
      <div className="databar-right">
        <button
          className="btn btn-ghost"
          onClick={() => download(`${name}.csv`, toDelimited(table, ","))}
        >
          Export CSV
        </button>
        <button
          className="btn btn-ghost"
          onClick={async () => {
            const ok = await copyText(toDelimited(table, "\t"));
            notify(
              ok
                ? "Copied. Open your Google Sheet and paste into cell A1."
                : "Copy failed — use Export CSV and import the file into Sheets."
            );
          }}
        >
          Copy for Google Sheets
        </button>
        {onImport ? (
          <>
            <button className="btn btn-ghost" onClick={() => fileRef.current.click()}>
              Import file
            </button>
            <button className="btn btn-ghost" onClick={() => setPasteOpen(true)}>
              Paste from Sheets
            </button>
            <input
              ref={fileRef}
              type="file"
              accept=".csv,.tsv,.txt,.xlsx,.xlsm,.xls,text/csv"
              onChange={handleFile}
              style={{ display: "none" }}
            />
          </>
        ) : null}
      </div>

      {pasteOpen ? (
        <div className="modal-wrap" onClick={() => setPasteOpen(false)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <h3>Paste from Google Sheets</h3>
            <p className="muted">
              Select the cells in your sheet including the header row, copy, and paste them here.
            </p>
            <textarea
              value={pasteText}
              onChange={(e) => setPasteText(e.target.value)}
              rows={8}
              placeholder={columns.join("\t")}
            />
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={() => setPasteOpen(false)}>
                Cancel
              </button>
              <button
                className="btn btn-primary"
                onClick={() => {
                  const { records, headers, mode } = buildRecords(parseDelimited(pasteText));
                  if (!records.length) {
                    notify("Nothing to import. Select the cells with the players in them and copy again.");
                    return;
                  }
                  onImport(records, headers, mode);
                  setPasteText("");
                  setPasteOpen(false);
                }}
              >
                Import rows
              </button>
            </div>
          </div>
        </div>
      ) : null}
    </div>
  );
}

function PlayersTab({ data, update, tiers, notify }) {
  const blank = { first: "", last: "", gender: "Male", phone: "", flat: "" };
  const [form, setForm] = useState(blank);
  const [editing, setEditing] = useState(null);
  const [q, setQ] = useState("");
  const [catFilter, setCatFilter] = useState("all");

  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const save = () => {
    if (!form.first.trim()) {
      notify("A first name is needed to add a player.");
      return;
    }
    if (editing) {
      update((d) => ({
        ...d,
        players: d.players.map((p) => (p.id === editing ? { ...p, ...form, catSource: "manual" } : p)),
      }));
      setEditing(null);
    } else {
      update((d) => ({
        ...d,
        players: [...d.players, { id: uid(), ...form, cal: blankCal(), catSource: "manual" }],
      }));
    }
    setForm(blank);
  };

  const remove = (id) => {
    update((d) => ({
      ...d,
      players: d.players.filter((p) => p.id !== id),
      teams: d.teams.map((t) => ({ ...t, playerIds: t.playerIds.filter((x) => x !== id) })),
      matches: d.matches.filter((m) => m.playerA !== id && m.playerB !== id),
    }));
  };

  const list = data.players
    .filter((p) =>
      catFilter === "all"
        ? true
        : catFilter === "review"
        ? p.catSource === "guess" || p.catSource === "default" || !p.catSource
        : p.gender === catFilter
    )
    .filter((p) => {
      const s = q.trim().toLowerCase();
      if (!s) return true;
      return (fullName(p) + " " + p.phone).toLowerCase().includes(s);
    });

  const columns = ["First Name", "Last Name", "Gender", "Phone", "Flat", "Tier", "Calibration Score"];
  const rows = data.players.map((p) => [
    p.first,
    p.last,
    p.gender,
    p.phone,
    p.flat || "",
    tiers[p.id] ? tiers[p.id].tier : "",
    isCalibrated(p) ? calScore(p).toFixed(2) : "",
  ]);

  const onImport = (objs, headers, mode) => {
    let added = 0;
    let merged = 0;
    let skipped = 0;
    let possibleDupes = 0;
    const dupeNames = [];
    let availRows = 0;

    const currentYear = Number(String(data.availabilityStart || "").slice(0,4)) || new Date().getFullYear();
    const inferredYear = inferImportYear(objs, currentYear);

    update((d) => {
      const players = d.players.slice();
      const availability = { ...(d.availability || {}) };

      // If this is a new season, automatically roll the configured tournament
      // window to the year detected from the Google Form / Excel data.
      const rollYear = (ymd, yr) => /^\d{4}-\d{2}-\d{2}$/.test(ymd || "")
        ? `${yr}${ymd.slice(4)}`
        : ymd;
      const effectiveStart = inferredYear && inferredYear !== currentYear
        ? rollYear(d.availabilityStart, inferredYear)
        : d.availabilityStart;
      const effectiveEnd = inferredYear && inferredYear !== currentYear
        ? rollYear(d.availabilityEnd, inferredYear)
        : d.availabilityEnd;

      objs.forEach((o) => {
        const { first, last } = readName(o);
        if (!first && !last) {
          skipped++;
          return;
        }
        const phone = readPhone(o);
        const flat = readFlat(o);
        const rawSex = pick(o, F_GENDER);
        const rawCat = pick(o, F_AGEGROUP);
        const rawAge = pick(o, F_AGE);
        const hasCatColumn = rawSex !== "" || rawCat !== "" || rawAge !== "";
        const guessed = normSex(rawSex) || normSex(rawCat) ? null : guessGenderFromName(first);
        const gender = resolveCategory(rawSex, rawCat, rawAge, guessed);
        const catSource = hasCatColumn ? "file" : guessed ? "guess" : "default";

        // Identity is first + last name only. Phone is stored but never used
        // to tell people apart, because families share one number.
        const nameKey = (f, l) => (f + "|" + l).toLowerCase().replace(/\s+/g, " ").trim();
        const thisKey = nameKey(first, last);
        const masterImport = d.players.length === 0;
        let idx = masterImport ? -1 : players.findIndex((p) => nameKey(p.first, p.last) === thisKey);
        if (!masterImport && idx >= 0) dupeNames.push(`${first} ${last}`.trim());

        const cal = blankCal();
        let hasCal = false;
        SKILLS.forEach((s) => {
          const v = pick(o, [s.label]);
          if (v !== "") {
            cal[s.key] = Math.max(0, Math.min(5, Number(v) || 0));
            hasCal = true;
          }
        });

        const slotsByDate = readAvailability(o, inferredYear, effectiveStart, effectiveEnd);

        if (idx >= 0) {
          // Duplicate name: keep the first row's spelling and phone.
          // A category you set by hand outranks a guess from a later import.
          const keepExisting = players[idx].catSource === "manual" && !hasCatColumn;
          players[idx] = {
            ...players[idx],
            phone: players[idx].phone || phone,
            flat: players[idx].flat || flat,
            gender: keepExisting ? players[idx].gender : gender,
            catSource: keepExisting ? "manual" : catSource,
            cal: hasCal ? cal : players[idx].cal,
          };
          merged++;
        } else {
          const incoming = { id: uid(), first, last, gender, phone, flat, cal, catSource };
          const maybe = players.find((p) => looksLikeSamePerson(p, incoming));
          if (maybe) {
            incoming.possibleDuplicateOf = maybe.id;
            incoming.duplicateReason =
              (phone && maybe.phone && cleanPhone(phone) === cleanPhone(maybe.phone) ? "same phone + similar name" :
               flat && maybe.flat && normKey(flat) === normKey(maybe.flat) ? "same flat + similar name" :
               "similar player details");
            possibleDupes++;
          }
          players.push(incoming);
          added++;
        }

        // Availability columns on the same row, if the sheet has them.
        const pid = players[idx >= 0 ? idx : players.length - 1].id;
        Object.keys(slotsByDate).forEach((date) => {
          const key = pid + "|" + date;
          const cur = availability[key] || [];
          const next = cur.slice();
          slotsByDate[date].forEach((sl) => {
            if (!next.includes(sl)) next.push(sl);
          });
          if (next.length) {
            availability[key] = next;
            availRows++;
          }
        });
      });
      const finalCounts = {
        Male: players.filter((p) => p.gender === "Male").length,
        Female: players.filter((p) => p.gender === "Female").length,
        Boy: players.filter((p) => p.gender === "Boy").length,
        Girl: players.filter((p) => p.gender === "Girl").length,
      };
      window.__ttLastImportCounts = finalCounts;
      return { ...d, players, availability, availabilityStart: effectiveStart, availabilityEnd: effectiveEnd };
    });

    if (added === 0 && merged === 0) {
      notify(
        "No names found in that file. Columns seen: " + (headers || []).join(", ")
      );
    } else {
      const cats = objs.map((o) => {
        const rawSex = pick(o, F_GENDER);
        const rawCat = pick(o, F_AGEGROUP);
        const rawAge = pick(o, F_AGE);
        if (rawSex !== "" || rawCat !== "" || rawAge !== "") {
          return { g: resolveCategory(rawSex, rawCat, rawAge, null), src: "file" };
        }
        const g = guessGenderFromName(readName(o).first);
        return { g: g || "Male", src: g ? "guess" : "default" };
      });
      const men = cats.filter((c) => c.g === "Male").length;
      const women = cats.filter((c) => c.g === "Female").length;
      const boys = cats.filter((c) => c.g === "Boy").length;
      const girls = cats.filter((c) => c.g === "Girl").length;
      const fromFile = cats.filter((c) => c.src === "file").length;
      const unknown = cats.filter((c) => c.src === "default").length;
      notify(
        `${objs.length} rows read → ${added} added, ${merged} matched an existing player` +
          (skipped ? `, ${skipped} had no name` : "") +
          `. Adult Male ${men}, Adult Female ${women}, Kids Male ${boys}, Kids Female ${girls}. ` +
          (availRows
            ? `Availability read for ${availRows} player-days. `
            : `No availability was detected in the imported rows. `) +
          (inferredYear !== currentYear
            ? `Tournament year automatically changed from ${currentYear} to ${inferredYear}. `
            : `Tournament year detected as ${inferredYear}. `) +
          (possibleDupes
            ? `${possibleDupes} possible duplicate ${possibleDupes === 1 ? "entry needs" : "entries need"} review. `
            : "") +
          (dupeNames.length
            ? `${dupeNames.length} duplicate ${dupeNames.length === 1 ? "name" : "names"} folded into one: ` +
              dupeNames.slice(0, 6).join(", ") +
              (dupeNames.length > 6 ? ` and ${dupeNames.length - 6} more. ` : ". ")
            : "") +
          (mode === "detected" ? `Columns detected: ${(headers || []).join(", ")}. ` : "") +
          (fromFile
            ? "Read from your file."
            : `Guessed from first names; ${unknown} could not be matched. Filter to Needs review to fix those.`) +
          (window.__ttLastImportCounts
            ? ` Final roll: Adult Male ${window.__ttLastImportCounts.Male}, Adult Female ${window.__ttLastImportCounts.Female}, Kids Male ${window.__ttLastImportCounts.Boy}, Kids Female ${window.__ttLastImportCounts.Girl}. Total ${window.__ttLastImportCounts.Male + window.__ttLastImportCounts.Female + window.__ttLastImportCounts.Boy + window.__ttLastImportCounts.Girl}.`
            : "")
      );
    }
  };

  const duplicatePlayers = data.players.filter((p) => p.possibleDuplicateOf);

  const keepDuplicateSeparate = (id) => {
    update((d) => ({
      ...d,
      players: d.players.map((p) =>
        p.id === id ? { ...p, possibleDuplicateOf: null, duplicateReason: null } : p
      ),
    }));
    notify("Kept as a separate player.");
  };

  const mergePossibleDuplicate = (id) => {
    update((d) => {
      const dup = d.players.find((p) => p.id === id);
      if (!dup || !dup.possibleDuplicateOf) return d;
      const master = d.players.find((p) => p.id === dup.possibleDuplicateOf);
      if (!master) return d;

      const players = d.players
        .filter((p) => p.id !== dup.id)
        .map((p) => p.id === master.id ? {
          ...p,
          phone: p.phone || dup.phone,
          flat: p.flat || dup.flat,
          cal: isCalibrated(dup) && !isCalibrated(p) ? dup.cal : p.cal,
        } : p);

      const availability = { ...(d.availability || {}) };
      Object.keys(availability).forEach((k) => {
        if (!k.startsWith(dup.id + "|")) return;
        const date = k.slice(dup.id.length + 1);
        const masterKey = master.id + "|" + date;
        availability[masterKey] = Array.from(new Set([
          ...(availability[masterKey] || []),
          ...(availability[k] || []),
        ]));
        delete availability[k];
      });

      const teams = d.teams.map((t) => ({
        ...t,
        playerIds: Array.from(new Set(t.playerIds.map((pid) => pid === dup.id ? master.id : pid))),
      }));
      const matches = d.matches.map((m) => ({
        ...m,
        playerA: m.playerA === dup.id ? master.id : m.playerA,
        playerB: m.playerB === dup.id ? master.id : m.playerB,
      }));

      return { ...d, players, availability, teams, matches };
    });
    notify("Duplicate entries merged into one player.");
  };

  const roll = CATEGORIES.map((c) => {
    const inCat = data.players.filter((p) => p.gender === c.key);
    return {
      ...c,
      count: inCat.length,
      rated: inCat.filter(isCalibrated).length,
      review: inCat.filter((p) => p.catSource === "guess" || p.catSource === "default" || !p.catSource).length,
    };
  });

  return (
    <div className="stack">
      <DataBar
        name="players"
        columns={columns}
        rows={rows}
        onImport={onImport}
        note="Google Form smart import: detects Adult/Kids, phone/flat, Availability, season year and possible duplicate players. Exact duplicate names are merged; uncertain matches are sent to Duplicate review."
        notify={notify}
      />

      {duplicatePlayers.length ? (
        <section className="card">
          <header className="card-head">
            <div>
              <span className="eyebrow">Duplicate review</span>
              <h2>Possible duplicate players</h2>
            </div>
            <span className="badge badge-warn">{duplicatePlayers.length} to review</span>
          </header>
          <p className="muted plan-note">
            TT Pulse does not delete these automatically. Shared family phone numbers and flat numbers are allowed.
            Review the suggested match and choose Merge or Keep separate.
          </p>
          <div className="table-scroll">
            <table>
              <thead><tr><th>Imported entry</th><th>Possible match</th><th>Why flagged</th><th>Action</th></tr></thead>
              <tbody>
                {duplicatePlayers.map((p) => {
                  const match = data.players.find((x) => x.id === p.possibleDuplicateOf);
                  return (
                    <tr key={p.id}>
                      <td><strong>{fullName(p)}</strong><div className="muted small">{p.phone || "No phone"} · {p.flat || "No flat"}</div></td>
                      <td>{match ? <><strong>{fullName(match)}</strong><div className="muted small">{match.phone || "No phone"} · {match.flat || "No flat"}</div></> : "Match no longer exists"}</td>
                      <td>{p.duplicateReason || "Similar details"}</td>
                      <td>
                        <div className="row-actions">
                          <button className="btn btn-tiny" onClick={() => mergePossibleDuplicate(p.id)} disabled={!match}>Merge</button>
                          <button className="btn btn-tiny btn-ghost" onClick={() => keepDuplicateSeparate(p.id)}>Keep separate</button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </section>
      ) : null}

      {data.players.length > 0 ? (
        <section className="card">
          <header className="card-head">
            <h2>Who came in</h2>
            <span className="muted">{data.players.length} players on the roll</span>
          </header>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(250px,1fr))",gap:"14px"}}>
            <div className="card" style={{margin:0}}>
              <header className="card-head">
                <h3>Adults</h3>
                <strong className="mono">{roll[0].count + roll[1].count}</strong>
              </header>
              <div className="roll">
                {roll.slice(0,2).map((c) => (
                  <button key={c.key}
                    className={"roll-cell" + (catFilter === c.key ? " on" : "")}
                    onClick={() => setCatFilter(catFilter === c.key ? "all" : c.key)}>
                    <span className="roll-num mono">{c.count}</span>
                    <em>{c.key === "Male" ? "Male" : "Female"}</em>
                    <small>{c.rated} rated{c.review ? ` · ${c.review} to check` : ""}</small>
                  </button>
                ))}
              </div>
            </div>
            <div className="card" style={{margin:0}}>
              <header className="card-head">
                <h3>Kids</h3>
                <strong className="mono">{roll[2].count + roll[3].count}</strong>
              </header>
              <div className="roll">
                {roll.slice(2,4).map((c) => (
                  <button key={c.key}
                    className={"roll-cell side" + (catFilter === c.key ? " on" : "")}
                    onClick={() => setCatFilter(catFilter === c.key ? "all" : c.key)}>
                    <span className="roll-num mono">{c.count}</span>
                    <em>{c.key === "Boy" ? "Male" : "Female"}</em>
                    <small>{c.rated} rated{c.review ? ` · ${c.review} to check` : ""}</small>
                  </button>
                ))}
              </div>
            </div>
          </div>
          <div className="notice" style={{marginTop:"14px"}}>
            <strong>Total entries: {data.players.length}</strong>
            <span>Adults {roll[0].count + roll[1].count} + Kids {roll[2].count + roll[3].count} = {data.players.length}. This total should match the number of valid participant rows imported from your master file.</span>
          </div>
        </section>
      ) : null}

      <section className="card">
        <header className="card-head">
          <h2>{editing ? "Edit player" : "Add a new player"}</h2>
          {editing ? (
            <button
              className="btn btn-ghost"
              onClick={() => {
                setEditing(null);
                setForm(blank);
              }}
            >
              Cancel edit
            </button>
          ) : null}
        </header>
        <div className="grid-form">
          <Field label="First name">
            <input value={form.first} onChange={(e) => set("first", e.target.value)} placeholder="Rohan" />
          </Field>
          <Field label="Last name">
            <input value={form.last} onChange={(e) => set("last", e.target.value)} placeholder="Mehta" />
          </Field>
          <Field label="Category">
            <select value={form.gender} onChange={(e) => set("gender", e.target.value)}>
              {CATEGORIES.map((c) => (
                <option key={c.key} value={c.key}>
                  {c.label}
                </option>
              ))}
            </select>
          </Field>
          <Field label="Phone number">
            <input value={form.phone} onChange={(e) => set("phone", e.target.value)} placeholder="98XXXXXXXX" />
          </Field>
          <Field label="Calibration tier" hint="Set automatically once the player is rated.">
            <input
              readOnly
              value={editing && tiers[editing] ? "Tier " + tiers[editing].tier : "Pending calibration"}
              className="readonly"
            />
          </Field>
          <div className="field field-action">
            <button className="btn btn-primary" onClick={save}>
              {editing ? "Save changes" : "Add player"}
            </button>
          </div>
        </div>
      </section>

      <section className="card">
        <header className="card-head">
          <h2>Existing players</h2>
          <div className="head-tools">
            <input
              className="search"
              value={q}
              onChange={(e) => setQ(e.target.value)}
              placeholder="Search name or phone"
            />
            <select value={catFilter} onChange={(e) => setCatFilter(e.target.value)}>
              <option value="all">All categories</option>
              {CATEGORIES.map((c) => (
                <option key={c.key} value={c.key}>
                  {c.label}
                </option>
              ))}
              <option value="review">Needs review</option>
            </select>
            <button
              className="btn btn-tiny"
              onClick={() => {
                if (!confirm("RESET ALL TOURNAMENT DATA? This will clear players, registrations, availability, teams, fixtures, matches, bonuses and old imported/demo data. Access codes and the TT Pulse name will be kept.")) return;
                update((d) => ({
                  ...EMPTY,
                  tournamentName: d.tournamentName || "TT Pulse",
                  codes: d.codes || freshCodes(),
                  players: [],
                  registrations: [],
                  availability: {},
                  teams: [],
                  matches: [],
                  fixtures: [],
                  bonuses: {},
                  refDuty: {},
                  tierPlan: {},
                  tierCounts: { ...EMPTY.tierCounts },
                }));
                setEditing(null);
                setForm(blank);
                setQ("");
                setCatFilter("all");
                try { localStorage.removeItem("tt_last_callup"); } catch(e) {}
                notify("RESET COMPLETE — Total entries 0. Now import the master Excel file. Adults and Kids will be split into Male and Female from the file.");
              }}
            >
              RESET DATA BEFORE IMPORT
            </button>
            <button
              className="btn btn-tiny"
              onClick={() => {
                let hit = 0;
                update((d) => ({
                  ...d,
                  players: d.players.map((p) => {
                    if (p.catSource === "manual" || p.catSource === "file") return p;
                    const g = guessGenderFromName(p.first);
                    if (!g) return p;
                    hit++;
                    // A junior stays a junior; only the sex half is re-read.
                    const next = isKid(p.gender) ? (g === "Female" ? "Girl" : "Boy") : g;
                    return { ...p, gender: next, catSource: "guess" };
                  }),
                }));
                notify(hit ? `${hit} categories set from first names.` : "No further names could be matched.");
              }}
            >
              Detect from names
            </button>
            <select
              value=""
              onChange={(e) => {
                const to = e.target.value;
                if (!to) return;
                const ids = new Set(list.map((p) => p.id));
                update((d) => ({
                  ...d,
                  players: d.players.map((p) => (ids.has(p.id) ? { ...p, gender: to, catSource: "manual" } : p)),
                }));
                notify(`${ids.size} players moved to ${catLabel(to)}.`);
                e.target.value = "";
              }}
            >
              <option value="">Move the {list.length} shown to…</option>
              {CATEGORIES.map((c) => (
                <option key={c.key} value={c.key}>
                  {c.label}
                </option>
              ))}
            </select>
          </div>
        </header>

        {list.length === 0 ? (
          <Empty
            title="No players yet"
            body="Add players one at a time above, or import a CSV exported from your society sheet."
          />
        ) : (
          <div className="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Phone</th>
                  <th>Rating</th>
                  <th>Tier</th>
                  <th />
                </tr>
              </thead>
              <tbody>
                {list.map((p) => (
                  <tr key={p.id}>
                    <td className="strong">{fullName(p)}</td>
                    <td>
                      <select
                        className={"cat-select" + (p.catSource === "guess" || p.catSource === "default" ? " unsure" : "")}
                        value={p.gender}
                        onChange={(e) =>
                          update((d) => ({
                            ...d,
                            players: d.players.map((x) =>
                              x.id === p.id ? { ...x, gender: e.target.value, catSource: "manual" } : x
                            ),
                          }))
                        }
                        title={
                          p.catSource === "guess"
                            ? "Guessed from the first name — confirm it"
                            : p.catSource === "default"
                            ? "Could not be determined — please set it"
                            : ""
                        }
                      >
                        {CATEGORIES.map((c) => (
                          <option key={c.key} value={c.key}>
                            {c.label}
                          </option>
                        ))}
                      </select>
                    </td>
                    <td className="mono">{p.phone || "—"}</td>
                    <td>
                      {isCalibrated(p) ? (
                        <span className="rating-cell">
                          <Stars value={calScore(p)} />
                          <b className="mono">{calScore(p).toFixed(2)}</b>
                        </span>
                      ) : (
                        <span className="muted">—</span>
                      )}
                    </td>
                    <td>
                      <TierChip tier={tiers[p.id] && isCalibrated(p) ? tiers[p.id].tier : null} />
                    </td>
                    <td className="row-actions">
                      <button
                        className="btn btn-tiny"
                        onClick={() => {
                          setEditing(p.id);
                          setForm({ first: p.first, last: p.last, gender: p.gender, phone: p.phone });
                          window.scrollTo({ top: 0, behavior: "smooth" });
                        }}
                      >
                        Edit
                      </button>
                      <button className="btn btn-tiny btn-danger" onClick={() => remove(p.id)}>
                        Remove
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </section>
    </div>
  );
}

/* ============================================================
   Tab: Availability
   ============================================================ */

function AvailabilityTab({ data, update, notify }) {
  const [playerId, setPlayerId] = useState("");
  const [ageFilter, setAgeFilter] = useState("all");
  const workPlayers = data.players.filter((p) => ageGroupMatch(p, ageFilter));
  const configuredStart = /^\d{4}-\d{2}-\d{2}$/.test(data.availabilityStart || "")
    ? new Date((data.availabilityStart || "") + "T00:00:00")
    : new Date();
  const [month, setMonth] = useState(configuredStart.getMonth());
  const [year, setYear] = useState(Math.max(CAL_MIN_YEAR, configuredStart.getFullYear()));
  const [openDay, setOpenDay] = useState(null);

  const years = [];
  for (let y = CAL_MIN_YEAR; y <= CAL_MAX_YEAR; y++) years.push(y);

  const first = new Date(year, month, 1);
  const startPad = first.getDay();
